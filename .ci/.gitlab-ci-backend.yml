backend-lint:
  stage: lint
  image: golangci/golangci-lint:v2.1.6
  extends:
    - .build-runner
    - .backend-changes
  cache:
    key: "$CI_JOB_IMAGE-go"
    paths:
      - .cache/go-build/
      - .cache/go-mod/
  before_script:
    - mkdir -p "$GOCACHE" "$GOMODCACHE"
    - cd backend
  script:
    - golangci-lint run --config=.golangci.yml --timeout=5m

backend-test:
  stage: test
  extends:
    - .go-job
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: cerbixtest
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    # Enables the opt-in store integration tests against the service Postgres.
    CERBIX_TEST_DATABASE_DSN: "postgres://test:test@postgres:5432/cerbixtest?sslmode=disable"
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
    - |
      total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')"
      awk "BEGIN { exit !($total >= $COVERAGE_GATE) }" || {
        echo "coverage $total% below gate $COVERAGE_GATE%" >&2
        exit 1
      }
  coverage: '/^total:.*\s(\d+\.\d+)%/'

backend-build:
  stage: build
  extends:
    - .go-job
  # Pull the freshly-built SPA when frontend-check ran this pipeline (always on
  # main/tags — i.e. releases). Optional: on a backend-only MR it won't run and we
  # fall back to the committed SPA snapshot in internal/web/dist.
  needs:
    - job: frontend-check
      optional: true
      artifacts: true
  script:
    - |
      if [ -d ../frontend/dist ]; then
        rm -rf internal/web/dist && cp -r ../frontend/dist internal/web/dist
        echo "embedded freshly-built SPA into the binary"
      else
        echo "using committed SPA snapshot (frontend not rebuilt this pipeline)"
      fi
    - export VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export COMMIT="${CI_COMMIT_SHA}"
    - export GOOS=linux GOARCH=amd64
    - ./scripts/build-native-binary.sh
    - sha256sum dist/release/cerbix-linux | tee dist/release/cerbix-linux.sha256
    - dist/release/cerbix-linux version
  artifacts:
    expire_in: 30 days
    paths:
      - backend/dist/release/
