variables:
  GOTOOLCHAIN: "local"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOFLAGS: "-mod=readonly -buildvcs=false"
  COVERAGE_GATE: "70"

.pipeline-rules:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.build-runner:
  tags:
    - devops-general

# Backend jobs only run when backend files change.
.backend-changes:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .ci/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'

.go-job:
  image: golang:1.24-bookworm
  extends:
    - .build-runner
    - .backend-changes
  cache:
    key: "$CI_JOB_IMAGE-go"
    paths:
      - .cache/go-build/
      - .cache/go-mod/
  before_script:
    - mkdir -p "$GOCACHE" "$GOMODCACHE"
    - cd backend
