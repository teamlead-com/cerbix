name: ✨ Feature Request
description: Suggest a new feature or improvement for cerbix
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for cerbix! Please check existing issues and `docs/decisions.md` to see if your proposal has already been discussed.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: I'm frustrated when I try to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
      placeholder: Add a new prober type / notification channel / API endpoint that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Guidelines
      description: By submitting this feature request, you agree to follow our Code of Conduct.
      options:
        - label: I have searched existing issues and decision records (`docs/decisions.md`).
          required: true
        - label: I agree to follow cerbix's [Code of Conduct](https://github.com/your-org/cerbix/blob/main/CODE_OF_CONDUCT.md).
          required: true
