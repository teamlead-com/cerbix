version: 2
# Grouped updates: instead of one PR per dependency (which produced ~20 PRs on the
# first run), each ecosystem opens a SINGLE PR bundling all minor+patch bumps.
# Major bumps still open their own PRs (they can break and deserve individual review).
updates:
  # Go backend
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "build(deps)"

  # Vue 3 frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "build(deps-frontend)"

  # Dockerfile base images — group everything (few, low-risk)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions — group everything (version/SHA bumps, low-risk)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
