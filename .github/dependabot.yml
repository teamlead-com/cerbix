version: 2
# Update policy, tuned for a repository where dependencies are swept deliberately
# rather than merged as they arrive (iter-0159: patch and minor together, each MAJOR
# alone with its own verification).
#
# Three knobs keep the volume honest without hiding anything:
#   * monthly, not weekly — a sweep is a deliberate act, and a weekly reminder of the
#     same four majors is not new information;
#   * TWO groups per ecosystem — one PR for minor+patch, one PR for ALL majors. A
#     major still gets reviewed on its own before it lands; the grouped PR is the
#     notification, not the merge;
#   * a cooldown, so a version released yesterday is not proposed today and the same
#     PR is not rewritten every time upstream ships a patch.
updates:
  # Go backend
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-modules-major:
        patterns: ["*"]
        update-types: ["major"]
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "build(deps)"

  # Vue 3 frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      time: "04:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-major:
        patterns: ["*"]
        update-types: ["major"]
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "build(deps-frontend)"

  # Dockerfile base images — few, low-risk, everything in one PR
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions — SHA bumps, low-risk, everything in one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
