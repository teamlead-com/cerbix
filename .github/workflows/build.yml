name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Binaries + source archive
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release on tag builds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --- SPA: built fresh and embedded into every binary -------------------
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf ../backend/internal/web/dist
          cp -r dist ../backend/internal/web/dist

      # --- Cross-compile static binaries -------------------------------------
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build binaries
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::12}"
          LDFLAGS="-s -w \
            -X git.example.com/monitoring/cerbix/internal/buildinfo.Version=${VERSION} \
            -X git.example.com/monitoring/cerbix/internal/buildinfo.Commit=${COMMIT}"
          mkdir -p ../out
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "==> ${GOOS}/${GOARCH}"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "$LDFLAGS" \
              -o "../out/cerbix_${VERSION}_${GOOS}_${GOARCH}" ./cmd/cerbix
          done
          (cd ../out && sha256sum cerbix_* > SHA256SUMS)
          ls -la ../out

      # --- Source archive (tracked files only, incl. the embedded SPA) -------
      - name: Source archive
        run: |
          git archive --format=tar.gz \
            --prefix="cerbix-${GITHUB_REF_NAME}/" \
            -o "out/cerbix_${GITHUB_REF_NAME}_source.tar.gz" HEAD
          (cd out && sha256sum "cerbix_${GITHUB_REF_NAME}_source.tar.gz" >> SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cerbix-${{ github.ref_name }}
          path: out/
          retention-days: 30

      # --- On a v* tag: publish everything as a GitHub Release ---------------
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          generate_release_notes: true
          # -alpha / -beta / -rc tags publish as pre-releases automatically
          prerelease: ${{ contains(github.ref_name, '-') }}
