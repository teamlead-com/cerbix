name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Binaries + source archive
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release on tag builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- SPA: built fresh and embedded into every binary -------------------
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf ../internal/web/dist
          cp -r dist ../internal/web/dist

      # --- Cross-compile static binaries -------------------------------------
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::12}"
          LDFLAGS="-s -w \
            -X github.com/teamlead-com/cerbix/internal/buildinfo.Version=${VERSION} \
            -X github.com/teamlead-com/cerbix/internal/buildinfo.Commit=${COMMIT}"
          mkdir -p out
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "==> ${GOOS}/${GOARCH}"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/cerbix_${VERSION}_${GOOS}_${GOARCH}" ./cmd/cerbix
          done
          (cd out && sha256sum cerbix_* > SHA256SUMS)
          ls -la out

      # --- Source archive (tracked files only, incl. the embedded SPA) -------
      - name: Source archive
        run: |
          git archive --format=tar.gz \
            --prefix="cerbix-${GITHUB_REF_NAME}/" \
            -o "out/cerbix_${GITHUB_REF_NAME}_source.tar.gz" HEAD
          (cd out && sha256sum "cerbix_${GITHUB_REF_NAME}_source.tar.gz" >> SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cerbix-${{ github.ref_name }}
          path: out/
          retention-days: 30

      # --- On a v* tag: publish everything as a GitHub Release ---------------
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: out/*
          generate_release_notes: true
          # -alpha / -beta / -rc tags publish as pre-releases automatically
          prerelease: ${{ contains(github.ref_name, '-') }}
