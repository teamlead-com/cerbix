name: Security

on:
  schedule:
    - cron: "0 3 * * *" # nightly: vulnerabilities appear without code changes
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities (call-graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Pinned, not @latest: this workflow builds with the go.mod toolchain (GOTOOLCHAIN=local), and
      # an @latest scanner that needs a newer Go fails to install and leaves the nightly gate red
      # without scanning anything (iter-0200). v1.9.0 runs on the go.mod floor (Go 1.26.10, iter-0208);
      # bump it together with the Go toolchain. The vulnerability DATABASE is still fetched live, so
      # a pinned scanner keeps seeing new advisories.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history — a secret deleted by a later commit still leaks
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --log-opts="--all" --redact --verbose

  npm-audit:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
