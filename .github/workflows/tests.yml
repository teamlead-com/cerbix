name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, vet, gofmt, race tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cerbixtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Docs references and FR-021 discharge (make docs-check)
        # D-0169 closes FR-021 "against the discharge tables … and the gate keeps them true". A gate
        # that only runs when a human types it is a checklist, so it runs here: every path and Test*
        # name cited by a LIVING document must resolve, and all 91 invariants + 24 required scenarios
        # must have a row.
        run: make docs-check
      - name: Tests (-race, DB-gated suites against the service container)
        env:
          CERBIX_TEST_DATABASE_DSN: postgres://test:test@localhost:5432/cerbixtest?sslmode=disable
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (type-check, build, schema drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: API schema drift (openapi.yaml changed without regenerating schema.d.ts?)
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts \
            || (echo "::error::schema.d.ts is stale — run 'npm run gen:api' after editing openapi.yaml" && exit 1)
