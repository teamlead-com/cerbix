version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - forbidigo
  disable:
    # Style-heavy linters intentionally deferred to a dedicated cleanup MR.
    - exhaustruct
    - tagliatelle
    - whitespace
  settings:
    forbidigo:
      forbid:
        # Never log raw secrets or bearer tokens.
        - pattern: 'Authorization: Bearer'
        - pattern: client_secret

formatters:
  enable:
    - gofmt
