# HTTP-pull agent config (DB-less, broker-less). Run:
#   cerbix serve --config config.agent.yaml --role agent --region pull1
# It reaches the central API over HTTP only; the region comes from --region.
log: { level: info, format: json }
server:
  listen: ":8080"          # ops endpoints only (/healthz /readyz /metrics)
pull:
  server_url: "http://api:8080"   # central cerbix (api)
  token: "devpulltoken"              # this agent's token (matches central pull.token OR a pull.agents[].token)
# On the CENTRAL side, scope a token to one region instead of a shared catch-all:
#   pull:
#     regions: ["pull1"]
#     agents:
#       - { region: "pull1", token: "pull1-secret" }   # authorizes ONLY pull1
prober:
  allow_private_ips: true            # internal targets in the agent's segment
  allow_metadata_ips: false
