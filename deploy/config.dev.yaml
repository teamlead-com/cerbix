# cerbix local-dev config (used by deploy/docker-compose.yml).
server:
  listen: ":8080"
  healthz_path: "/healthz"
  readyz_path: "/readyz"
  metrics_path: "/metrics"

log:
  level: "debug"
  format: "json"

# Wired in later iterations; present here so the dev stack is representative.
database:
  dsn: "postgres://cerbix:cerbix@10.5.0.10:5432/cerbix?sslmode=disable"

rabbitmq:
  url: "amqp://golang:golang@10.5.0.11:5672/"

oidc:
  issuer: "http://10.5.0.13:8080/realms/cerbix"
  client_id: "cerbix"
  client_secret: "secret"
  redirect_url: "http://localhost:8080/auth/callback"

local:
  enabled: true
  min_password_length: 8

# HTTP-pull transport (demo). --role=all routes these regions the same as the
# distributed scheduler: their jobs and test-connections go to pull_jobs/pull_tests
# for an agent to claim (strict region affinity), NOT the in-process worker. Run a
# --role agent container for each region, or monitors there read stale (no fallback).
pull:
  regions: ["pull1", "geo2"]
  token: "devpulltoken"

# The dev/E2E stack delivers alerts and mail to INTERNAL services (mailpit at 10.5.0.15,
# and any 10.5.0.x webhook target), so it opts into private notification egress. Production
# keeps the deny-private default unless it genuinely delivers to internal endpoints (D-0141).
notification_egress:
  allow_private_ips: true

security:
  admin_email: "admin@cerbix.local"
  admin_password: "devpassword123"
