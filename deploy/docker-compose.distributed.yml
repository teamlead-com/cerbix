# Distributed / geo-worker demo. Overlays the base file: reuses postgres + rabbitmq,
# runs the roles as separate processes against ONE central RabbitMQ.
#
#   # Run DB migration first:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.distributed.yml \
#     run --rm api migrate --config /etc/cerbix/config.yaml
#
#   # Start distributed services with static IPs (10.5.0.20 - 10.5.0.24):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.distributed.yml \
#     up -d postgres rabbitmq mariadb keycloak scheduler api worker-core worker-geo1 worker-geo2
#
name: cerbix

services:
  scheduler:
    image: cerbix-cerbix
    command: ["serve", "--config", "/etc/cerbix/config.yaml", "--role", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.20
    volumes:
      - ./config.dev.yaml:/etc/cerbix/config.yaml:ro

  api:
    image: cerbix-cerbix
    command: ["serve", "--config", "/etc/cerbix/config.yaml", "--role", "api"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.21
    ports:
      - "8082:8080"
    volumes:
      - ./config.dev.yaml:/etc/cerbix/config.yaml:ro

  worker-core:
    image: cerbix-cerbix
    command: ["serve", "--config", "/etc/cerbix/worker.yaml", "--role", "worker", "--region", "core"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.22
    volumes:
      - ./config.worker.yaml:/etc/cerbix/worker.yaml:ro

  worker-geo1:
    image: cerbix-cerbix
    command: ["serve", "--config", "/etc/cerbix/worker.yaml", "--role", "worker", "--region", "geo1"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.23
    volumes:
      - ./config.worker.yaml:/etc/cerbix/worker.yaml:ro

  worker-geo2:
    image: cerbix-cerbix
    command: ["serve", "--config", "/etc/cerbix/agent.yaml", "--role", "agent", "--region", "geo2"]
    depends_on:
      api:
        condition: service_started
    networks:
      default:
        ipv4_address: 10.5.0.24
    volumes:
      - ./config.agent.yaml:/etc/cerbix/agent.yaml:ro
