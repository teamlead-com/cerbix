# cerbix single-geo stack (one region) with static IPs and compose profiles.
#
# Infra (postgres, rabbitmq) always starts; pick HOW cerbix runs via profiles:
#
#   docker compose -f deploy/docker-compose.yml --profile single up -d --build
#       one process, --role all, UI/API on :8080
#
#   docker compose -f deploy/docker-compose.yml --profile distributed up -d --build
#       scheduler + api (:8082) + worker as separate processes over RabbitMQ;
#       apply migrations ONCE first (roles racing a new migration fail):
#       docker compose -f deploy/docker-compose.yml --profile distributed \
#         run --rm api migrate --config /etc/cerbix/config.yaml
#
#   add --profile sso to either to also start Keycloak (:8081) + MariaDB;
#   add --profile mail for Mailpit (:8025 UI/API, :1025 SMTP) — mail-flow E2E/dev.
#
# `single` and `distributed` are mutually exclusive — start one or the other.
#
# Static IP map (subnet 10.5.0.0/16):
#   10.5.0.10  postgres        10.5.0.20  scheduler   (distributed)
#   10.5.0.11  rabbitmq        10.5.0.21  api         (distributed)
#   10.5.0.12  mariadb  (sso)  10.5.0.22  worker      (distributed)
#   10.5.0.13  keycloak (sso)  10.5.0.15  mailpit (mail)
#   10.5.0.14  cerbix   (single)

x-netCaps: &netCaps
  cap_drop:
    - ALL

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "1g"
      max-file: "5"

x-dataCaps: &dataCaps
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

x-cerbix-build: &cerbixBuild
  # Root context: the backend Dockerfile builds the SPA and embeds it into the
  # binary, so one image serves API + auth + SPA (no separate nginx).
  build:
    context: ..
    dockerfile: Dockerfile
  image: cerbix-cerbix

name: cerbix

services:
  # ---- infrastructure (no profile: always starts) --------------------------
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    <<: [*netCaps, *logging, *dataCaps]
    environment:
      POSTGRES_USER: cerbix
      POSTGRES_PASSWORD: cerbix
      POSTGRES_DB: cerbix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 10.5.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerbix"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    <<: [*netCaps, *logging, *dataCaps]
    hostname: cerbix-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: golang
      RABBITMQ_DEFAULT_PASS: golang
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_volume:/var/lib/rabbitmq
    networks:
      default:
        ipv4_address: 10.5.0.11
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- profile: single (everything in one process) -------------------------
  cerbix:
    <<: [*cerbixBuild, *netCaps, *logging]
    profiles: ["single"]
    command: ["serve", "--config", "/etc/cerbix/config.yaml", "--role", "all"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.14
    ports:
      - "8080:8080"
    volumes:
      - ./config.dev.yaml:/etc/cerbix/config.yaml:ro

  # ---- profile: distributed (roles as separate processes) ------------------
  scheduler:
    <<: [*cerbixBuild, *netCaps, *logging]
    profiles: ["distributed"]
    command: ["serve", "--config", "/etc/cerbix/config.yaml", "--role", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.20
    volumes:
      - ./config.dev.yaml:/etc/cerbix/config.yaml:ro

  api:
    <<: [*cerbixBuild, *netCaps, *logging]
    profiles: ["distributed"]
    command: ["serve", "--config", "/etc/cerbix/config.yaml", "--role", "api"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.21
    ports:
      - "8082:8080"
    volumes:
      - ./config.dev.yaml:/etc/cerbix/config.yaml:ro

  worker:
    <<: [*cerbixBuild, *netCaps, *logging]
    profiles: ["distributed"]
    command: ["serve", "--config", "/etc/cerbix/worker.yaml", "--role", "worker", "--region", "core"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 10.5.0.22
    volumes:
      - ./config.worker.yaml:/etc/cerbix/worker.yaml:ro

  # ---- profile: mail (optional Mailpit for mail-flow E2E/dev) ---------------
  mailpit:
    image: axllent/mailpit:v1.21
    <<: [*netCaps, *logging]
    profiles: ["mail"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      default:
        ipv4_address: 10.5.0.15
    ports:
      - "8025:8025"   # web UI + API
      - "1025:1025"   # SMTP

  # ---- profile: sso (optional Keycloak OIDC) --------------------------------
  mariadb:
    image: mariadb:10.9
    <<: [*netCaps, *logging, *dataCaps]
    profiles: ["sso"]
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak
    networks:
      default:
        ipv4_address: 10.5.0.12
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "3306:3306"

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    <<: [*netCaps, *logging]
    profiles: ["sso"]
    environment:
      KC_HOSTNAME: 10.5.0.13
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://10.5.0.12/keycloak?characterEncoding=UTF-8
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: 7362
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    networks:
      default:
        ipv4_address: 10.5.0.13
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/cerbix-realm.json:/opt/keycloak/data/import/cerbix-realm.json:ro
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  default:
    name: cerbix
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1

volumes:
  pgdata:
    driver: local
  mysql_data:
    driver: local
  rabbit_volume:
    driver: local
