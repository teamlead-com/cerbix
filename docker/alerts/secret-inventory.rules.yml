# Prometheus rules for FR-020 credential materialization/execution. Metrics are deliberately
# low-cardinality: details (monitor and region) stay in rate-limited structured logs.
# Validate with: promtool check rules docker/alerts/secret-inventory.rules.yml
groups:
  - name: cerbix-secret-inventory
    rules:
      - alert: CerbixCredentialDispatchUnavailable
        expr: increase(cerbix_secret_resolution_failed_total{reason="no_capable_executor"}[10m]) > 0
        for: 5m
        labels:
          severity: critical
          component: secret-inventory
        annotations:
          summary: "cerbix has no credential-capable executor for scheduled probes"
          description: >
            Credentialed probes are being withheld because their target region has no live
            v2 credential-ready worker/agent. Legacy v1 consumers do not satisfy the wire
            barrier. Inspect scheduler names-only logs for the affected monitor and region.

      - alert: CerbixCredentialEnvelopeFailures
        expr: increase(cerbix_executor_probe_error_total{reason=~"no_dispatch_key|unknown_key_id|decrypt_auth_failed"}[10m]) > 0
        for: 5m
        labels:
          severity: critical
          component: secret-inventory
        annotations:
          summary: "cerbix executors cannot decrypt credential envelopes"
          description: >
            A worker or pull agent received an envelope it could not authenticate with its
            configured region keyring. Its local readiness degrades until a successful
            decrypt. Check key ids and rolling-rotation overlap without logging key values.

      - alert: CerbixDispatchSharedTrustEnabled
        expr: cerbix_dispatch_shared_trust == 1
        for: 1m
        labels:
          severity: info
          component: secret-inventory
        annotations:
          summary: "cerbix dispatch fallback key widens the regional trust boundary"
          description: >
            security.dispatch.shared_trust_acknowledged is enabled. One fallback key may
            open retained credential payloads from multiple regions; this is an acknowledged
            exposure posture, not a runtime failure.
