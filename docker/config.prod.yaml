# cerbix production config — role=all. Secrets are injected from the environment
# (docker compose .env): config.Load expands $${NAME} references at startup, so nothing
# secret is committed in this file. The loader expands the WHOLE file, comments included, and
# refuses an undefined name — which is why the reference above is written with '$$', the escape
# for a literal '$' (in a value as much as in a comment).
#
# Safe to commit: only placeholders live here. Real values go in docker/.env.
server:
  listen: ":8080"
  # /metrics and /readyz on their own port (sec-hardening-2 H-11): the application port answers
  # them 404, /healthz stays on both. ":9091" listens on every interface INSIDE the container; it
  # is docker-compose.prod.yml that publishes it on the host's loopback only (CERBIX_OPS_BIND). Run
  # outside Docker, or with network_mode: host, and nothing narrows it: write "127.0.0.1:9091" here
  # instead. Point Prometheus and readiness probes at it. Must not share listen's port. Remove the
  # line to serve everything on one port again.
  ops_listen: ":9091"

log:
  level: "info"
  format: "json"

database:
  dsn: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

rabbitmq:
  url: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"

# Encrypts stored notification-channel credentials and TOTP secrets at rest.
# 32-byte base64 key — generate once: openssl rand -base64 32
security:
  admin_email: "${CERBIX_ADMIN_EMAIL}"
  admin_password: "${CERBIX_ADMIN_PASSWORD}"
  encryption_key: "${CERBIX_ENCRYPTION_KEY}"

local:
  enabled: true
  min_password_length: 12

# Mail (status-page subscriptions) is configured at runtime from the Settings UI.
# OIDC/SSO is optional — add an `oidc:` block here (issuer/client_id/secret) to enable.
