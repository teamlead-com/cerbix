# cerbix production config — role=all. Secrets are injected from the environment
# (docker compose .env): config.Load expands ${VAR} at startup, so nothing secret
# is committed in this file. A literal '$' in a value must be escaped as '$$'.
#
# Safe to commit: only placeholders live here. Real values go in docker/.env.
server:
  listen: ":8080"

log:
  level: "info"
  format: "json"

database:
  dsn: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

rabbitmq:
  url: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"

# Encrypts stored notification-channel credentials and TOTP secrets at rest.
# 32-byte base64 key — generate once: openssl rand -base64 32
security:
  admin_email: "${CERBIX_ADMIN_EMAIL}"
  admin_password: "${CERBIX_ADMIN_PASSWORD}"
  encryption_key: "${CERBIX_ENCRYPTION_KEY}"

local:
  enabled: true
  min_password_length: 12

# Mail (status-page subscriptions) is configured at runtime from the Settings UI.
# OIDC/SSO is optional — add an `oidc:` block here (issuer/client_id/secret) to enable.
