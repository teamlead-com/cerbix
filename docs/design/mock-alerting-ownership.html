    --up:#35c67f; --up-weak:rgba(53,198,127,.15);
    --down:#ff5f64; --down-weak:rgba(255,95,100,.15);

  --ink:#f2f2f6; --ink-2:#a4a4b6; --ink-3:#6c6c7e;
  --accent:#7d79ff; --accent-2:#928fff; --accent-ink:#0b0b0f; --accent-weak:rgba(125,121,255,.15);
  --up:#35c67f; --up-weak:rgba(53,198,127,.15);
  --down:#ff5f64; --down-weak:rgba(255,95,100,.15);

.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px 0 7px; border-radius:999px; font-size:12px; font-weight:500}
.pill .dot{width:7px; height:7px; border-radius:50%; flex:none}
.pill.up{color:var(--up); background:var(--up-weak)} .pill.up .dot{background:var(--up)}
.pill.down{color:var(--down); background:var(--down-weak)} .pill.down .dot{background:var(--down)}

/* Arming badges. `armed` is the ONLY state in which anything is suppressed, so it is the only one

.arm{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:600}

.arm.on{color:var(--up); background:var(--up-weak)} .arm.on .dot{background:var(--up)}

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const note = (ref, html) => `<div class="note"><span class="ref">${esc(ref)}</span><div>${html}</div></div>`;
const pill = (k, t) => `<span class="pill ${k}"><span class="dot"></span>${esc(t)}</span>`;

/* ── screen 1: the ownership switch, on the service ───────────────────────── */
function sOwnership() {
  return `
  <div class="head">
    <h1>Checkout · alerting</h1>
    <p class="sub">Payments · service <span class="mono">checkout</span></p>
  </div>

  ${note("§16.1", `Ownership is <b>declared</b>, never inferred, and it is OFF until someone sets it.
    An installation that already pages from its monitors keeps paging from its monitors until an
    operator says otherwise — the same rule §17 applies to public output applies to who gets woken.`)}

  <div class="card">
    <header><h2>Paging ownership</h2><span class="spacer"></span>
      <span class="chip acc">declared here</span></header>
    <div class="body" style="display:flex; flex-direction:column; gap:14px">
      <label style="display:flex; gap:11px; align-items:flex-start">
        <input type="checkbox" checked style="margin-top:3px">
        <span>
          <b>This service owns paging for its reliability inputs</b>
          <span style="display:block; color:var(--ink-2); font-size:13px; margin-top:3px">
            While this is on, the 3 monitors in this service's <span class="mono">sli[]</span> stop
            <b>sending</b> their own alerts. They keep probing, keep flipping status, keep opening
            incidents and stay visible everywhere — only the notification is suppressed, and every
            suppressed one is logged and shown.
          </span>
        </span>
      </label>

      <div class="diff">
        <div>
          <div class="lbl">Pages today</div>
          <div style="font-size:13px; color:var(--ink-2)">
            <div>checkout-http — its own transition + burn</div>
            <div>checkout-db — its own transition + burn</div>
            <div>checkout-queue — its own transition + burn</div>
          </div>
        </div>
        <div class="mid">→</div>
        <div>
          <div class="lbl">Pages with ownership on</div>
          <div style="font-size:13px; color:var(--ink-2)">
            <div><b>Checkout</b> — service transition + service burn</div>
            <div style="color:var(--ink-3)">the three monitors: delegated, not silent</div>
          </div>
        </div>
      </div>

      <div class="row" style="border:1px solid var(--border); border-radius:7px; padding:11px 13px">
        <span class="lbl" style="min-width:120px">Reliability inputs</span>
        <span class="chip mono">checkout-http</span>
        <span class="chip mono">checkout-db</span>
        <span class="chip mono">checkout-queue</span>
        <span class="spacer"></span>
        <span class="chip">declared sli · not the epoch snapshot</span>
      </div>
    </div>
  </div>

  ${note("§16.1", `Membership is the <b>declared</b> <span class="mono">sli[]</span>, not the epoch
    snapshot. Ownership is a statement about who answers the phone; the epoch is a statement about
    measurement semantics, and keying on it would move a paging decision because somebody edited a
    monitor's interval.`)}

  <div class="card">
    <header><h2>What this service pages for</h2></header>
    <div class="body" style="display:flex; flex-direction:column; gap:13px">
      <div class="warn" style="margin-bottom:2px">
        <span><b>This switch is a declaration, not coverage.</b> A monitor stops sending its own alerts
          only while this service's replacement for THAT signal is armed and fresh. Each signal below
          carries its own badge, and anything other than <b>armed</b> means the monitors page for
          themselves — which is the safe direction, not a fault.</span>
      </div>
      <label style="display:flex; gap:11px; align-items:flex-start">
        <input type="checkbox" checked style="margin-top:3px">
        <span><b>Health transition</b> — live, evaluated every 30s
          <span class="arm on" style="margin-left:8px"><span class="dot"></span>armed</span>
          <span style="display:block; color:var(--ink-2); font-size:13px">
            Pages when the service enters a state you choose below. This is the outage page.
          </span>
        </span>
      </label>
      <div style="display:flex; gap:8px; flex-wrap:wrap; padding-left:27px">
        <span class="chip acc">down</span>
        <span class="chip">degraded</span>
        <span class="chip dorm">unknown — does not page</span>
      </div>
      <div style="padding-left:27px; display:flex; align-items:center; gap:10px; flex-wrap:wrap">
        <span class="lbl">Confirm</span>
        <span class="chip mono">2 evaluations</span>
        <span style="font-size:12.5px; color:var(--ink-3)">≈ 60s before the first page, when the
          evaluator is running uninterrupted</span>
      </div>
      <div style="padding-left:27px; display:flex; gap:8px; flex-wrap:wrap">
        <span class="chip mono">evaluated 12s ago</span>
        <span class="chip mono">revision 7 · config gen 4</span>
        <span class="chip">route: Payments primary (3 targets)</span>
      </div>

      <label style="display:flex; gap:11px; align-items:flex-start; border-top:1px solid var(--border); padding-top:13px">
        <input type="checkbox" checked style="margin-top:3px">
        <span><b>Error-budget burn</b> — from sealed facts, so it trails the watermark
          <span class="arm wait" style="margin-left:8px"><span class="dot"></span>pending — window held</span>
          <span style="display:block; color:var(--ink-2); font-size:13px">
            The budget signal, not the outage page: it can only speak about time that has been
            sealed. Sealed through <span class="mono">14:32 UTC</span>, 4 min ago.
          </span>
        </span>
      </label>
      <div style="padding-left:27px; display:flex; gap:8px; flex-wrap:wrap">
        <span class="chip mono">1h / 6h · 14× · page</span>
        <span class="chip mono">6h / 3d · 6× · ticket</span>
        <span class="chip">same rules monitors use</span>
      </div>
      <div style="padding-left:27px" class="warn">
        <span>The 6h/3d rule's window is <b>held</b>: not enough sealed time to quote a rate. A held
          rule cannot fire, so it does not cover anything — <b>burn delegation is off</b> and the
          monitors' own burn alerts are being delivered normally until it can speak.</span>
      </div>
    </div>
  </div>

  ${note("§16.2/§16.3", `Two signals with two latencies, and the UI says which is which. A
    sealed-only signal could not carry outage paging — it trails <span class="mono">sealed_through</span>
    by construction — which is exactly why the live transition exists. UNKNOWN never pages as DOWN:
    "we cannot see it" is not "it is broken", and it has its own switch, off by default.`)}

  <div class="card">
    <header><h2>Who is notified</h2></header>
    <div class="body">
      <div class="row" style="padding:0 0 10px">
        <span class="lbl" style="min-width:120px">Escalation</span>
        <span class="chip">Payments on-call ladder</span>
        <span class="spacer"></span><span class="chip mono">services.escalation_policy_id</span>
      </div>
      <div class="row" style="padding:10px 0 0; border-bottom:0">
        <span class="lbl" style="min-width:120px">Schedule</span>
        <span class="chip">Payments primary</span>
        <span class="spacer"></span><span class="chip mono">services.oncall_schedule_id</span>
      </div>
    </div>
  </div>

  ${note("§16.4", `These two columns have existed since migration 00064 with no consumer. Phase 5 is
    the consumer: a service alert routes through the service's own owners and falls back to the
    project's channels when it names none. Instance-wide silence and the escalation ladder are
    unchanged — phase 5 adds a SOURCE of alerts, not a delivery path.`)}`;
}

/* ── screen 2: what a delegated monitor looks like ─────────────────────────── */
function sDelegated() {
  return `
  <div class="head">
    <h1>checkout-db</h1>
    <p class="sub">Payments · postgres monitor · every 30s</p>
  </div>

  <div class="card">
    <header>
      <h2>checkout-db</h2>
      ${pill("down", "Down")}
      <span class="chip dorm">paging delegated → Checkout</span>
      <span class="spacer"></span>
      <span class="btn sm">Pause</span><span class="btn sm">Edit</span>
    </header>
    <div class="body" style="display:flex; flex-direction:column; gap:12px">
      <div class="warn">
        <span>
          <b>This monitor's alerts are delivered by «Checkout».</b>
          It still probes, still turns red, still opens incidents and still counts toward every
          number. What it does not do is notify on its own — the service does, so one failure is
          one page. Turn ownership off on Checkout to restore its own alerts.
        </span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
        <span class="chip">DOWN transitions — delegated</span>
        <span class="chip">escalation ladder — delegated</span>
        <span class="chip dorm">burn — NOT delegated (service window held)</span>
        <span class="chip acc">recovery — never delegated</span>
        <span class="chip mono">since 09:14</span>
      </div>
      <div style="font-size:12.5px; color:var(--ink-2)">
        A <b>recovery is never suppressed</b>, whatever the delegation state. Arming is decided when an
        alert is delivered and it changes: this monitor's DOWN could have gone out while the service was
        still catching up, and muting the matching UP would leave whoever was paged holding an alert
        that can never end.
      </div>
    </div>
  </div>

  ${note("§16.1", `Silence must be <b>visible</b>. The monitor keeps its real status pill — it is
    DOWN and it says so — and gains a dashed chip that names the owner. A greyed-out or hidden
    monitor would be the system doing one thing and showing another, which §14 and §11 exist to
    prevent.`)}

  <div class="card">
    <header><h2>Incident #418 · checkout-db is down</h2><span class="spacer"></span>
      <span class="chip">open · auto</span></header>
    <div>
      <div class="row"><span class="mono" style="color:var(--ink-3); min-width:74px">09:14:31</span>
        <span>Monitor reported <b>down</b> after 3 consecutive failures.</span></div>
      <div class="row"><span class="mono" style="color:var(--ink-3); min-width:74px">09:14:31</span>
        <span>⏸ Suppressed: notification delegated to service <b>Checkout</b>, which owns paging for
          this monitor.</span></div>
      <div class="row"><span class="mono" style="color:var(--ink-3); min-width:74px">09:15:02</span>
        <span>⚡ Context: 1 of 3 reliability inputs of Checkout is down.</span></div>
    </div>
  </div>

  ${note("§16.1", `The <span class="mono">⏸ Suppressed:</span> marker is the one dependency
    suppression already uses, with its idempotent-insert prefix. An operator reading the incident
    later sees WHY nobody was paged, in the incident itself — not by inferring it from an absence.`)}`;
}

/* ── screen 3: the honest silence — a member down under `any` ──────────────── */
function sTolerated() {
  return `
  <div class="head">
    <h1>Search · one input down</h1>
    <p class="sub">Search · aggregation <span class="mono">any</span> — one healthy input is enough</p>
  </div>

  ${note("§16.1", `This is the case worth arguing about, so the mock shows it rather than hiding it.
    Under <span class="mono">any</span> or <span class="mono">quorum</span>, a member can be DOWN
    while the service is HEALTHY — and then <b>nothing pages</b>. That is the declaration doing its
    job: the operator declared that this member alone is not an outage. The screen's whole purpose
    is to make that legible instead of surprising.`)}

  <div class="card">
    <header><h2>Search</h2>${pill("up", "Healthy")}<span class="chip acc">owns paging</span>
      <span class="spacer"></span><span class="chip mono">any · 1 of 3 needed</span></header>
    <div>
      <div class="row"><span class="nm">search-eu</span>${pill("up", "Up")}<span class="spacer"></span>
        <span class="chip dorm">delegated</span></div>
      <div class="row"><span class="nm">search-us</span>${pill("up", "Up")}<span class="spacer"></span>
        <span class="chip dorm">delegated</span></div>
      <div class="row"><span class="nm">search-ap</span>${pill("down", "Down")}<span class="spacer"></span>
        <span class="chip dorm">delegated</span>
        <span class="chip">no page — see below</span></div>
    </div>
  </div>

  <div class="card">
    <header><h2>What happened, and what did not</h2></header>
    <div class="body" style="display:flex; flex-direction:column; gap:10px; font-size:13px; color:var(--ink-2)">
      <div><b style="color:var(--ink)">Recorded:</b> search-ap is down, incident #521 is open, its
        heartbeats and SLO history are unaffected, and its own error budget is burning.</div>
      <div><b style="color:var(--ink)">Not paged:</b> nobody was woken, because Search declares
        <span class="mono">any</span> — one healthy region is enough — and Search is healthy.</div>
      <div><b style="color:var(--ink)">If that is wrong,</b> the fix is the declaration, not the
        alerting: change the aggregation to <span class="mono">all</span>, or add search-ap's region
        to the region policy, or turn ownership off and let the monitor page for itself.</div>
    </div>
  </div>

  ${note("§16.1", `The alternative — page anyway — would mean the aggregation policy governs the
    number but not the phone, and an operator who deliberately declared regional tolerance would
    still be woken for one region. Then <span class="mono">any</span> would mean nothing. What phase
    5 owes instead is <b>legibility</b>: the monitor is red, the incident is open, the delegation is
    named, and this panel says in words that no page was sent and why.`)}`;
}

/* ── screen 4: the alerts themselves ──────────────────────────────────────── */
function sAlerts() {
  return `
  <div class="head">
    <h1>What the page says</h1>
    <p class="sub">Two signals, two latencies, and each one admits which it is</p>
  </div>

  <div class="card">
    <header><h2>Live transition</h2>${pill("down", "Down")}<span class="spacer"></span>
      <span class="chip mono">service_alert · live</span></header>
    <div class="body" style="display:flex; flex-direction:column; gap:8px">
      <div style="font-size:15px; font-weight:600">Checkout is DOWN</div>
      <div style="font-size:13px; color:var(--ink-2)">
        2 of 3 reliability inputs are failing · aggregation <span class="mono">all</span> ·
        confirmed over 2 evaluations (60s) · Payments on-call
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; padding-top:4px">
        <span class="chip mono">checkout-db — down</span>
        <span class="chip mono">checkout-queue — down</span>
        <span class="chip">checkout-http — up</span>
      </div>
    </div>
  </div>

  <div class="card">
    <header><h2>Sealed burn</h2>${pill("deg", "Burning")}<span class="spacer"></span>
      <span class="chip mono">service_alert · sealed</span></header>
    <div class="body" style="display:flex; flex-direction:column; gap:8px">
      <div style="font-size:15px; font-weight:600">Checkout is burning its 30-day budget 14× too fast</div>
      <div style="font-size:13px; color:var(--ink-2)">
        1h and 6h windows both above 14× · objective 99.9% ·
        computed over facts sealed through <span class="mono">14:32 UTC</span>
      </div>
      <div class="chip">this signal trails the seal watermark — it is a budget signal, not an outage page</div>
    </div>
  </div>

  ${note("§16.3", `The burn alert states the watermark it was computed from, because a number
    without its basis is what §11.2 spent a whole phase removing. The two alerts are separate
    events with separate severities: one wakes someone, the other tells a team its month is at
    risk.`)}

  <div class="card">
    <header><h2>Recovery</h2>${pill("up", "Recovered")}<span class="spacer"></span>
      <span class="chip mono">edge</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2)">
      <b style="color:var(--ink)">Checkout is healthy again</b> — down for 22 minutes.
      A service that paged says when it stopped; the state row and the notification commit in one
      transaction, so a recovery cannot be lost and cannot be sent twice.
    </div>
  </div>`;
}

/* ── screen 5: the refusals ───────────────────────────────────────────────── */
function sRefusals() {
  return `
  <div class="head">
    <h1>What refuses to page</h1>
    <p class="sub">Each of these is a decision, not a gap</p>
  </div>

  <div class="card">
    <header><h2>Unknown</h2>${pill("nd", "Unknown")}<span class="spacer"></span>
      <span class="chip dorm">does not page</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2)">
      Checkout has no decidable observation right now. It is <b>not</b> reported as down: "we cannot
      see it" and "it is broken" are different statements, and paging the first as the second is the
      confident falsehood this feature exists to remove. A separate switch —
      <span class="mono">page on unknown</span>, off by default — exists for teams that want to hear
      about blindness, because never mentioning it is the opposite failure.
    </div>
  </div>

  <div class="card">
    <header><h2>Under maintenance</h2>${pill("mnt", "Maintenance")}<span class="spacer"></span>
      <span class="chip dorm">does not page</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2)">
      A declared window is a declared silence. The service is excluded from evaluation for its
      duration, and no state entered during it can produce a page.
    </div>
  </div>

  <div class="card">
    <header><h2>Not enough sealed time</h2><span class="chip mono">held</span>
      <span class="spacer"></span><span class="arm wait"><span class="dot"></span>burn dis-armed</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:8px">
      <div>A burn window with no quotable rate <b>holds</b>: a rule already FIRING stays firing, and a
        rule at CLEAR stays clear. Treating absent data as "burn = 0" would silently resolve a live
        alert, which is the most dangerous mistake available here.</div>
      <div><b style="color:var(--ink)">And a held rule covers nothing.</b> A rule that cannot speak is
        not a replacement, so burn delegation dis-arms and the monitors' own burn alerts are delivered.
        The badge above is what an operator sees; the alternative was a silence with no author.</div>
    </div>
  </div>

  <div class="card">
    <header><h2>Nobody to notify</h2><span class="spacer"></span>
      <span class="arm bad"><span class="dot"></span>degraded — both signals dis-armed</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2)">
      This service's schedule is empty and its project has no channels, so a service alert would be
      recorded and counted but delivered to nobody. Routability is therefore part of arming: the
      members keep paging for themselves until there is somebody to page. A channel disabled AFTER
      arming does the same, which is why this is computed when an alert is delivered rather than
      cached on the service.
    </div>
  </div>

  <div class="card">
    <header><h2>A recovery</h2>${pill("up", "Up")}<span class="spacer"></span>
      <span class="chip acc">never suppressed</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2)">
      A monitor's recovery and a burn CLEAR are delivered whatever the delegation state. Arming is
      decided when an alert is delivered and it changes: a DOWN can go out while the service is still
      catching up, and muting the matching UP would leave the person who was paged holding an alert
      that can never end. A duplicate "recovered" is strictly safer than an unmatched "down".
    </div>
  </div>

  <div class="card">
    <header><h2>A lookup that failed</h2><span class="spacer"></span>
      <span class="chip acc">pages anyway</span></header>
    <div class="body" style="font-size:13px; color:var(--ink-2)">
      If cerbix cannot determine whether a monitor is delegated, it <b>sends</b> the alert. A page
      that was not needed is noise; a page that was owed and never sent is the failure this whole
      feature exists to prevent — so the ambiguous case is loud.
    </div>
  </div>

  ${note("§16.7", `And what phase 5 does not do at all: no service incidents, no retroactive
    alerting from a rule enabled today, no cross-project delegation, no per-member severity inside a
    service page, and nothing suppressed beyond the two alert topics — SLA reports, incident
    webhooks and the public status page are untouched.`)}`;
}

const SCREENS = [
  ["ownership", "Ownership switch", sOwnership],
  ["delegated", "A delegated monitor", sDelegated],
  ["tolerated", "Tolerated failure", sTolerated],
  ["alerts", "The alerts", sAlerts],
  ["refusals", "Refusals", sRefusals],
];
let active = "ownership";
const nav = document.getElementById("screens");
const view = document.getElementById("view");
nav.innerHTML = SCREENS.map(([k, t], i) =>
  `<button data-k="${k}" class="${k === active ? "on" : ""}"><span class="n">${i + 1}</span>${esc(t)}</button>`).join("");
function render() {
  const [, , fn] = SCREENS.find(([k]) => k === active);
  view.innerHTML = fn();
  nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === active));
  window.scrollTo(0, 0);
}
nav.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  active = b.dataset.k;
  render();
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0b0b0f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});
const notesBtn = document.getElementById("notesBtn");
notesBtn.addEventListener("click", () => {
  const off = document.body.classList.toggle("hide-notes");
  notesBtn.classList.toggle("on", !off);
  notesBtn.setAttribute("aria-pressed", String(!off));
});
render();
</script>
