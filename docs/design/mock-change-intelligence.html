<title>Cerbix Change Intelligence</title>

<style>
/* Tokens VERBATIM from frontend/src/style.css (the block every approved mock carries). FR-025 adds
   NO new colour. A change is an operator's ACT, like an override: it is drawn in the accent
   ("declared here" grammar) or in ink, never in a status hue — a deploy is not good or bad, what
   FOLLOWED it is, and that is said by the facts strip beside it in the hues the facts already own.
   Kind is said by SHAPE (deploy ▲, rollback ▼, flag ◆) plus text, never by colour alone. */
:root {
  --bg:#fafafb; --surface:#ffffff; --surface-2:#f5f5f8; --inset:#f0f0f4;
  --border:#e9e9ef; --border-strong:#dadae4;
  --ink:#17171f; --ink-2:#55556a; --ink-3:#8a8a9d;
  --accent:#5854f2; --accent-2:#7a77ff; --accent-ink:#ffffff; --accent-weak:rgba(88,84,242,.10);
  --focus:#5854f2;
  --up:#12a05c; --up-weak:rgba(18,160,92,.12);
  --down:#e0393f; --down-weak:rgba(224,57,63,.12);
  --degraded:#b97800; --degraded-weak:rgba(185,120,0,.13);
  --maint:#3a7de5; --maint-weak:rgba(58,125,229,.12);
  --pending:#8a8a9d; --pending-weak:rgba(138,138,157,.14);
  --shadow:0 1px 2px rgba(20,20,40,.04), 0 4px 16px rgba(20,20,40,.04);
  --note:#5854f2; --note-bg:rgba(88,84,242,.055); --note-border:rgba(88,84,242,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0b0b0f; --surface:#141419; --surface-2:#1a1a20; --inset:#101015;
    --border:#262630; --border-strong:#34343f;
    --ink:#f2f2f6; --ink-2:#a4a4b6; --ink-3:#6c6c7e;
    --accent:#7d79ff; --accent-2:#928fff; --accent-ink:#0b0b0f; --accent-weak:rgba(125,121,255,.15);
    --focus:#7d79ff;
    --up:#35c67f; --up-weak:rgba(53,198,127,.15);
    --down:#ff5f64; --down-weak:rgba(255,95,100,.15);
    --degraded:#e0a53a; --degraded-weak:rgba(224,165,58,.15);
    --maint:#5c9bff; --maint-weak:rgba(92,155,255,.15);
    --pending:#6c6c7e; --pending-weak:rgba(108,108,126,.18);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    --note:#928fff; --note-bg:rgba(125,121,255,.09); --note-border:rgba(125,121,255,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0b0b0f; --surface:#141419; --surface-2:#1a1a20; --inset:#101015;
  --border:#262630; --border-strong:#34343f;
  --ink:#f2f2f6; --ink-2:#a4a4b6; --ink-3:#6c6c7e;
  --accent:#7d79ff; --accent-2:#928fff; --accent-ink:#0b0b0f; --accent-weak:rgba(125,121,255,.15);
  --focus:#7d79ff;
  --up:#35c67f; --up-weak:rgba(53,198,127,.15);
  --down:#ff5f64; --down-weak:rgba(255,95,100,.15);
  --degraded:#e0a53a; --degraded-weak:rgba(224,165,58,.15);
  --maint:#5c9bff; --maint-weak:rgba(92,155,255,.15);
  --pending:#6c6c7e; --pending-weak:rgba(108,108,126,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  --note:#928fff; --note-bg:rgba(125,121,255,.09); --note-border:rgba(125,121,255,.32);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}

p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:var(--accent); text-decoration:none} a:hover{text-decoration:underline}
.top{position:sticky; top:0; z-index:20; height:56px; display:flex; align-items:center; gap:12px; padding:0 22px; border-bottom:1px solid var(--border); background:var(--surface)}

.screens button.on{color:var(--ink); border-bottom-color:var(--accent); font-weight:550}
.screens .n{font-size:10.5px; color:var(--ink-3); margin-right:5px}
.wrap{padding:22px; max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.head h1{font-size:21px; font-weight:650; letter-spacing:-.015em}
.head .sub{margin-top:3px; font-size:13px; color:var(--ink-3)}
.card{border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden}
.card > header{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:13px 16px; border-bottom:1px solid var(--border)}

.card .spacer{flex:1}

.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px 0 7px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.01em}
.pill .dot{width:7px; height:7px; border-radius:50%; flex:none}
.pill.allow{color:var(--up); background:var(--up-weak)} .pill.allow .dot{background:var(--up)}
.pill.block{color:var(--down); background:var(--down-weak)} .pill.block .dot{background:var(--down)}
.pill.warn{color:var(--degraded); background:var(--degraded-weak)} .pill.warn .dot{background:var(--degraded)}
.pill.unk{color:var(--ink-2); background:var(--pending-weak); border:1px dashed var(--border-strong)} .pill.unk .dot{background:var(--pending)}

.chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:5px; padding:2px 7px; font-size:11.5px; color:var(--ink-2); background:var(--surface)}
.chip.mono{font-family:ui-monospace,Menlo,monospace; font-size:10.5px}
.chip.acc{border-color:var(--accent); color:var(--accent); background:var(--accent-weak)}
.chip.dorm{border-style:dashed; color:var(--ink-3)}
.chip.downc{border-color:var(--down); color:var(--down); background:var(--down-weak)}
.chip.warnc{border-color:var(--degraded); color:var(--degraded); background:var(--degraded-weak)}
.chip.upc{border-color:var(--up); color:var(--up); background:var(--up-weak)}

/* Kind marks: shape + text. Accent when in force on the strip, ink otherwise. Never a state hue. */
.mark{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:550; color:var(--ink)}
.mark i{display:inline-block; width:10px; height:10px; flex:none}
.mark.deploy i{clip-path:polygon(50% 0,100% 100%,0 100%); background:var(--accent)}
.mark.rollback i{clip-path:polygon(0 0,100% 0,50% 100%); background:var(--accent)}
.mark.flag i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:var(--accent)}
.mark.ghost i{background:var(--ink-3)}

/* The facts strip with change marks on top: geometry = time. */
.strip{position:relative; height:26px; display:flex; gap:1px; border-radius:4px; overflow:visible; margin-top:22px}
.strip span{flex:1; border-radius:2px}
.strip span.good{background:var(--up)} .strip span.bad{background:var(--down)} .strip span.unknown{background:var(--ink-3); opacity:.5} .strip span.excluded{background:var(--inset)} .strip span.provisional{opacity:.45}
.strip .cm{position:absolute; top:-20px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px}
.strip .cm i{display:block; width:11px; height:11px}
.strip .cm.deploy i{clip-path:polygon(50% 0,100% 100%,0 100%); background:var(--accent)}
.strip .cm.rollback i{clip-path:polygon(0 0,100% 0,50% 100%); background:var(--accent)}
.strip .cm.flag i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:var(--accent)}
.strip .cm b{display:block; width:1px; height:8px; background:var(--accent)}
.strip .cm.sel i{outline:2px solid var(--focus); outline-offset:1px; border-radius:1px}
.axis{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:6px}

.row{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:11px 16px; border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}

.row .spacer{flex:1}
.row .sub{font-size:12.5px; color:var(--ink-3); width:100%}
.row.sel{background:var(--accent-weak)}

.phases{display:inline-flex; align-items:center; gap:0; font-size:11.5px}

.phases span:first-child{border-radius:5px 0 0 5px} .phases span:last-child{border-radius:0 5px 5px 0}
.phases span.on{background:var(--inset); color:var(--ink); font-weight:600}
.phases span.fail{border-color:var(--down); color:var(--down)}
.phases .arrow{border:0; padding:0 4px; color:var(--ink-3)}

.kv{display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; font-size:13px}
.kv .k{color:var(--ink-3)}
.kpi{font-size:26px; font-weight:500; letter-spacing:-.01em}
.kpi small{font-size:12px; color:var(--ink-3); font-weight:400; margin-left:6px; letter-spacing:0}

.compare{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch}
.compare .side{border:1px solid var(--border); border-radius:7px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.compare .side.with{border-style:dashed}
.compare .delta{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:110px}
.compare .delta .v{font-size:22px; font-weight:600; letter-spacing:-.01em}
.bar{height:8px; border-radius:4px; background:var(--inset); overflow:hidden; display:flex}
.bar span{height:100%}
.bar .g{background:var(--up)} .bar .b{background:var(--down)} .bar .u{background:var(--ink-3); opacity:.5}

.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12.5px; color:var(--ink-2); font-weight:500}
.inp{display:inline-flex; align-items:center; gap:8px; height:30px; border:1px solid var(--border); border-radius:6px; padding:0 10px; font-size:13px; background:var(--surface); color:var(--ink)}
.inp.err{border-color:var(--down)}
.inp.sel::after{content:"⌄"; color:var(--ink-3); margin-left:auto}
.inp .unit{color:var(--ink-3); font-size:12px}
.hint{font-size:12px; color:var(--ink-3)}
.hint.bad{color:var(--down)}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden}

.btn{display:inline-flex; align-items:center; gap:6px; height:30px; border:1px solid var(--border); border-radius:6px; padding:0 12px; font-size:13px; color:var(--ink); background:var(--surface)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:550}
.btn.sm{height:26px; font-size:12.5px; padding:0 10px}
.btn[disabled]{opacity:.5; cursor:not-allowed}

.err{display:flex; gap:9px; align-items:flex-start; border:1px solid var(--down); background:var(--down-weak); color:var(--down); border-radius:6px; padding:9px 12px; font-size:13px}
.err b{font-weight:650}
.warnb{display:flex; gap:9px; align-items:flex-start; border:1px solid var(--degraded); background:var(--degraded-weak); color:var(--degraded); border-radius:6px; padding:9px 12px; font-size:13px}
.info{display:flex; gap:9px; align-items:flex-start; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink-2); border-radius:6px; padding:9px 12px; font-size:13px}

pre.code{margin:0; padding:12px 14px; border:1px solid var(--border); border-radius:6px; background:var(--inset); font:12.5px/1.55 ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; color:var(--ink); overflow-x:auto; font-variant-numeric:tabular-nums}
pre.code .c{color:var(--ink-3)} pre.code .k{color:var(--accent)} pre.code .n{color:var(--ink-2)}

table.tbl{width:100%; border-collapse:collapse; font-size:13px}

.tl{display:flex; flex-direction:column}

.tl .ev:last-child{border-bottom:0}
.tl .t{font-size:12.5px; color:var(--ink-3)}
.tl .g{position:relative; display:flex; justify-content:center}

.tl .g i{position:relative; z-index:1; display:block; width:10px; height:10px; margin-top:5px; border-radius:50%; background:var(--border-strong)}
.tl .g i.inc{background:var(--down)} .tl .g i.chg{border-radius:0; clip-path:polygon(50% 0,100% 100%,0 100%); background:var(--accent)} .tl .g i.flag{border-radius:0; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:var(--accent)}
.tl .body2{font-size:13px}

.note{border:1px dashed var(--note-border); border-left:3px solid var(--note); background:var(--note-bg); border-radius:6px; padding:10px 12px; font-size:12.5px; color:var(--ink-2); display:flex; gap:10px; align-items:flex-start}
.note .ref{flex:none; font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--note); border:1px solid var(--note-border); border-radius:4px; padding:1px 6px; margin-top:1px; white-space:nowrap}
.note b{color:var(--ink); font-weight:600}
body.hide-notes .note{display:none}
.foot{padding:18px 22px 36px; font-size:12px; color:var(--ink-3); max-width:1080px; margin:0 auto}

@media (prefers-reduced-motion: no-preference){ .card{transition:border-color .12s} }
</style>

  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/></svg>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const note = (ref, html) => `<div class="note"><span class="ref">${esc(ref)}</span><div>${html}</div></div>`;
const mark = (kind, text, ghost) => `<span class="mark ${kind}${ghost ? " ghost" : ""}"><i></i>${esc(text)}</span>`;
const phases = (list) => `<span class="phases">${list.map((p, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="${p.on ? "on" : ""} ${p.fail ? "fail" : ""}">${esc(p.name)} <span class="mono" style="font-weight:400;color:var(--ink-3)">${esc(p.t)}</span></span>`).join("")}</span>`;
const stateChip = (s) => `<span class="pill ${{ ALLOW: "allow", WARN: "warn", BLOCK: "block", UNKNOWN: "unk" }[s] || "unk"}"><span class="dot"></span>${esc(s)}</span>`;

/* A day of facts around the 14:05 deploy. Geometry is time; marks sit where the phase happened. */
function strip(marks, sel) {
  const cells = [];
  for (let i = 0; i < 96; i++) {
    let c = "good";
    if (i >= 57 && i <= 62) c = "bad";           // 14:15 – 15:30
    if (i >= 63 && i <= 64) c = "unknown";
    if (i >= 92) c = "good provisional";
    cells.push(`<span class="${c}"></span>`);
  }
  return `<div class="strip">${cells.join("")}${marks.map((m) => `<span class="cm ${m.kind}${m.id === sel ? " sel" : ""}" style="left:${m.pct}%" title="${esc(m.title)}"><i></i><b></b></span>`).join("")}</div>
  <div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>now</span></div>`;
}
/* One mark per TERMINAL phase (D14, invariant 19): the in-progress deploy v4.2.2 (started 16:40) has none yet. */
const MARKS = [
  { id: "c1", kind: "flag", pct: 34, title: "flag · checkout-v2-rollout 10 % · 08:10" },
  { id: "c2", kind: "deploy", pct: 58.7, title: "deploy · v4.2.1 · 14:05" },
  { id: "c3", kind: "rollback", pct: 64.2, title: "rollback · v4.2.0 · 15:25" },
];

/* ── 1. The Changes card on the service ─────────────────────────────────────────── */
function sCard() {
  return `
  <div class="head">
    <h1>Checkout · changes</h1>
    <p class="sub">Payments · service <span class="mono">checkout</span> · a new card on the service detail, between <b>Release gate</b> and <b>Dependencies</b></p>
  </div>

  ${note("D14 · D1", `The card is a <b>record</b>, not a control: nothing here creates, edits or deletes a change. A pipeline records
    changes with <span class="mono">cerbix change record</span> (screen 2); the card reads them. The marks on the facts strip
    are placed by <span class="mono">occurred_at</span> — geometry is time — one mark per TERMINAL phase (a group that has only
    <span class="mono">started</span> is listed below but not yet marked), and say the KIND by shape (▲ deploy, ▼ rollback,
    ◆ flag) and text, never by a status colour: a deploy is not good or bad; what followed it is, and the strip beneath says
    that in the hues the facts already own.`)}

  <div class="card">
    <header><h2>Changes</h2><span class="chip mono">last 30 days · 14</span><span class="spacer"></span>
      <span class="lbl" style="margin-right:2px">range</span><span class="seg"><span class="on">30 d</span><span>7 d</span><span>24 h</span></span>
      <span class="lbl" style="margin:0 2px 0 8px">before/after at</span><span class="seg" title="applies to every row on this card"><span>15 m</span><span class="on">1 h</span><span>6 h</span><span>24 h</span></span>
      <a class="mono" href="#" style="font-size:11.5px">full timeline →</a></header>
    <div class="body stack">
      <div>
        <div class="lbl">Today · sealed facts, with the changes that happened on them</div>
        ${strip(MARKS, "c2")}
      </div>
      <div style="border:1px solid var(--border); border-radius:7px">
        <div class="row">
          ${mark("deploy", "deploy")}<span class="nm mono">v4.2.2</span>
          ${phases([{ name: "started", t: "16:40", on: true }])}
          <span class="chip mono">github-actions · run 9201</span>
          <span class="spacer"></span>
          <span class="chip mono">token:deploy-bot</span>
          <span class="sub">in progress — no terminal phase yet, so no mark on the strip and <span class="chip dorm">before/after unavailable until a terminal phase</span> · rested on decision <span class="mono">0191c3f0…77c1</span> ${stateChip("ALLOW")}</span>
        </div>
        <div class="row sel">
          ${mark("rollback", "rollback")}<span class="nm mono">v4.2.0</span>
          ${phases([{ name: "started", t: "15:23" }, { name: "succeeded", t: "15:25", on: true }])}
          <span class="chip mono">github-actions · run 9182</span>
          <span class="spacer"></span>
          <span class="chip mono">token:deploy-bot</span>
          <span class="sub">preceded <a href="#">INC-2041</a> by −0 s · no gate decision linked · before/after at 1 h: <span class="mono" style="color:var(--down)">98.31 %</span> → <span class="mono" style="color:var(--up)">99.97 %</span> <span class="chip upc mono">+1.66</span></span>
        </div>
        <div class="row">

/* ── 2. What a pipeline sends ──────────────────────────────────────────────────── */
function sRecord() {
  return `
  <div class="head">
    <h1>Recording a change</h1>
    <p class="sub">The CLI verb, its two phases, the replay, and the refusals a pipeline can earn</p>
  </div>

  ${note("D13 · D2", `Credentials from <span class="mono">CERBIX_URL</span> and <span class="mono">CERBIX_TOKEN</span> only, never flags.
    stdout is ONE line; refusals go to stderr verbatim. Exit <b>0</b> recorded or replayed, <b>2</b> refused by the contract
    (400/404/409 — the pipeline's own mistake, printed), <b>1</b> transport (auth, timeout, 429 with Retry-After, 5xx). No retry on
    429, as the gate verb. Every field is a closed enum or a bounded scalar: no payload.`)}

  <div class="card">
    <header><h2>A deploy, start to finish</h2><span class="spacer"></span><span class="chip mono">exit 0 · exit 0</span></header>
    <div class="body stack">
<pre class="code"><span class="c"># before the protected step: the gate (FR-024)</span>
$ cerbix gate check --project $P --service $S
<span class="k">state=BLOCK action=ALLOW override=b7e2… decision=0191c2a4-6b3e-7a10-8f2e-3c9d1a7e5b04</span>

<span class="c"># the release begins: the change names the decision it rests on</span>
$ cerbix change record --project $P --service $S --kind deploy --phase started \\
    --ref v4.2.1 --source github-actions --external-id $GITHUB_RUN_ID \\
    --decision 0191c2a4-6b3e-7a10-8f2e-3c9d1a7e5b04 --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
<span class="k">recorded change=0191c2a6-…-01aa kind=deploy phase=started</span>

<span class="c"># … the rollout …</span>

$ cerbix change record --project $P --service $S --kind deploy --phase succeeded \\
    --ref v4.2.1 --source github-actions --external-id $GITHUB_RUN_ID
<span class="k">recorded change=0191c2a9-…-4c02 kind=deploy phase=succeeded</span>

<span class="c"># the job restarted and sent the end again — identical fields → the same row, nothing written</span>
$ cerbix change record … --phase succeeded --ref v4.2.1 --source github-actions --external-id $GITHUB_RUN_ID
<span class="k">replayed change=0191c2a9-…-4c02 kind=deploy phase=succeeded</span>
$ echo $?
0</pre>
      <p class="hint"><span class="mono">--at</span> defaults to the invocation instant and may lag the server by up to 24 h (a late report) or lead it by 5 min (clock skew) — <span class="mono">change.max_past</span> / <span class="mono">change.max_future</span>. A replay is IDENTICAL when kind, occurred_at, ref, url and decision match after normalization; who sent it does not matter — a retry under another token returns the ORIGINAL row and its original actor.</p>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <header><h2>Refused by the contract</h2><span class="spacer"></span><span class="chip mono">exit 2</span></header>
      <div class="body">
<pre class="code">$ cerbix change record … --phase failed --external-id $GITHUB_RUN_ID
<span class="n">cerbix: change: 409 phase_order — succeeded already recorded for github-actions/9177</span>
$ echo $?
2

$ cerbix change record … --phase succeeded --ref v4.2.2 --external-id $GITHUB_RUN_ID
<span class="n">cerbix: change: 409 phase_exists — ref differs: stored "v4.2.1", sent "v4.2.2"</span>

$ cerbix change record … --url http://ci.internal/run/9177
<span class="n">cerbix: change: 400 url_invalid — https:// only</span>

$ cerbix change record … --decision 0191ba9d-…-c002
<span class="n">cerbix: change: 400 decision_unknown — not a decision of this service</span></pre>
      </div>
    </div>
    <div class="card">
      <header><h2>Not a record</h2><span class="spacer"></span><span class="chip mono">exit 1</span></header>
      <div class="body stack">
<pre class="code">$ cerbix change record …
<span class="n">cerbix: change: 429 Too Many Requests — retry after 3 s (principal_rate)</span>
$ echo $?
1</pre>
        <p class="hint">30 records a minute per principal, 300 per process at defaults (<span class="mono">change.*</span>, §5a). A pipeline that loops a phase is the load the limit sheds; the phase-order rule caps a group at four rows regardless.</p>
        <div class="info"><span>ℹ</span><div><b>No manual "record a change" form in the UI.</b> The record comes from the system that made the change, with its own identity. An operator who deployed by hand records it with the same verb from a shell — the row says <span class="mono">anna@payments</span> instead of <span class="mono">token:deploy-bot</span>.</div></div>
      </div>
    </div>
  </div>

  ${note("D3 · D4", `<b>Phases are append-only and idempotent under their key</b> <span class="mono">(service, source, external_id, phase)</span>.
    Two pipelines reporting <span class="mono">succeeded</span> and <span class="mono">failed</span> for the same run at the same instant
    are serialized per identity (an advisory lock for the length of the write), so exactly one terminal survives and the other
    learns <span class="mono">phase_order</span>. A row is never edited and never deleted by a route; retention removes whole groups
    by age (400 days at default).`)}`;
}

    AND the list names it. Empty list (<span class="mono">NULL</span>) means what every token means today — the role decides — so no
    existing token changes. The list is fixed at creation: a different list is a new token; tokens are cheap, audit is not. The

const SCREENS = [
  ["card", "Changes on the service", sCard],
  ["record", "Recording a change", sRecord],
  ["compare", "Before and after", sCompare],
  ["incident", "Incident · preceded by", sIncident],
  ["timeline", "Full timeline", sTimeline],
  ["token", "CI token allow-list", sToken],
];
let active = "card";
const nav = document.getElementById("screens");
const view = document.getElementById("view");
nav.innerHTML = SCREENS.map(([k, t], i) => `<button data-k="${k}" class="${k === active ? "on" : ""}"><span class="n">${i + 1}</span>${esc(t)}</button>`).join("");
function render() {
  const [, , fn] = SCREENS.find(([k]) => k === active);
  view.innerHTML = fn();
  nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === active));
  window.scrollTo(0, 0);
}
nav.addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (!b) return; active = b.dataset.k; render(); });
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0b0b0f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});
const notesBtn = document.getElementById("notesBtn");
notesBtn.addEventListener("click", () => {
  const off = document.body.classList.toggle("hide-notes");
  notesBtn.classList.toggle("on", !off);
  notesBtn.setAttribute("aria-pressed", String(!off));
});
render();
</script>
