  <div class="sidefoot"><span class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2l-.4-2.6H9.9l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.4 2.6h4.2l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</span><div class="version mono">cerbix 0.18.7</div></div>
</div><section class="main"><div class="apptop"><div class="crumbs"><span>Acme Operations</span><i>/</i><span>Payments API</span><i>/</i><b>Dashboard</b></div><div class="topactions"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span>Search…</span><kbd>/</kbd></div><button class="start" id="entryBtn">Get started</button><button class="newmonitor"><span aria-hidden="true">＋</span> New monitor</button><button class="iconbtn" aria-label="Toggle theme preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></button><span class="avatar">AN</span></div></div><div class="content" id="view"></div></section></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function steps(current,done=[]){const all=[["org","Organization"],["project","Project"],["monitor","Monitor"],["result","First result"]];return `<ol class="steps">${all.map(([k,t])=>`<li class="step ${done.includes(k)?"done":""} ${current===k?"current":""}" ${current===k?'aria-current="step"':""}><span class="dot">${done.includes(k)?"✓":all.findIndex(x=>x[0]===k)+1}</span><span><b>${t}</b><small>${done.includes(k)?"Verified from Cerbix":current===k?"Current step":"Not reached"}</small></span></li>`).join("")}</ol>`}
function pageHead(done,current){const projectReady=done.includes("project"),monitorReady=done.includes("monitor");const title=projectReady?"Payments API":"Dashboard";const sub=projectReady?`${monitorReady?1:0} monitors · Acme Operations`:current==="org"?"No organization selected":"0 monitors · Acme Operations";return `<div class="head"><h1>${title}</h1><p class="sub">${sub}</p></div>`}
function shell({current,done,title,lead,badge="canonical state",body="",note=""}){return `${pageHead(done,current)}<section class="card guide" aria-label="Onboarding guide"><aside class="rail"><h2>Get to your first useful result</h2><p class="intro">Recomputed from the selected Cerbix scope.</p>${steps(current,done)}</aside><div class="panel"><div class="eyebrow"><span class="chip pending">${esc(badge)}</span></div><h2>${title}</h2><p class="lead">${lead}</p>${body}<div class="foot"><button>Skip for now</button><button>Do not show automatically</button><span class="spacer"></span><span>Normal navigation stays available.</span></div></div></section>${note?`<div class="reviewnote"><b>Spec note.</b> ${note}</div>`:""}`}
let existingGuideOpen=true;
function statusPill(status,label){const text=label||(status==="up"?"Operational":status==="degraded"?"Degraded":"Down");return `<span class="statuspill ${status}"><i></i>${text}</span>`}
function uptimeSvg(segments,height=26,cls="uptime"){return `<svg class="${cls}" viewBox="0 0 ${segments.length} 10" preserveAspectRatio="none" role="img" aria-label="availability">${segments.map((status,index)=>`<rect x="${index+.13}" y="0" width=".74" height="10" rx=".2" ry=".7" style="fill:var(--${status})"></rect>`).join("")}</svg>`}
function sparkline(values){const width=108,height=30,pad=3,min=Math.min(...values),max=Math.max(...values),range=max-min||1;const points=values.map((value,index)=>[pad+(index/(values.length-1||1))*(width-pad*2),pad+(1-(value-min)/range)*(height-pad*2)]);const line=points.map((point,index)=>`${index?"L":"M"}${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(" ");const area=`${line} L${points.at(-1)[0].toFixed(1)} ${height-pad} L${points[0][0].toFixed(1)} ${height-pad} Z`;const end=points.at(-1);return `<svg class="sparkline" viewBox="0 0 108 30" fill="none" aria-hidden="true"><defs><linearGradient id="spark-${values[0]}-${values.length}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><line x1="3" y1="27" x2="105" y2="27" stroke="currentColor" stroke-opacity=".1"/><path d="${area}" fill="url(#spark-${values[0]}-${values.length})"/><path d="${line}" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`}
function monitorCard({name,type,description,status="up",uptime,latency,budget=null,budgetWarn=false,sparkValues,segments}){const latencyBlock=type!=="push"?`<div class="stat"><label>Latency</label><b>${esc(latency)}</b></div>`:"";const budgetBlock=budget===null||type==="push"?"":`<div><div class="budgetrow"><span>Error budget</span><b>${budget}% left</b></div><div class="budget"><span class="${budgetWarn?"warn":""}" style="width:${budget}%"></span></div></div>`;return `<article class="card monitorcard"><div class="monitorhead"><span class="monitorname">${esc(name)}</span><span class="typetag">${esc(type)}</span>${statusPill(status)}</div>${description?`<div class="monitor-description">${esc(description)}</div>`:""}${uptimeSvg(segments)}<div class="monitorstats"><div class="stat"><label>Uptime 30d</label><b>${esc(uptime)}</b></div>${latencyBlock}${sparkValues?.length?sparkline(sparkValues):""}</div>${budgetBlock}</article>`}
function dashboard(){const days=Array.from({length:90},(_,index)=>index===34?"down":index===35||index===71?"degraded":"up");const segA=Array.from({length:48},(_,index)=>index===18?"down":index===19?"degraded":"up"),segB=Array.from({length:48},(_,index)=>index===31||index===32?"degraded":"up"),segC=Array.from({length:48},()=>"up");return `<section aria-label="Current Dashboard content"><div class="dashboardhero"><div class="kpis"><article class="card kpi"><span class="name">Availability · 30d</span><div class="value">99.94%</div><div class="delta"><span class="trend">▲ 0.03%</span> vs previous 30d</div></article><article class="card kpi"><span class="name">Monitors up</span><div class="value">13<span class="unit"> / 14</span></div><div class="delta">1 down</div></article><article class="card kpi"><span class="name">Error budget · 30d</span><div class="value">76%</div><div class="delta">24% burned</div></article><article class="card kpi"><span class="name">P95 latency · 30d</span><div class="value">184<span class="unit"> ms</span></div><div class="delta">all responding monitors</div></article></div><article class="card availability"><div class="row"><b>Project availability · 90 days</b><small>99.94% uptime</small></div>${uptimeSvg(days,38,"project-uptime")}<div class="legend"><span><i style="background:var(--up)"></i>Operational</span><span><i style="background:var(--degraded)"></i>Degraded</span><span><i style="background:var(--down)"></i>Down</span><span class="range">90 days ago → today</span></div></article></div><div class="monitor-grid">${monitorCard({name:"Checkout API",type:"http",description:"Public checkout health endpoint",uptime:"99.99%",latency:"128 ms",budget:92,sparkValues:[112,126,119,138,132,145,136,151,143,158,147,154],segments:segA})}${monitorCard({name:"Primary PostgreSQL",type:"postgres",description:"Writer connection and query probe",status:"degraded",uptime:"99.91%",latency:"246 ms",budget:64,budgetWarn:true,sparkValues:[190,202,218,210,236,228,251,243,268,258,249,272],segments:segB})}${monitorCard({name:"Billing heartbeat",type:"push",description:"Expected after each settlement batch",uptime:"—",latency:"—",sparkValues:[],segments:segC})}</div></section>`}
function existing(){const guide=existingGuideOpen?`<section class="card inlineguide" aria-label="Onboarding guide opened manually"><div><span class="chip pending">Opened manually · setup already complete</span><h2>First useful result already exists</h2><p>14 monitors and persisted heartbeat evidence were found. Automatic onboarding stays closed for this project.</p><div class="guidefacts"><span class="chip up">✓ Organization</span><span class="chip up">✓ Project</span><span class="chip up">✓ Monitor</span><span class="chip up">✓ First result</span></div></div><div class="actions"><button class="btn" data-action="toggle-existing-guide">Collapse guide</button><button class="btn primary">Review setup</button></div></section>`:`<div class="guideclosed"><span>Onboarding guide collapsed. Dashboard content and data are unchanged.</span><button class="btn" data-action="toggle-existing-guide">Open guide</button></div>`;return `<div class="head"><h1>Payments API</h1><p class="sub">14 monitors · Acme Operations</p></div>${guide}${dashboard()}<div class="reviewnote"><b>Spec note.</b> The active product route and navigation label are <span class="mono">Dashboard</span>. Manual <span class="mono">Get started</span> adds only the compact panel above the unchanged <span class="mono">DashboardView</span> KPI, 90-day availability and <span class="mono">MonitorCard</span> content.</div>`}
const screens={
admin:()=>shell({current:"org",done:[],title:"Create your organization",lead:"Organizations are Cerbix's top-level tenant boundary. You become the first organization admin.",body:`<div class="facts"><span class="k">Name</span><span>Acme Operations</span><span class="k">Slug</span><span class="mono">acme-operations</span></div><div class="actions"><button class="btn primary">Create organization</button><button class="btn">Choose an existing organization</button></div>`,note:"Automatic entry is inline, never a modal. The create dialog remains the mutation and validation owner; this panel only opens it."}),
project:()=>shell({current:"project",done:["org"],badge:"organization admin",title:"Create the first project",lead:"Projects isolate monitors, members and operational settings inside Acme Operations.",body:`<div class="facts"><span class="k">Organization</span><span>Acme Operations</span><span class="k">Project name</span><span>Payments API</span><span class="k">Slug</span><span class="mono">payments-api</span></div><div class="actions"><button class="btn primary">Create project</button><button class="btn">Choose another organization</button></div>`,note:"Project creation remains owned by the existing dialog and org:manage authorization. A non-admin receives the handoff copy instead of this mutation action."}),
viewer:()=>shell({current:"monitor",done:["org","project"],badge:"viewer · read only",title:"An editor needs to create the first monitor",lead:"You can follow setup and inspect results, but your role cannot create or change monitors in Payments API.",body:`<div class="notice info"><span>ℹ</span><div><b>Ask a project editor or admin.</b><br>Required capability: <span class="mono">project:write</span>. Your current access still allows project and heartbeat reads.</div></div><div class="actions"><button class="btn primary">Copy handoff message</button><button class="btn">View project members</button></div>`,note:"The guide names the capability and handoff; it does not render a mysterious disabled Create button or imply the viewer can complete the step."}),
monitor:()=>shell({current:"monitor",done:["org","project"],title:"Choose one real target",lead:"Start with a monitor that can return evidence quickly. The full typed form owns validation, secrets and region choice.",body:`<div class="choicegrid"><div class="choice recommended"><span class="chip">recommended</span><b>HTTP</b><small>Check a URL and status/response conditions.</small></div><div class="choice"><b>TCP</b><small>Check whether a host and port accept a connection.</small></div><div class="choice"><b>DNS</b><small>Resolve a real record through the typed DNS form.</small></div><div class="choice"><b>Push</b><small>Your job sends the first heartbeat after creation.</small></div><div class="choice"><b>Credentialed</b><small>Use project secrets in the complete monitor form.</small></div><div class="choice"><b>All monitor types</b><small>Synthetic, async canary, regional and advanced types.</small></div></div><div class="actions"><button class="btn primary">Continue with HTTP</button><button class="btn">Open full monitor form</button></div>`,note:"Composite is absent from first-target recommendations because it requires child monitors. No mini-form or copied validator is introduced."}),
waiting:()=>shell({current:"result",done:["org","project","monitor"],badge:"waiting · not healthy yet",title:"Monitor saved. Waiting for its first real result",lead:"Cerbix has not persisted a heartbeat for Checkout API yet. Creation alone does not prove the target is healthy.",body:`<div class="wait" aria-live="polite"><span class="spinner"></span><div><b>Waiting for a result from <span class="mono">core</span></b><br><span style="color:var(--ink-3)">Expected after the monitor's first scheduled run. Last checked 8 seconds ago.</span></div></div><div class="facts"><span class="k">Monitor</span><span>Checkout API</span><span class="k">Type</span><span class="mono">http</span><span class="k">Interval</span><span class="mono">60s</span><span class="k">Evidence</span><span>No heartbeat stored</span></div><div class="actions"><button class="btn primary">Open monitor</button><button class="btn">Choose another monitor</button></div>`,note:"The unchanged wait message is not re-announced on every poll. Reduced motion stops the spinner; the text still carries the state."}),
worker:()=>shell({current:"result",done:["org","project","monitor"],badge:"action required",title:"No worker is connected in geo-eu",lead:"Cerbix cannot run this pull monitor in its selected region yet. The monitor remains saved and no result is invented.",body:`<div class="notice warn"><span>!</span><div><b>Worker region unavailable.</b><br><span class="mono">GET /api/v1/regions</span> reports <span class="mono">geo-eu · live=false</span>. Cerbix will not silently move the monitor to core.</div></div><div class="actions"><button class="btn primary">Open monitor settings</button><button class="btn">View worker recovery guide</button></div>`,note:"Worker liveness is an existing authenticated fact. Scheduler unavailability is not; the implementation must use the separate honest no-result wording until a scheduler fact is approved."}),
scheduler:()=>shell({current:"result",done:["org","project","monitor"],badge:"diagnosis incomplete",title:"No result yet",lead:"A worker is connected in core, but current product facts do not prove whether the scheduler issued this monitor's first run.",body:`<div class="notice warn"><span>?</span><div><b>Do not call this a scheduler outage.</b><br>The expected wait has passed. Continue with deployment readiness, scheduler logs and metrics, or approve a later bounded scheduler diagnostic fact.</div></div><div class="facts"><span class="k">Region worker</span><span class="chip up">● connected</span><span class="k">Heartbeat</span><span>None stored</span><span class="k">Scheduler fact</span><span class="chip pending">not exposed</span></div><div class="actions"><button class="btn primary">Open diagnostics guide</button><button class="btn">Keep waiting</button></div>`,note:"This is the required scheduler branch expressed truthfully. It distinguishes an absent fact from an unavailable scheduler and is the explicit API/data owner choice in §18."}),
up:()=>shell({current:"result",done:["org","project","monitor","result"],badge:"first result received",title:"Checkout API returned UP",lead:"Onboarding is complete because Cerbix stored a real terminal observation. Optional setup stays optional.",body:`<div class="facts"><span class="k">Observed</span><span class="mono">2026-09-19 09:42:18 Z</span><span class="k">Result</span><span><span class="chip up">● UP</span></span><span class="k">HTTP code</span><span class="mono">200</span><span class="k">Latency</span><span class="mono">184 ms</span></div><div class="actions"><button class="btn primary">Open monitor</button><button class="btn">Return to overview</button></div><div class="optional"><h3>Optional next actions</h3><div class="optionlinks"><span>Create a service</span><span>Configure notifications</span><span>Publish a status page</span><span>Set reliability objectives</span></div></div>`,note:"Optional actions are outside the four-step denominator. Nothing here creates a service, channel, page or policy automatically."}),
down:()=>shell({current:"result",done:["org","project","monitor","result"],badge:"real evidence · target failed",title:"Checkout API returned DOWN",lead:"The journey is complete, but the target is not healthy. Open the monitor to inspect and correct the real failure.",body:`<div class="facts"><span class="k">Observed</span><span class="mono">2026-09-19 09:42:18 Z</span><span class="k">Result</span><span><span class="chip down">● DOWN</span></span><span class="k">HTTP code</span><span class="mono">503</span><span class="k">Message</span><span class="mono">expected status 200..299, got 503</span></div><div class="actions"><button class="btn primary">Open monitor</button><button class="btn">Edit monitor</button></div>`,note:"Journey success and target failure are deliberately separate. The server message is shown rather than replaced by generic onboarding language."}),
readfail:()=>shell({current:"result",done:["org","project","monitor"],badge:"verification failed",title:"We couldn't verify setup",lead:"The heartbeat read failed. Nothing has been marked incomplete or complete, and this is not rendered as an empty project.",body:`<div class="notice err"><span>!</span><div><b>Could not load recent heartbeats.</b><br><span class="mono">request failed: 503 service unavailable</span></div></div><div class="actions"><button class="btn primary">Retry verification</button><button class="btn">Open monitor</button></div>`,note:"failed_read has precedence over all empty states. Retry is bounded and ordinary navigation remains available."}),
existing,
push:()=>shell({current:"result",done:["org","project","monitor"],badge:"push branch",title:"Send the first heartbeat from your real job",lead:"The push monitor exists, but Cerbix has not received a heartbeat. Use the existing monitor-detail endpoint panel to copy the tokenized URL.",body:`<div class="notice info"><span>→</span><div><b>Open Push endpoint instructions.</b><br>The onboarding guide does not repeat, persist or analyze the push token.</div></div><div class="facts"><span class="k">Expected cadence</span><span class="mono">every 10m + 2m grace</span><span class="k">Evidence</span><span>No heartbeat received</span></div><div class="actions"><button class="btn primary">Open push instructions</button><button class="btn">Leave and resume later</button></div>`,note:"Secrets and push tokens remain under their existing reveal/copy contracts. The guide stores no credential or target payload."})
};
const order=[["admin","Fresh admin"],["project","Org admin"],["viewer","Invited viewer"],["monitor","Choose monitor"],["waiting","Waiting"],["worker","Worker unavailable"],["scheduler","Scheduler unknown"],["up","First UP"],["down","First DOWN"],["readfail","Failed read"],["existing","Existing install"],["push","Push branch"]];let active="admin";
const nav=document.getElementById("screens"),view=document.getElementById("view"),app=document.getElementById("app");
nav.innerHTML=order.map(([k,t],i)=>`<button data-k="${k}" class="${k===active?"on":""}"><span class="n">${i+1}</span>${esc(t)}</button>`).join("");
function render(){view.innerHTML=screens[active]();nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===active));window.scrollTo(0,0)}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(!b)return;active=b.dataset.k;render()});
view.addEventListener("click",e=>{if(!e.target.closest('[data-action="toggle-existing-guide"]'))return;existingGuideOpen=!existingGuideOpen;render()});
document.getElementById("entryBtn").addEventListener("click",()=>{if(active!=="existing")return;existingGuideOpen=true;render()});
document.getElementById("themeBtn").addEventListener("click",()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b0b0f";r.setAttribute("data-theme",d?"light":"dark")});
document.getElementById("notesBtn").addEventListener("click",e=>{const off=document.body.classList.toggle("hide-notes");e.currentTarget.classList.toggle("on",!off);e.currentTarget.setAttribute("aria-pressed",String(!off))});
document.getElementById("widthBtn").addEventListener("click",e=>{const narrow=app.classList.toggle("narrow");e.currentTarget.classList.toggle("on",narrow);e.currentTarget.setAttribute("aria-pressed",String(narrow));e.currentTarget.textContent=narrow?"Desktop width":"Narrow width"});render();
</script>
</body>
