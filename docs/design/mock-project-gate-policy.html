<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerbix · Project gate policy</title>
<style>
:root{--bg:#fafafb;--surface:#fff;--surface-2:#f5f5f8;--inset:#f0f0f4;--border:#e9e9ef;--border-strong:#dadae4;--ink:#17171f;--ink-2:#55556a;--ink-3:#8a8a9d;--accent:#5854f2;--accent-2:#7a77ff;--accent-ink:#fff;--accent-weak:rgba(88,84,242,.1);--focus:#5854f2;--up:#12a05c;--up-weak:rgba(18,160,92,.12);--down:#e0393f;--down-weak:rgba(224,57,63,.12);--degraded:#b97800;--degraded-weak:rgba(185,120,0,.13);--pending:#8a8a9d;--pending-weak:rgba(138,138,157,.14);--shadow:0 1px 2px rgba(20,20,40,.04),0 4px 16px rgba(20,20,40,.04);--note:#5854f2;--note-bg:rgba(88,84,242,.055);--note-border:rgba(88,84,242,.28);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0f;--surface:#141419;--surface-2:#1a1a20;--inset:#101015;--border:#262630;--border-strong:#34343f;--ink:#f2f2f6;--ink-2:#a4a4b6;--ink-3:#6c6c7e;--accent:#7d79ff;--accent-2:#928fff;--accent-ink:#0b0b0f;--accent-weak:rgba(125,121,255,.15);--focus:#7d79ff;--up:#35c67f;--up-weak:rgba(53,198,127,.15);--down:#ff5f64;--down-weak:rgba(255,95,100,.15);--degraded:#e0a53a;--degraded-weak:rgba(224,165,58,.15);--pending:#6c6c7e;--pending-weak:rgba(108,108,126,.18);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--note:#928fff;--note-bg:rgba(125,121,255,.09);--note-border:rgba(125,121,255,.32);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0f;--surface:#141419;--surface-2:#1a1a20;--inset:#101015;--border:#262630;--border-strong:#34343f;--ink:#f2f2f6;--ink-2:#a4a4b6;--ink-3:#6c6c7e;--accent:#7d79ff;--accent-2:#928fff;--accent-ink:#0b0b0f;--accent-weak:rgba(125,121,255,.15);--focus:#7d79ff;--up:#35c67f;--up-weak:rgba(53,198,127,.15);--down:#ff5f64;--down-weak:rgba(255,95,100,.15);--degraded:#e0a53a;--degraded-weak:rgba(224,165,58,.15);--pending:#6c6c7e;--pending-weak:rgba(108,108,126,.18);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--note:#928fff;--note-bg:rgba(125,121,255,.09);--note-border:rgba(125,121,255,.32);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}h1,h2,h3,p{margin:0}.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}.spacer{flex:1}
.reviewbar{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:9px}.mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}.mark svg{width:15px;height:15px}.brand b{font-size:15px;letter-spacing:-.02em}.reviewtag{border:1px solid var(--border);border-radius:6px;padding:3px 8px;font:11px/1.4 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink-3)}
.tbtn,.btn{height:34px;border:1px solid var(--border);border-radius:6px;padding:0 13px;background:var(--surface);font-size:13px;font-weight:500}.tbtn.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.screens{position:sticky;top:52px;z-index:39;display:flex;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}.screens button{padding:9px 10px 8px;white-space:nowrap;color:var(--ink-3);border-bottom:2px solid transparent;font-size:12px}.screens button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}.screens .n{font:10px ui-monospace,"SF Mono",Menlo,monospace;margin-right:5px;color:var(--ink-3)}
.stage{max-width:1480px;margin:0 auto;padding:16px}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:900px;border:1px solid var(--border);background:var(--bg);overflow:hidden}.app.narrow{grid-template-columns:1fr;max-width:390px;margin:0 auto}.app.narrow .side{display:none}.app.narrow .topsearch{display:none}.app.narrow .settings-grid,.app.narrow .two{grid-template-columns:1fr}.app.narrow .settings-wrap,.app.narrow .service-wrap{padding:20px 14px}.app.narrow .row{grid-template-columns:1fr}.app.narrow .settings-nav{position:static}
.side{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--border);padding:12px}.sidebrand{display:flex;align-items:center;gap:9px;padding:6px 8px 12px}.sidebrand b{font-size:15px;letter-spacing:-.02em}.switcher{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:8px 10px;margin-bottom:6px}.orgtile{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:11px;font-weight:700}.switchcopy{display:flex;min-width:0;flex-direction:column;line-height:1.2;text-align:left}.switchcopy b{font-size:13px}.switchcopy span{font-size:11px;color:var(--ink-3)}.chev{margin-left:auto;color:var(--ink-3)}.navlabel{padding:12px 10px 4px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}.navitem{display:flex;align-items:center;gap:10px;border-radius:6px;padding:7px 10px;font-size:13.5px;color:var(--ink-2)}.navitem svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9}.navitem.on{background:var(--accent-weak);color:var(--accent);font-weight:500}.version{padding:6px 10px 2px;font:10.5px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink-3)}
.main{min-width:0}.apphead{height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface);padding:0 22px}.crumbs{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-3)}.crumbs .current{font-weight:600;color:var(--ink)}.slash{color:var(--border-strong)}.headtools{margin-left:auto;display:flex;align-items:center;gap:8px}.topsearch{height:34px;width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 10px;color:var(--ink-3);font-size:13px}.topsearch svg,.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}.topsearch kbd{margin-left:auto;border:1px solid var(--border);border-radius:3px;padding:0 4px;font:10px ui-monospace,"SF Mono",Menlo,monospace}.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink-2)}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:12px;font-weight:700}
.settings-wrap,.service-wrap{max-width:1180px;margin:0 auto;padding:26px 22px 64px}.pagehead{margin-bottom:20px}.pagehead h1,.service-title h1{font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.025em}.pagehead p,.service-title p{margin-top:3px;font-size:13px;color:var(--ink-3)}.settings-grid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}.settings-nav{display:flex;flex-direction:column;gap:18px;align-self:start}.setlabel{margin-bottom:5px;padding:0 10px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}.setitem{display:block;width:100%;border-radius:6px;padding:7px 10px;text-align:left;font-size:13px;color:var(--ink-2)}.setitem.on{background:var(--accent-weak);color:var(--accent);font-weight:500}.content{min-width:0}
.card{overflow:hidden;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}.cardhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:12px 16px}.cardhead h2{font-size:14px;font-weight:600}.cardhead p{margin-top:2px;font-size:12px;color:var(--ink-3)}.body{padding:16px}.stack{display:flex;flex-direction:column;gap:16px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink-2)}.field small{font-size:12px;font-weight:400;color:var(--ink-3)}.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}select,input{height:34px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px;font-size:13px;outline:none}.mode{display:flex;flex-wrap:wrap;gap:8px}.mode button{height:32px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-size:12.5px}.mode button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:2px 7px;font-size:11.5px;line-height:1.4;color:var(--ink-2)}.chip.acc{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}.chip.dorm{border-style:dashed;color:var(--ink-3)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}.pill.pending{border:1px dashed var(--border-strong);background:var(--inset);color:var(--ink-3)}.dot{width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--pending)}
.clauses{overflow:hidden;border:1px solid var(--border);border-radius:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;border-bottom:1px solid var(--border);padding:12px}.row:last-child{border-bottom:0}.rowtitle{font:12.5px ui-monospace,"SF Mono",Menlo,monospace}.rowsub{margin-top:2px;font-size:12px;color:var(--ink-3)}.seg{display:inline-flex;align-self:start;overflow:hidden;border:1px solid var(--border);border-radius:6px}.seg span{border-right:1px solid var(--border);padding:4px 10px;font-size:11.5px;color:var(--ink-3)}.seg span:last-child{border-right:0}.seg .block{background:var(--down-weak);color:var(--down);font-weight:600}.seg .warn{background:var(--degraded-weak);color:var(--degraded);font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:8px}
.service-title{margin-bottom:16px}.gate{margin-bottom:16px}.gate .cardhead{padding:10px 16px}.gate .cardhead h2{font-size:13.5px}.gatebody{display:flex;flex-direction:column;gap:14px;padding:16px}.policytop{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.policytop h3{font-size:13px}.readonly{display:flex;flex-direction:column;gap:14px}.readfield{display:flex;flex-direction:column;gap:5px}.readfield p{font-size:13px}.readfield small{font-size:12px;color:var(--ink-3)}.windowbox{display:flex;flex-wrap:wrap;align-items:center;gap:9px;border:1px solid var(--border);border-radius:7px;padding:11px 13px}.windowbox .label{min-width:140px}.emptycopy{max-width:62ch;font-size:13px;color:var(--ink-2)}.note{margin-top:14px;border:1px dashed var(--note-border);border-left:3px solid var(--note);border-radius:6px;background:var(--note-bg);padding:10px 12px;font-size:12px;color:var(--ink-2)}.hide-notes .note{display:none}
@media(max-width:820px){.stage{padding:10px}.app{grid-template-columns:1fr}.side{display:none}.topsearch{display:none}.settings-grid,.two,.row{grid-template-columns:1fr}.settings-wrap,.service-wrap{padding:20px 14px}}
@media(max-width:600px){.reviewbar{gap:6px;padding:0 10px;overflow-x:auto}.reviewtag,.reviewbar .brand b{display:none}.tbtn{padding:0 9px}}
</style>
</head>
<body>
<div class="reviewbar"><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M8.5 12l2 2 4.5-4.5"/></svg></span><b>cerbix</b></div><span class="reviewtag">FR-034 · current UI transcription</span><span class="spacer"></span><button class="tbtn on" id="notesBtn" aria-pressed="true">Spec notes</button><button class="tbtn" id="widthBtn" aria-pressed="false">Narrow width</button><button class="tbtn" id="themeBtn">Theme</button></div>
<nav class="screens" id="screens"></nav>
<div class="stage"><div class="app" id="app"><aside class="side" id="side"></aside><main class="main"><header class="apphead" id="apphead"></header><div id="view"></div></main></div></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',services:'<rect x="3" y="4" width="18" height="6" rx="1.6"/><rect x="3" y="14" width="18" height="6" rx="1.6"/><path d="M7 7h.01M7 17h.01"/>',monitors:'<path d="M3 12h4l2 6 4-14 2 8h6"/>',sla:'<path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 5-7"/>',gate:'<path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',escalation:'<path d="M12 3v10"/><path d="M8 9l4 4 4-4"/><path d="M4 21h16"/>',incidents:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/>',status:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',settings:'<circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2l-.4-2.6H9.9l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.4 2.6h4.2l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>'};
const navitem=(key,label,on)=>`<div class="navitem ${on?'on':''}"><svg viewBox="0 0 24 24">${icon[key]}</svg>${esc(label)}</div>`;
function sidebar(active){return `<div class="sidebrand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M8.5 12l2 2 4.5-4.5"/></svg></span><b>cerbix</b></div><button class="switcher"><span class="orgtile">A</span><span class="switchcopy"><b>Acme Corp</b><span>payments</span></span><span class="chev">⌄</span></button><div class="navlabel">Project</div>${navitem('dashboard','Dashboard',active==='dashboard')}${navitem('services','Services',active==='services')}${navitem('monitors','Monitors',false)}${navitem('sla','SLA & SLO',false)}${navitem('gate','Gate decisions',false)}${navitem('escalation','Escalation',false)}${navitem('incidents','Incidents',false)}${navitem('status','Status pages',false)}<span class="spacer"></span>${navitem('settings','Settings',active==='settings')}<div class="version">cerbix 0.1.9</div>`}
function header(crumbs){return `<nav class="crumbs">${crumbs.map((c,i)=>`${i?'<span class="slash">/</span>':''}<span class="${i===crumbs.length-1?'current':''}">${esc(c)}</span>`).join('')}</nav><div class="headtools"><div class="topsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span>Search…</span><kbd>/</kbd></div><button class="iconbtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></button><span class="avatar">AN</span></div>`}
const clause=(name,desc,on)=>`<div class="row"><div><div class="rowtitle">${name}</div><div class="rowsub">${desc}</div></div><div class="seg"><span class="${on==='block'?'block':''}">block</span><span class="${on==='warn'?'warn':''}">warn</span><span>ignore</span></div></div>`;
const clauses=()=>`<div class="clauses">${clause('budget_exhausted',"the window's error budget is spent — burned ≥ 100 %",'block')}${clause('budget_consumed','burned ≥ the threshold · 1..100, an integer','warn')}${clause('page_burn_firing','a page-severity burn rule of this window is firing right now','block')}${clause('ticket_burn_firing','a ticket-severity burn rule of this window is firing','warn')}${clause('service_incident_open','an unresolved incident opened automatically on this service — warns by default: the deploy is often the fix','warn')}</div>`;
const settingsNav=()=>`<nav class="settings-nav"><div><div class="setlabel">Project</div><button class="setitem">Notification channels</button><button class="setitem">Incoming alerts</button><button class="setitem">Secrets</button><button class="setitem on">Release gate</button><button class="setitem">Danger zone</button></div><div><div class="setlabel">Organization</div><button class="setitem">Members</button><button class="setitem">API tokens</button><button class="setitem">Webhooks</button></div><div><div class="setlabel">Account</div><button class="setitem">Security</button></div></nav>`;
function project(){return `<div class="settings-wrap"><div class="pagehead"><h1>Settings</h1><p>Project, organization and instance configuration.</p></div><div class="settings-grid">${settingsNav()}<div class="content"><section class="card"><div class="cardhead"><div><h2>Release gate policy</h2><p>Default policy inherited by services without an explicit service policy.</p></div><span class="spacer"></span><span class="chip acc">project policy</span></div><form class="body stack"><div class="actions"><span class="chip mono">schema_version 2</span><span class="chip mono">revision 12</span></div><div class="field"><span>Window evaluation</span><div class="mode"><button type="button">One window</button><button type="button" class="on">Worst of all configured windows</button></div><small>Each inheriting service resolves its own configured target inventory inside the decision snapshot.</small></div><div class="two"><label class="field">When a fact is unavailable<select><option>warn — proceed, say why</option></select></label></div>${clauses()}<div class="two"><label class="field">Budget consumed threshold, %<input value="90" type="number"></label><label class="field">Maximum seal lag, minutes<input value="15" type="number"></label></div><div class="actions"><button class="btn primary" type="button">Save policy</button><button class="btn" type="button">Cancel</button></div></form></section><div class="note"><b>Exact surface.</b> Current <span class="mono">Settings → Project → Release gate</span> editor. No separate “Effective-source contract” or “Last change” cards exist in Cerbix.</div></div></div></div>`}
function policyReadOnly(){return `<div class="gatebody"><div class="policytop"><h3>Gate policy</h3><span class="chip mono">schema_version 2</span><span class="chip acc">inherited from project · revision 12</span><span class="spacer"></span><button class="btn" type="button">Create service override</button></div><div class="readonly"><div class="two"><div class="readfield"><span class="label">Window evaluation</span><p>Worst of all configured windows</p></div><div class="readfield"><span class="label">Target inventory preview</span><p><span class="chip mono">7d · 99.9%</span> <span class="chip mono">30d · 99.95%</span></p><small>preview only · the policy stores no copied target list</small></div><div class="readfield"><span class="label">When a fact is unavailable</span><p>warn — proceed, say why</p><small><span class="mono">unknown_behavior</span>: <b>warn</b> lets a release through with the reasons printed; <b>block</b> holds it</small></div></div><div><div class="label" style="margin-bottom:8px">Release-risk facts</div>${clauses()}</div><div class="two"><p><span style="color:var(--ink-3)">Budget consumed threshold:</span> <span class="mono">90%</span></p><p><span style="color:var(--ink-3)">Maximum seal lag:</span> <span class="mono">15m</span></p></div></div></div>`}
function servicePage(inherited){return `<div class="service-wrap"><div class="service-title"><h1>${inherited?'Checkout API':'Sandbox API'}</h1><p>Service · payments</p></div><section class="card gate"><div class="cardhead"><h2>Release gate</h2><span class="spacer"></span><span class="chip ${inherited?'acc':'dorm'}">${inherited?'inherited from project · revision 12':'no policy'}</span><button class="btn" type="button">the five answers</button></div>${inherited?policyReadOnly():`<div class="gatebody"><p class="emptycopy">Nothing asks this service before a release yet. A gate policy evaluates <b>one SLO window or every configured window</b> of this service and says, for each release-risk fact, whether it <b>blocks</b>, <b>warns</b> or is <b>ignored</b>. A pipeline then asks <span class="mono">cerbix gate check</span> immediately before the protected step and gets one of <span class="mono">ALLOW · WARN · BLOCK · UNKNOWN</span>, with the evidence it rests on.</p><div class="windowbox"><span class="label">Windows with a target</span><span class="chip mono">7d · 99.9%</span><span class="chip mono">30d · 99.95%</span><span class="spacer"></span><span class="chip">one or all configured windows</span></div><div class="actions"><button class="btn primary" type="button">Configure gate</button></div></div>`}</section><div class="note"><b>${inherited?'Inherited service':'No-policy service'}.</b> Current <span class="mono">ServiceGate.vue</span> component grammar and legitimate service-level action.</div></div>`}
const states={project:{label:'Project editor',active:'settings',crumbs:['Acme Corp','Settings'],render:project},inherited:{label:'Inherited service',active:'services',crumbs:['Acme Corp','Services','Checkout API'],render:()=>servicePage(true)},empty:{label:'No policy',active:'services',crumbs:['Acme Corp','Services','Sandbox API'],render:()=>servicePage(false)}};
let active='project';const screens=document.getElementById('screens'),view=document.getElementById('view'),side=document.getElementById('side'),apphead=document.getElementById('apphead'),app=document.getElementById('app');screens.innerHTML=Object.entries(states).map(([k,v],i)=>`<button data-k="${k}" class="${k===active?'on':''}"><span class="n">${i+1}</span>${v.label}</button>`).join('');
function render(){const s=states[active];side.innerHTML=sidebar(s.active);apphead.innerHTML=header(s.crumbs);view.innerHTML=s.render();screens.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===active));window.scrollTo(0,0)}
screens.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;active=b.dataset.k;render()});document.getElementById('themeBtn').addEventListener('click',()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b0b0f';r.setAttribute('data-theme',d?'light':'dark')});document.getElementById('notesBtn').addEventListener('click',e=>{const off=document.body.classList.toggle('hide-notes');e.currentTarget.classList.toggle('on',!off);e.currentTarget.setAttribute('aria-pressed',String(!off))});document.getElementById('widthBtn').addEventListener('click',e=>{const narrow=app.classList.toggle('narrow');e.currentTarget.classList.toggle('on',narrow);e.currentTarget.textContent=narrow?'Desktop width':'Narrow width';e.currentTarget.setAttribute('aria-pressed',String(narrow))});render();
</script>
</body>
</html>
