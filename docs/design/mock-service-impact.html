<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const pill = (s, label) => {
  const cls = { up: "up", down: "down", deg: "deg", unk: "unk" }[s];
  const txt = label || { up: "Operational", down: "Down", deg: "Degraded", unk: "Unknown" }[s];
  return `<span class="pill ${cls}"><span class="dot"></span>${esc(txt)}</span>`;
};
const note = (ref, html) => `<div class="note"><span class="ref">${esc(ref)}</span><div>${html}</div></div>`;

/* ── screen 1: service detail — dependencies ──────────────────────────────── */
function sDetail() {
  return `
  <div class="head">
    <div>
      <h1>checkout</h1>
      <p class="sub">Service · <span class="mono">svc-checkout</span> · owned by UI</p>
    </div>
    <div class="spacer" style="flex:1"></div>
    ${pill("deg")}
  </div>

  ${note("§14.3", `Health on this screen is the phase-2 two-layer signal, reused verbatim; the whole
    neighbour set below is fetched as <b>ONE batched snapshot query</b> — never a per-service loop (invariant 60).`)}

  <div class="grid g2">
    <div class="card">
      <header><h2>Depends on</h2><span class="spacer"></span><span class="chip mono">2 / 20 edges</span></header>
      <div class="pad" style="display:flex; flex-direction:column; gap:8px">
        <a class="dep" href="#payments">
          <span class="nm">payments</span>
          <span class="chip mono">svc-payments</span>
          <span class="spacer"></span>
          ${pill("down")}
        </a>
        <a class="dep" href="#redis">
          <span class="nm">session-redis</span>
          <span class="chip mono">svc-session-redis</span>
          <span class="spacer"></span>
          ${pill("up")}
        </a>
      </div>
    </div>
    <div class="card">
      <header><h2>Depended on by</h2></header>
      <div class="pad" style="display:flex; flex-direction:column; gap:8px">
        <a class="dep" href="#storefront">
          <span class="nm">storefront</span>
          <span class="chip mono">svc-storefront</span>
          <span class="chip">file · shop.yaml</span>
          <span class="spacer"></span>
          ${pill("deg")}
        </a>
        <div class="dep ghost">edges are declared by each dependent service's owner</div>
      </div>
    </div>
  </div>

  ${note("§14.2", `The <b>storefront → checkout</b> edge is declared in a bundle, so <b>checkout is pinned</b>:
    deleting it returns 409 naming the provider until <span class="mono">shop.yaml</span> drops the slug
    (screen 2 shows the error). Edges create no definition revision and no epoch — this card can change
    freely without touching any sealed number (invariant 49).`)}

  <div class="card">
    <header><h2>Danger zone</h2></header>
    <div class="pad" style="display:flex; flex-direction:column; gap:10px">
      <div class="row">
        <button class="btn danger">Delete service</button>
        <span class="hint">Heartbeats and facts cascade; incident history keeps a name snapshot.</span>
      </div>
      <div class="err"><span>⛔</span><div><b>Blocked (409):</b> <span class="mono">storefront</span> (provider
        <span class="mono">file:shop.yaml</span>) declares <span class="mono">depends_on: [checkout]</span>.
        Remove the reference from the bundle, then delete.</div></div>
    </div>
  </div>`;
}

/* ── screen 2: edit dependencies (multiselect + honesty states) ───────────── */
function sEdit() {
  return `
  <div class="head">
    <div>
      <h1>checkout — dependencies</h1>
      <p class="sub">Replace-set · concurrency token <span class="mono">graph_generation 7</span></p>
    </div>
  </div>

  ${note("§14.2", `The token is the edge set's own CAS — edges live outside definition revisions, so
    <span class="mono">expected_revision</span> cannot protect them. A stale token is a <b>409</b>, shown below.
    Every non-no-op save writes an audit row (actor, added, removed) in the same transaction.`)}

  <div class="grid g2">
    <div class="card">
      <header><h2>Depends on</h2><span class="spacer"></span><span class="chip mono">2 / 20</span></header>
      <div class="pad stack" style="gap:10px">
        <div class="field">
          <input class="inp" placeholder="Search services in Payments…" aria-label="Search services">
          <span class="hint">Project services, excluding checkout itself. Max 20 direct edges.</span>
        </div>
        <div class="mlist">
          <label class="mrow sel"><span class="cbx on">✓</span><span class="nm">payments</span><span class="spacer"></span>${pill("down")}</label>
          <label class="mrow sel"><span class="cbx on">✓</span><span class="nm">session-redis</span><span class="spacer"></span>${pill("up")}</label>
          <label class="mrow"><span class="cbx"></span><span class="nm">subscriptions</span><span class="spacer"></span>${pill("up")}</label>
          <label class="mrow off"><span class="cbx"></span><span class="nm">storefront</span><span class="spacer"></span><span class="chip">would create a cycle</span></label>
        </div>
        <div class="row" style="justify-content:flex-end; gap:8px">
          <button class="btn">Cancel</button>
          <button class="btn pri">Save dependencies</button>
        </div>
      </div>
    </div>

    <div class="card">
      <header><h2>States the form must render honestly</h2></header>
      <div class="pad stack" style="gap:10px">
        <div class="err"><span>↻</span><div><b>Cycle (400):</b> <span class="mono">storefront → checkout →
          storefront</span>. The graph is a DAG; pick a direction and keep it.</div></div>
        <div class="err"><span>⏱</span><div><b>Stale set (409):</b> dependencies changed while you edited
          (<span class="mono">graph_generation 7 ≠ 9</span>). Reload to see the current set — your edit was
          not applied.</div><button class="fix">Reload</button></div>
        <div class="err"><span>▤</span><div><b>Limit (400):</b> a service takes at most
          <span class="mono">20</span> direct dependencies.</div></div>
        ${note("§14.1", `Cycle and depth are validated under the per-project <b>service_graph lock</b>, so two
          concurrent saves cannot compose a cycle. Depth cap 10 — the API rejects, it never truncates.`)}
      </div>
    </div>
  </div>`;
}

/* ── screen 3: incident detail — impact chips + 🕸 note ───────────────────── */
function sIncident() {
  return `
  <div class="head">
    <div>
      <h1>checkout-http is down</h1>
      <p class="sub"><span class="mono">INC-482</span> · auto · monitor <span class="mono">checkout-http</span> · opened 10:14:07Z</p>
    </div>
    <div class="spacer" style="flex:1"></div>
    ${pill("down", "Investigating")}
  </div>

  <div class="row" style="flex-wrap:wrap; gap:8px">
    <a class="imp root" href="#payments" title="payments → checkout">
      <span class="role">🕸 probable root</span>
      <span class="svc">payments</span>
      <span class="via mono">via payments → checkout</span>
    </a>
    <a class="imp root" href="#pg" title="billing-db → payments → checkout">
      <span class="role">🕸 probable root</span>
      <span class="svc">billing-db</span>
      <span class="via mono">via billing-db → payments → checkout</span>
    </a>
    <a class="imp aff" href="#storefront" title="checkout → storefront">
      <span class="role">affected</span>
      <span class="svc">storefront</span>
    </a>
  </div>

  ${note("§14.3", `Chips are the structured relation, not parsed prose. <b>Every</b> impacted upstream
    service on a path is a probable-root candidate — the relation never elects one culprit; the UI ranks by
    path depth (nearest first is <b>payments</b>, then <b>billing-db</b>). The path is stored root-first and
    endpoint-inclusive, so “via …” is the stored array verbatim (invariants 53, 55).`)}

  <div class="card">
    <header><h2>Timeline</h2></header>
    <div class="pad tl">
      <div class="tlrow">
        <span class="t mono">10:14:07Z</span>
        <div class="b">Opened: <b>checkout-http is down</b> — [STATUS] == 200 failed (connect timeout).
          <div class="who">auto · impact major</div></div>
      </div>
      <div class="tlrow sys">
        <span class="t mono">10:14:11Z</span>
        <div class="b"><span class="sysnote">⚡ Context: 4 monitors of this project went down within ±5m
          (payments-api, billing-pg, checkout-http, checkout-synthetic); dominant error: connection refused;
          all in region core.</span><div class="who">system</div></div>
      </div>
      <div class="tlrow sys">
        <span class="t mono">10:14:12Z</span>
        <div class="b"><span class="sysnote">🕸 Impact: probable root — payments (via payments → checkout),
          billing-db (via billing-db → payments → checkout); affected — storefront.</span>
          <div class="who">system</div></div>
      </div>
      <div class="tlrow sys">
        <span class="t mono">10:16:03Z</span>
        <div class="b"><span class="sysnote">⏸ Suppressed: alerts muted — depends on payments-api which is down.</span>
          <div class="who">system</div></div>
      </div>
    </div>
  </div>

  ${note("§14.3", `One 🕸 note per batch of <b>newly inserted</b> links: a redelivery inserts zero rows and
    writes zero notes; a late root earns a second note — a new fact at a new time. Prose is bounded at 8 names
    per role, then “+N more”; the chips above stay complete. The note rides its own durable outbox topic —
    webhook death never blocks it, and its failure never blocks the alert (invariant 52).`)}`;
}

/* ── screen 4: incidents list — deliberately WITHOUT impacts ──────────────── */
function sList() {
  const r = (id, title, st, when, monitor) => `<tr>
    <td class="mono">${esc(id)}</td>
    <td><b style="font-weight:550">${esc(title)}</b><div class="hint mono">${esc(monitor)}</div></td>
    <td>${st}</td>
    <td class="mono">${esc(when)}</td>
  </tr>`;
  return `
  <div class="head">
    <div>
      <h1>Incidents</h1>
      <p class="sub">Payments · 4 open</p>
    </div>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>ID</th><th>Incident</th><th>Status</th><th>Opened</th></tr></thead>
        <tbody>
          ${r("INC-480", "billing-pg is down", pill("down", "Investigating"), "10:12:41Z", "billing-pg")}
          ${r("INC-481", "payments-api is down", pill("down", "Investigating"), "10:13:29Z", "payments-api")}
          ${r("INC-482", "checkout-http is down", pill("down", "Investigating"), "10:14:07Z", "checkout-http")}
          ${r("INC-483", "storefront synthetic timeout", pill("deg", "Identified"), "10:15:52Z", "storefront-synthetic")}
        </tbody>
      </table>
    </div>
  </div>

  ${note("§14.4 / §14.7", `This screen is mocked to show what it does <b>not</b> gain: no impact chips, no
    per-row impact queries. The list is unbounded project history, and list × impacts is unbounded² —
    impacts live on the incident <b>detail</b> only (invariants 59, 60). The row you click tells the story
    one screen later, where it is bounded.`)}`;
}

/* ── shell mechanics (1:1 with the approved mock) ─────────────────────────── */
const SCREENS = [
  ["detail", "Service detail — dependencies", sDetail, "checkout"],
  ["edit", "Edit dependencies", sEdit, "checkout"],
  ["incident", "Incident — impact", sIncident, "INC-482"],
  ["list", "Incidents list — no impacts", sList, "Incidents"],
];
let active = "detail";
const nav = document.getElementById("screens");
const view = document.getElementById("view");
nav.innerHTML = SCREENS.map(([k, t], i) =>
  `<button data-k="${k}" class="${k === active ? "on" : ""}"><span class="n">${i + 1}</span>${esc(t)}</button>`).join("");

function render() {
  const [, , fn, crumb] = SCREENS.find(([k]) => k === active);
  view.innerHTML = fn();
  document.getElementById("crumb").textContent = crumb;
  nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.k === active));
  window.scrollTo(0, 0);
}
nav.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  active = b.dataset.k;
  render();
});

document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0b0b0f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

const notesBtn = document.getElementById("notesBtn");
notesBtn.addEventListener("click", () => {
  const off = document.body.classList.toggle("hide-notes");
  notesBtn.classList.toggle("on", !off);
  notesBtn.setAttribute("aria-pressed", String(!off));
});

render();
</script>
