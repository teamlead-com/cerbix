/* ─────────────────────────────────────────────────────────────────────────────

:root {

  /* UNKNOWN reuses the pending hue; --note-* is the review overlay only */

}

/* ── base ─────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}
.lbl{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3)}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

/* ── app shell ────────────────────────────────────────────────────────────── */
.app{display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh}
.side{
  position:sticky; top:0; height:100vh; align-self:start;
  border-right:1px solid var(--border); background:var(--surface);
  display:flex; flex-direction:column; gap:18px; padding:16px 12px;
}
.brand{display:flex; align-items:center; gap:9px; padding:4px 8px 0}
.brand svg{flex:none}
.brand .wm{font-size:15px; letter-spacing:-.01em; font-weight:600}
/* 1:1 with AppShell.vue: gradient org avatar, ORG bold on top, project below. */
.switcher{

  background:var(--surface-2); padding:8px 10px; display:flex; align-items:center; gap:8px; text-align:left;
}
.switcher:hover{border-color:var(--border-strong)}
.switcher .ava{

}
.switcher .names{display:flex; flex-direction:column; min-width:0; line-height:1.25}
.switcher .names b{font-size:13px; font-weight:600}

.nav svg{flex:none; opacity:.85}
.nav.on{background:var(--accent-weak); color:var(--accent); font-weight:550}
.nav.new::after{content:"new"; margin-left:auto; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:var(--accent-weak); padding:1px 5px; border-radius:4px}

.main{min-width:0; display:flex; flex-direction:column}

/* ── cards ────────────────────────────────────────────────────────────────── */
.card{border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:var(--shadow)}
.card > header{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border)}

.pad{padding:16px}
.grid{display:grid; gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ── pills ────────────────────────────────────────────────────────────────── */
.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px 0 7px; border-radius:999px; font-size:12px; font-weight:500}
.pill .dot{width:7px; height:7px; border-radius:50%; position:relative; flex:none}
.pill .dot::after{content:""; position:absolute; inset:0; border-radius:50%; background:inherit; animation:ping 1.9s cubic-bezier(0,0,.2,1) infinite}
.pill:not(.up) .dot::after{display:none}
@keyframes ping{75%,100%{transform:scale(2); opacity:0}}
@media (prefers-reduced-motion:reduce){.pill .dot::after{display:none}}
.pill.up{color:var(--up); background:var(--up-weak)}          .pill.up .dot{background:var(--up)}
.pill.down{color:var(--down); background:var(--down-weak)}    .pill.down .dot{background:var(--down)}
.pill.deg{color:var(--degraded); background:var(--degraded-weak)} .pill.deg .dot{background:var(--degraded)}
.pill.mnt{color:var(--maint); background:var(--maint-weak)}   .pill.mnt .dot{background:var(--maint)}
.pill.unk{color:var(--ink-2); background:var(--unknown-weak); border:1px dashed var(--border-strong)} .pill.unk .dot{background:var(--unknown)}
.chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:5px; padding:2px 7px; font-size:11.5px; color:var(--ink-2); background:var(--surface-2)}
.chip.mono{font-size:11.5px}
.chip.acc{border-color:var(--accent); color:var(--accent); background:var(--accent-weak)}

/* ── KPI ──────────────────────────────────────────────────────────────────── */
.kpi{display:flex; flex-direction:column; gap:8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:14px 16px; box-shadow:var(--shadow)}
.kpi .v{font-size:26px; font-weight:500; line-height:1; letter-spacing:-.02em}
.kpi .v small{font-size:15px; color:var(--ink-3); font-weight:400}
.kpi .s{font-size:12px; color:var(--ink-3)}
.kpi.muted .v{color:var(--ink-3)}
.kpi.muted{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--surface-2) 7px 14px)}

/* ── timeline strip ───────────────────────────────────────────────────────── */
.strip{position:relative}
.bar-area{position:relative}
.bar-area > svg{display:block; width:100%; height:26px}
.strip.tall .bar-area > svg{height:40px}
.axis{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); padding-top:6px}
.mark{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--accent); pointer-events:none}
.mark.epoch{width:1px; top:3px; bottom:3px; background:var(--ink-3); opacity:.55}
.mark span{
  position:absolute; top:-19px; left:50%; transform:translateX(-50%); white-space:nowrap;

  border-radius:4px; padding:1px 5px;
}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--ink-2); padding-top:10px}

/* ── tables ───────────────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); padding:9px 16px; border-bottom:1px solid var(--border); white-space:nowrap}

tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{text-align:right}

.seg{border:1px solid var(--border); border-radius:8px; background:var(--surface); overflow:hidden}
.seg > .sh{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--border)}
.seg > .sb{padding:14px}
.no-total{

}
.no-total .x{
  flex:none; width:26px; height:26px; border-radius:6px; display:grid; place-items:center;
  border:1px dashed var(--border-strong); color:var(--ink-3); font-size:15px; line-height:1; background:var(--surface);
}

/* ── two-column declaration editor ────────────────────────────────────────── */
.decl{display:grid; grid-template-columns:1fr 46px 1fr; align-items:stretch}
.decl .gap{position:relative}
.decl .gap::before{content:""; position:absolute; left:50%; top:8px; bottom:8px; width:1px; background:var(--border-strong)}
.decl .gap span{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-90deg);
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  background:var(--surface); padding:3px 6px; white-space:nowrap;
}
.mlist{display:flex; flex-direction:column; gap:6px}
.mrow{display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-radius:6px; padding:8px 10px; background:var(--surface)}
.mrow .nm{font-size:13px}
.mrow .spacer{flex:1}
.mrow.sel{border-color:var(--accent); background:var(--accent-weak)}

.cbx{width:15px; height:15px; border-radius:4px; border:1.5px solid var(--border-strong); display:grid; place-items:center; flex:none}

.inp{border:1px solid var(--border); border-radius:6px; background:var(--surface); padding:8px 10px; font-size:13px; color:var(--ink)}
.inp.sm{width:74px; text-align:right}
.hint{font-size:11.5px; color:var(--ink-3)}
.err{
  border:1px solid var(--down); background:var(--down-weak); color:var(--down);
  border-radius:6px; padding:10px 12px; font-size:12.5px; display:flex; gap:9px; align-items:flex-start;
}
.err b{font-weight:600}
.btn{border:1px solid var(--border); border-radius:6px; padding:7px 12px; font-size:13px; background:var(--surface); color:var(--ink-2)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:550}

/* ── progress ─────────────────────────────────────────────────────────────── */
.bar{height:6px; border-radius:3px; background:var(--inset); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--accent)}

/* ── spec notes (review overlay, not product chrome) ──────────────────────── */
.note{
  border:1px dashed var(--note-border); border-left-width:3px; border-left-style:solid; border-left-color:var(--note);

  display:flex; gap:10px; align-items:flex-start;
}
.note .ref{
  flex:none; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; color:var(--note);
  border:1px solid var(--note-border); border-radius:4px; padding:1px 5px; background:var(--surface);
}
.note b{color:var(--ink); font-weight:600}
body.hide-notes .note{display:none}

/* ── provenance popover ───────────────────────────────────────────────────── */
.pop{
  position:absolute; z-index:30; min-width:250px; border:1px solid var(--border-strong); border-radius:8px;
  background:var(--surface); box-shadow:var(--shadow); padding:12px; font-size:12px; display:none;
}
.pop.on{display:block}
.pop dl{display:grid; grid-template-columns:1fr auto; gap:4px 12px; margin:8px 0 0}
.pop dt{color:var(--ink-3)} .pop dd{margin:0; text-align:right}

.foot{padding:22px; border-top:1px solid var(--border); color:var(--ink-3); font-size:12.5px; max-width:1180px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}

  .decl .gap::before{left:8px; right:8px; top:50%; bottom:auto; width:auto; height:1px}
  .decl .gap span{transform:translate(-50%,-50%)}
}
</style>

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Timelines use the product's uptime-signal motif: DISCRETE ticks with gaps,
   drawn exactly the way frontend/src/components/UptimeBar.vue draws them —
   one SVG under preserveAspectRatio="none" so every tick scales by the same
   factor (flexbox sub-pixel rounding is what made gaps drift there).
   Input is run-length {s, n, prov}; it is expanded onto a fixed tick grid,
   because a tick is a rollup of canonical buckets, not a bucket. */
function ticksFrom(segs, n) {
  const total = segs.reduce((a, s) => a + s.n, 0);
  const out = []; let acc = 0;
  segs.forEach((s) => {
    const cnt = Math.round(((acc + s.n) / total) * n) - Math.round((acc / total) * n);
    for (let i = 0; i < cnt; i++) out.push({ s: s.s, prov: !!s.prov });
    acc += s.n;
  });
  while (out.length < n) out.push(out[out.length - 1] || { s: "none" });
  return out.slice(0, n);
}
function strip(segs, opts = {}) {
  const n = opts.ticks || 90;
  const fill = { up: "var(--up)", down: "var(--down)", degraded: "var(--degraded)", maint: "var(--maint)", unknown: "var(--pending)", none: "var(--inset)" };
  const rects = ticksFrom(segs, n).map((k, i) => {
    /* UNKNOWN is a SHORT tick on the same baseline. At a few pixels wide a hatch
       or a second hue is unreadable, and reusing the empty "no data" fill would
       hide the one state this feature exists to make visible: a deficient tick
       reads as deficient evidence at any width and in both themes. */
    const short = k.s === "unknown";
    return `<rect class="bkt" data-i="${i}" data-s="${k.s}" x="${i + 0.13}" y="${short ? 3.4 : 0}"` +
      ` width="0.74" height="${short ? 6.6 : 10}" rx="0.2" ry="0.7" fill="${fill[k.s]}"${k.prov ? ' opacity="0.42"' : ""}/>`;
  }).join("");
  return `<div class="strip${opts.tall ? " tall" : ""}">
    <div class="bar-area">
      <svg viewBox="0 0 ${n} 10" preserveAspectRatio="none" role="img" aria-label="${esc(opts.label || "availability")}">${rects}</svg>
      ${opts.marks ? opts.marks.map((m) => `<span class="mark ${m.epoch ? "epoch" : ""}" style="left:${m.at}%">${m.label ? `<span>${esc(m.label)}</span>` : ""}</span>`).join("") : ""}
    </div>
    ${opts.axis ? `<div class="axis"><span>${esc(opts.axis[0])}</span><span>${esc(opts.axis[1])}</span></div>` : ""}
  </div>`;
}

const tick = (fill, short) =>
  `<svg width="9" height="13" viewBox="0 0 1 10" preserveAspectRatio="none" style="vertical-align:-2px; margin-right:6px">` +
  `<rect x="0.08" y="${short ? 3.4 : 0}" width="0.84" height="${short ? 6.6 : 10}" rx="0.2" ry="0.7" fill="${fill}"/></svg>`;
const legend = (extra = "") => `<div class="legend">
  <span>${tick("var(--up)")}Good</span>
  <span>${tick("var(--down)")}Bad</span>
  <span>${tick("var(--maint)")}Maintenance — excluded</span>
  <span>${tick("var(--pending)", true)}Unknown — materialized, not measured</span>
  <span>${tick("var(--inset)")}No data — not materialized</span>
  <span><span style="display:inline-block; opacity:.42">${tick("var(--up)")}</span>Provisional — unsealed, excluded from the number</span>
  ${extra}</div>`;

const note = (ref, html) => `<div class="note"><span class="ref">${esc(ref)}</span><div>${html}</div></div>`;

          <div class="mrow${m.sli ? " sel" : ""}${m.off ? " off" : ""}">
            <span class="cbx${m.sli ? " on" : ""}">${m.sli ? `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>` : ""}</span>
            <span class="nm mono">${esc(m.n)}</span>
            <span class="spacer"></span>
            ${m.sli ? `<span class="chip acc">counts</span>` : `<span class="sub" style="font-size:11.5px">diagnostic only</span>`}
          </div>`).join("")}
        </div>
        <p class="hint">Adding a monitor on the left never selects it here. Changing this list is what changes the meaning of the number.</p>
      </div>
    </div>
  </div>

  ${note("§5 · §18/24", "The vertical rule between the two columns is the load-bearing element of this screen. Without it, the ordinary action <i>“let me add a Redis check for diagnostics”</i> silently redefines what availability of checkout means — the failure this entire feature exists to prevent.")}

  <div class="grid g2">
    <div class="card">
      <header><h2>Aggregation policy</h2></header>
      <div class="pad stack" style="gap:14px">
        <div class="field">
          <span class="lbl">Mode</span>
          <div class="row">
            <span class="chip">all</span><span class="chip">any</span><span class="chip acc">quorum</span>
          </div>
        </div>
        <div class="row" style="gap:16px">
          <div class="field"><span class="lbl">healthy_min</span><input class="inp sm mono" value="3" readonly></div>
          <div class="field"><span class="lbl">degraded_min</span><input class="inp sm mono" value="1" readonly></div>
          <div class="field" style="flex:1"><span class="lbl">eligible members</span><input class="inp mono" value="2" readonly style="text-align:right"></div>
        </div>
        <div class="err">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none; margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5h.01"/></svg>
          <div><b>healthy_min 3 exceeds the 2 eligible members.</b> With this policy the service could never be Healthy.
          Lower <span class="mono">healthy_min</span> to 2, or add a reliability input.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <header><h2>Region, missing data, maintenance</h2></header>
      <div class="pad stack" style="gap:14px">
        <div class="field"><span class="lbl">Region mode</span>
          <div class="row"><span class="chip acc">per_region</span>
            <span class="sub">healthy_min_regions</span><input class="inp sm mono" value="2" readonly></div>
          <p class="hint">Members are aggregated inside each region first, then the regions are combined. A region that has never reported counts as Unknown, not as absent.</p>
        </div>
        <div class="field"><span class="lbl">Missing data</span>
          <div class="row"><span class="chip acc">unknown</span><span class="chip">bad</span><span class="chip">ignore</span></div>
          <p class="hint">Decides what an Unknown member contributes. Under <span class="mono">unknown</span> the bucket may become undecidable and leaves the window entirely — never counted as good.</p>
        </div>
        <div class="field"><span class="lbl">Maintenance</span>
          <div class="row"><span class="chip acc">exclude member</span></div>
          <p class="hint">Exclusion wins over the normalized state: a stale push member inside a maintenance window is excluded, not Bad.</p>
        </div>
      </div>
    </div>
  </div>

  ${note("§9.3 · §20", "Thresholds are validated at write time and re-validated whenever the eligible set changes, so a policy made unsatisfiable by removing a member surfaces as a definition error on the service instead of a silent permanent <b>Bad</b>.")}
  `;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Screen 5 — Revisions, epochs, provenance
   ═══════════════════════════════════════════════════════════════════════════ */
const history = [
  { kind: "rev", id: "rev 5", when: "10 Aug 2026 14:00:00Z", who: "seymur@teamlead.com",
    what: "SLI gained <span class='mono'>checkout-grpc</span>", detail: "members [checkout-http, checkout-synthetic] → [checkout-http, checkout-synthetic, checkout-grpc]" },
  { kind: "epoch", id: "epoch 41", when: "14 Aug 2026 08:31:00Z", who: "system",
    what: "<span class='mono'>checkout-grpc</span> interval 30s → 5m", detail: "snapshot_hash 9f2c…a10 · effective_at floored to the 08:31:00 bucket boundary" },
  { kind: "epoch", id: "epoch 40", when: "12 Aug 2026 19:07:00Z", who: "system",
    what: "<span class='mono'>checkout-http</span> added region <span class='mono'>geo2</span>", detail: "snapshot_hash 51ab…7c4 · created in the same transaction as the monitor write" },
  { kind: "noop", id: "—", when: "11 Aug 2026 10:22:00Z", who: "system",
    what: "<span class='mono'>checkout-db</span> renamed", detail: "execution_revision bumped, snapshot_hash unchanged → no epoch created" },
  { kind: "rev", id: "rev 4", when: "21 Jun 2026 09:15:00Z", who: "bundle · payments.yaml",
    what: "aggregation any → quorum(3, 1)", detail: "provider file · generation 12" },
];

function screenHistory() {
  return `
  <div class="head">
    <div style="flex:1; min-width:260px">
      <h1>checkout · why the number changed</h1>
      <p class="sub">Two axes on one list: what a human declared availability to <b>mean</b>, and what the system was <b>measuring</b>.</p>
    </div>
    <div class="row"><span class="chip acc mono">2 definition revisions</span><span class="chip mono">2 evaluation epochs</span></div>
  </div>

  <div class="card">
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:118px">Axis</th><th style="width:172px">Effective from</th><th>Change</th><th style="width:150px">By</th></tr></thead>
      <tbody>${history.map((h) => `
        <tr${h.kind === "noop" ? ' style="opacity:.62"' : ""}>
          <td>${h.kind === "rev"
            ? `<span class="chip acc mono">${esc(h.id)}</span>`
            : h.kind === "epoch"
              ? `<span class="chip mono">${esc(h.id)}</span>`
              : `<span class="chip" style="border-style:dashed">no-op</span>`}</td>
          <td class="mono" style="font-size:12.5px">${esc(h.when)}</td>
          <td><div>${h.what}</div><div class="sub" style="font-size:11.5px; margin-top:3px">${h.detail}</div></td>
          <td class="sub" style="font-size:12px">${esc(h.who)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  </div>

  ${note("§6.2", "A rename bumps <span class='mono'>execution_revision</span> under the existing fail-safe contract but changes no evaluation input, so the canonical snapshot hash is unchanged and <b>no epoch is created</b>. The row is shown greyed rather than hidden, so an operator comparing the audit log against the monitor history does not find a gap.")}

  <div class="card">
    <header><h2>Bucket provenance</h2><div class="spacer"></div><span class="sub">hover a bucket</span></header>
    <div class="pad">
      <div style="margin-top:4px" id="provStrip">${strip(
        [{ s: "up", n: 34 }, { s: "down", n: 4 }, { s: "up", n: 22 }, { s: "maint", n: 6 }, { s: "up", n: 18 }, { s: "unknown", n: 3 }, { s: "up", n: 25 }],
        { tall: true, ticks: 60, label: "provenance sample", axis: ["09:00:00Z · one tick = one canonical 60s bucket", "10:00:00Z"] })}
      </div>
      ${legend()}
      <p class="sub" style="margin-top:12px">Each fact carries a bounded provenance record — counts per aggregation stage, and for a Bad bucket the members that caused it.
      It is a fixed small structure, not an event log, and it survives the raw heartbeats it was derived from: at 90 days the raw data is 60 days gone.</p>
    </div>
  </div>

  ${note("§10.3", "This is what makes the explainability promise honest at the far end of a 90-day window. Anything the bounded record cannot carry was removed from the promise rather than implied.")}

  <div class="card">
    <header><h2>Audited recompute</h2><div class="spacer"></div><span class="chip mono">2026-08-14 11:02Z</span></header>
    <div class="pad stack" style="gap:12px">
      <div class="grid g3" style="gap:12px">
        <div><div class="lbl">Range</div><div class="mono" style="margin-top:4px; font-size:13px">10 Aug – 14 Aug</div></div>
        <div><div class="lbl">Before</div><div class="mono" style="margin-top:4px; font-size:18px; color:var(--ink-3)">99.41%</div></div>
        <div><div class="lbl">After</div><div class="mono" style="margin-top:4px; font-size:18px">99.97%</div></div>
      </div>
      <p class="sub">Triggered by revision 5. Sealed buckets were rewritten inside that revision's validity range only; older facts keep the epoch and revision that produced them.</p>
    </div>
  </div>

  ${note("§10.4 · §10.5", "A recompute that moves a sealed window is never blocked — a correction that large usually means the previous number was wrong — but it is never silent either. Before/after availability is part of the audit record, so <i>“why did last month change?”</i> always has an answer.")}
  `;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Shell
   ═══════════════════════════════════════════════════════════════════════════ */
const SCREENS = [
  { k: "list", t: "Services", crumb: "Services", r: screenList },
  { k: "detail", t: "Service detail", crumb: "checkout", r: screenDetail },
  { k: "honesty", t: "Coverage & segments", crumb: "checkout · 90d", r: screenHonesty },
  { k: "editor", t: "Declaration editor", crumb: "checkout · edit", r: screenEditor },
  { k: "history", t: "Revisions & provenance", crumb: "checkout · history", r: screenHistory },
];

const nav = document.getElementById("screens");
const view = document.getElementById("view");
const crumb = document.getElementById("crumb");
let active = "list";

nav.innerHTML = SCREENS.map((s, i) =>
  `<button data-k="${s.k}" class="${s.k === active ? "on" : ""}"><span class="n mono">${i + 1}</span>${esc(s.t)}</button>`).join("");

function render() {
  const s = SCREENS.find((x) => x.k === active);
  view.innerHTML = s.r();
  crumb.textContent = s.crumb;
  [...nav.children].forEach((b) => b.classList.toggle("on", b.dataset.k === active));
  window.scrollTo({ top: 0, behavior: "instant" });
  wireProvenance();
}
nav.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  active = b.dataset.k;
  render();
});

/* theme toggle — stamps data-theme so it wins over the OS in both directions */
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0b0b0f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

/* spec-notes overlay */
const notesBtn = document.getElementById("notesBtn");
notesBtn.addEventListener("click", () => {
  const off = document.body.classList.toggle("hide-notes");
  notesBtn.classList.toggle("on", !off);
  notesBtn.setAttribute("aria-pressed", String(!off));
});

/* provenance popover on the history screen */
const pop = document.getElementById("pop");
const SAMPLE = {
  down: { title: "10:14:00Z — Bad", rows: [["eligible", "5"], ["good", "2"], ["bad", "3"], ["unknown", "0"], ["excluded · disabled", "0"], ["excluded · maintenance", "1"]],
    cause: "checkout-http@geo1, checkout-http@geo2, checkout-synthetic" },
  up: { title: "09:22:00Z — Good", rows: [["eligible", "6"], ["good", "6"], ["bad", "0"], ["unknown", "0"], ["excluded · disabled", "0"], ["excluded · maintenance", "0"]], cause: null },
  maint: { title: "10:31:00Z — Excluded", rows: [["eligible", "3"], ["good", "3"], ["bad", "0"], ["unknown", "0"], ["excluded · disabled", "0"], ["excluded · maintenance", "3"]],
    cause: "window “db failover” 10:28–10:40Z" },
  unknown: { title: "10:47:00Z — Unknown", rows: [["eligible", "0"], ["good", "0"], ["bad", "0"], ["unknown", "2"], ["excluded · disabled", "1"], ["excluded · maintenance", "0"]],
    cause: "no eligible member — reported as Unknown, never as Good" },
};
function wireProvenance() {
  const host = document.getElementById("provStrip");
  if (!host) { pop.classList.remove("on"); return; }
  host.querySelectorAll(".bkt").forEach((r) => {
    const kind = SAMPLE[r.dataset.s] ? r.dataset.s : "up";
    r.style.cursor = "crosshair";
    r.addEventListener("mouseenter", (e) => {
      const d = SAMPLE[kind];
      pop.innerHTML = `<div style="font-weight:600; font-size:12.5px">${esc(d.title)}</div>
        <dl>${d.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join("")}</dl>
        ${d.cause ? `<div style="margin-top:9px; padding-top:9px; border-top:1px solid var(--border); color:var(--ink-2)">${esc(d.cause)}</div>` : ""}`;
      pop.classList.add("on");
      const b = host.getBoundingClientRect();
      pop.style.left = Math.min(e.clientX + 12, window.innerWidth - 275) + "px";
      pop.style.top = window.scrollY + b.bottom + 10 + "px";
    });
  });
  host.addEventListener("mouseleave", () => pop.classList.remove("on"));
}

render();
</script>
