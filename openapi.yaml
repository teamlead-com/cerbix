  /api/v1/monitors/{monitorID}/notifications:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    get:
      tags: [notifications]
      summary: List the channels linked to a monitor (viewer+)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [notifications]
      summary: Link a channel to a monitor (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string, format: uuid }
      responses:
        '204': { description: Linked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/notifications/{channelID}:
    parameters:
      - { $ref: '#/components/parameters/MonitorID' }
      - in: path
        name: channelID
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [notifications]
      summary: Unlink a channel from a monitor (editor+)
      responses:
        '204': { description: Unlinked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/search:
    get:
      tags: [search]
      summary: Search projects, monitors and incidents (scoped to the caller)
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
          description: Case-insensitive substring; a query under 2 chars returns no hits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  hits: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }

  /api/v1/events:
    get:
      tags: [monitors]
      summary: >
        Stream live monitor status changes as Server-Sent Events (text/event-stream),
        filtered to the projects the caller may see. Consume with EventSource; each
        `status` event's data is a JSON object {type, monitor_id, project_id, status,
        latency_ms, ts}. 501 if realtime is not enabled.
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '501': { description: Realtime events are not enabled. }

  /api/v1/settings/oidc:
    get:
      tags: [admin]
      summary: Read the instance-wide OIDC configuration (global admin only)
      description: >
        Returns the DB override (client secret redacted) if one is saved, else
        configured=false meaning the config-file bootstrap is in effect.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCSettingsView' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save the OIDC configuration and rebuild the provider (global admin only)
      description: >
        Persists the instance-wide OIDC override — which then takes precedence over
        the YAML oidc: block — and rebuilds the live provider. A blank/omitted
        client_secret preserves the stored one. If the provider can't be built (e.g.
        the IdP is unreachable) the settings are still saved and active is false;
        the background reloader keeps retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOIDCSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OIDCSettingsView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/settings/branding:
    get:
      tags: [admin]
      summary: Read branding (global admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save branding (global admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/settings/auth-policy:
    get:
      tags: [admin]
      summary: Read auth policy (global admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthPolicy' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save auth policy (global admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthPolicy' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthPolicy' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/settings/alerting:
    get:
      tags: [admin]
      summary: Read alerting controls (global admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alerting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save alerting controls (global admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Alerting' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alerting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/monitor-defaults:
    get:
      tags: [monitors]
      summary: Effective instance monitor defaults (any authenticated user)
      description: >
        The resolved defaults (DB -> config seed -> built-ins) the monitor form
        prefills from; editing them stays on the admin-only settings endpoint.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/monitor-defaults:
    get:
      tags: [admin]
      summary: Read monitor defaults (global admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save monitor defaults (global admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/settings/mail:
    get:
      tags: [admin]
      summary: Read mail/SMTP settings (global admin only, password redacted)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MailSettingsView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save mail/SMTP settings and re-point the live mailer (global admin only)
      description: 'A blank/omitted smtp_password preserves the stored one. The mailer resolves this per send, so changes apply immediately.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetMailSettings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MailSettingsView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/public/branding:
    get:
      tags: [public]
      summary: Public branding (unauthenticated) for the login page and status pages
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicBranding' } } } }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List every user of the instance (global admin only)
      description: >
        User-keyed rows with aggregated memberships across all organizations —
        including users outside any organization (empty memberships list), who
        are invisible in the org-scoped member lists.
      parameters:
        - in: query
          name: q
          required: false
          description: Case-insensitive substring filter on email or display name.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{userID}:
    patch:
      tags: [admin]
      summary: Grant or revoke the global-admin flag (global admin only)
      description: >
        Changing your own flag is rejected, and the last global admin cannot be
        demoted (400 in both cases).
      parameters:
        - { in: path, name: userID, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUser' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete a user (global admin only)
      description: >
        Memberships and sessions cascade in the database; audit entries keep a
        NULL actor. Self-deletion and deleting the last global admin are
        rejected (400).
      parameters:
        - { in: path, name: userID, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/file-providers:
    get:
      tags: [admin]
      summary: List all file-provider bundle diagnostics (global admin only)
      description: >
        Monitoring-as-Code (FR-017) provider bundle status across all tenants: relative
        source path, applied generation, status, and bounded errors (`bundles`), plus this
        process's live runtime view of every configured provider (`providers`): leadership,
        last scan/success, and counts — including configured-but-idle providers. Requires a
        global admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundles: { type: array, items: { $ref: '#/components/schemas/FileProviderDiagnostic' } }
                  providers: { type: array, items: { $ref: '#/components/schemas/FileProviderRuntimeStatus' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/organizations/{orgID}/file-providers:
    get:
      tags: [admin]
      summary: List an organization's file-provider bundle diagnostics (org admin)
      description: >
        Provider bundle status scoped to one organization (org admin). Filtered in the store,
        so no cross-tenant bundle/error/path is ever returned.
      parameters:
        - in: path
          name: orgID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundles: { type: array, items: { $ref: '#/components/schemas/FileProviderDiagnostic' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/outbox/dead:
    get:
      tags: [admin]
      summary: List dead-lettered outbox events (global admin only)
      description: >
        Outbound events (incident webhooks, monitor-transition notifications) that
        exhausted their delivery retries. System-wide; requires a global admin.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OutboxEvent' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/outbox/dead/replay-all:
    post:
      tags: [admin]
      summary: Requeue every dead outbox event (global admin only)
      responses:
        '200':
          description: Number of events requeued.
          content:
            application/json:
              schema:
                type: object
                properties: { replayed: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/outbox/dead/{eventID}/replay:
    parameters:
      - in: path
        name: eventID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Requeue one dead outbox event for delivery (global admin only)
      responses:
        '204': { description: Requeued. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cerbix_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Machine auth via Authorization: Bearer. Either a cerbix service-account token (cbx_...) or an OIDC client-credentials access token (a realm-issued JWT, when OIDC is enabled); the JWT subject is JIT-provisioned and access is membership-gated."

  parameters:
    OrgID:
      in: path
      name: orgID
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      in: path
      name: projectID
      required: true
      schema: { type: string, format: uuid }
    MembershipID:
      in: path
      name: membershipID
      required: true
      schema: { type: string, format: uuid }
    MonitorID:
      in: path
      name: monitorID
      required: true
      schema: { type: string, format: uuid }
    IncidentID:
      in: path
      name: incidentID
      required: true
      schema: { type: string, format: uuid }
    PageID:
      in: path
      name: pageID
      required: true
      schema: { type: string, format: uuid }
    FeedFormat:
      in: query
      name: format
      required: false
      schema: { type: string, enum: [rss, atom, json], default: rss }
      description: Feed serialization; defaults to RSS 2.0.
    AvailabilityDays:
      in: query
      name: days
      required: false
      schema: { type: integer, default: 90, maximum: 365 }
      description: Number of trailing days of availability to return.

  responses:
    Unauthorized:
      description: No or invalid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but insufficient role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found or not visible to the caller (existence hidden).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: Email of the local account. }
        password: { type: string, format: password }
        totp: { type: string, description: 'TOTP code or a recovery code, required when 2FA is enabled.' }
    TOTPEnrollResponse:
      type: object
      properties:
        secret: { type: string, description: Base32 TOTP secret to enter manually. }
        uri: { type: string, description: 'otpauth:// URI for authenticator apps (QR).' }
    TOTPEnableRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Current 6-digit code from the authenticator. }
    TOTPEnableResponse:
      type: object
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: Single-use recovery codes, shown only once.
    TOTPDisableRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, description: Account password, re-verified before disabling 2FA. }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        oidc_sub: { type: string }
        email: { type: string }
        display_name: { type: string }
        is_global_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserMembership:
      type: object
      properties:
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            auth_type:
              type: string
              enum: [local, oidc, both, none]
              description: How the account can sign in (password, OIDC, or both).
            last_active_at: { type: string, format: date-time, nullable: true }
            memberships:
              type: array
              description: Empty for users outside any organization.
              items: { $ref: '#/components/schemas/AdminUserMembership' }
    Subscriber:
      type: object
      properties:
        id: { type: string, format: uuid }
        status_page_id: { type: string, format: uuid }
        email: { type: string }
        confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ToggleEnabled:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    UpdateAdminUser:
      type: object
      required: [is_global_admin]
      properties:
        is_global_admin: { type: boolean }
    BuildInfo:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        go_version: { type: string }
    Me:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        totp_enabled: { type: boolean, description: Whether two-factor authentication is active for this account. }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateOrganization:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProject:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_email: { type: string }
        actor_name: { type: string }
        via_token: { type: boolean }
        action: { type: string, description: 'e.g. member.add, member.role_change, member.remove, token.create, token.delete' }
        target: { type: string }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      description: A membership enriched with the user's identity for the members UI.
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
        email: { type: string }
        display_name: { type: string }
        last_active_at: { type: string, format: date-time, nullable: true, description: 'Most recent session; absent if never signed in.' }
    AddMember:
      type: object
      required: [role]
      description: Identify the member by user_id or email (the user must have signed in at least once).
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, description: 'Alternative to user_id; resolved to an existing user.' }
        project_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
    UpdateMember:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [org_admin, project_admin, editor, viewer]
    Monitor:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [http, tcp, icmp, dns, tls, grpc, composite, postgres, mysql, redis, promql, rabbitmq, websocket, ssh, synthetic, push] }
        target: { type: string }
        method: { type: string, enum: [GET, POST, HEAD, PUT, DELETE], description: 'HTTP request method (http monitors).' }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        retries: { type: integer }
        failure_threshold: { type: integer, description: 'Consecutive failed checks before "down" (confirmations); default 1.' }
        confirm_interval_seconds: { type: integer, description: 'Accelerated probe interval while confirming a failure (first fail → verdict). 0 = off; clamped to [5, interval]; effective with failure_threshold > 1.' }
        depends_on:
          type: array
          items: { type: string, format: uuid }
          description: 'Parent monitors (same project). While any transitive parent is down, alerts for this monitor are suppressed; data keeps recording. Must stay acyclic.'
        consecutive_failures: { type: integer, readOnly: true, description: 'Live confirmation counter ("confirming N/M" when > 0 and status is up).' }
        renotify_seconds: { type: integer, description: 'Re-send the down alert every N seconds while down (0 = off).' }
        grace_seconds: { type: integer, description: 'Push monitors: extra tolerance beyond the interval before "down".' }
        conditions: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: 'Free-form labels (env:prod, team:x) for filtering.' }
        region: { type: string, description: 'Worker-pool region that probes this monitor; default core. Composite monitors must be core.' }
        config: { type: object, additionalProperties: { type: string }, description: 'Per-type config; for composite: {children:"id1,id2", mode:"all|any"}.' }
        enabled: { type: boolean }
        auto_incident: { type: boolean, description: 'When true, an incident opens automatically when this monitor goes down.' }
        escalation_policy_id: { type: string, description: 'On-call escalation policy for down alerts. Empty = flat notification to all linked channels.' }
        status: { type: string, enum: [pending, up, down] }
        push_token: { type: string, description: 'Set for push monitors; the secret in their heartbeat URL.' }
        management:
          $ref: '#/components/schemas/MonitorManagement'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MonitorManagement:
      type: object
      description: 'Read-only source provenance (FR-017). A file-managed monitor is read-only through normal CRUD (409 managed_by_file); an ordinary monitor reports source=ui.'
      properties:
        source: { type: string, enum: [ui, file] }
        provider: { type: string, description: 'File provider name (source=file).' }
        uid: { type: string, description: 'Source UID within the bundle (source=file).' }
        path: { type: string, description: 'Tenant-safe RELATIVE bundle path (never an absolute filesystem path).' }
        read_only: { type: boolean, description: 'True when declarative fields cannot be edited via CRUD.' }
    FileProviderDiagnostic:
      type: object
      description: 'One file-provider bundle status (tenant-safe; relative path only).'
      properties:
        provider: { type: string }
        organization: { type: string, description: 'Organization slug.' }
        project: { type: string, description: 'Project slug.' }
        path: { type: string, description: 'Relative source path.' }
        generation: { type: integer, format: int64 }
        status: { type: string, enum: [pending, applied, rejected, error, degraded] }
        last_error: { type: string }
        applied_at: { type: string, format: date-time }
    FileProviderRuntimeStatus:
      type: object
      description: >
        One configured file provider as seen live by THIS api process (§15). Process-local:
        leadership and scan times reflect this replica only (a follower reports leader=false).
        Configured-but-idle providers appear too (registered before their first reconcile).
      properties:
        provider: { type: string, description: 'Provider name from config.' }
        scope_type: { type: string, enum: [instance, organization, project] }
        leader: { type: boolean, description: 'Whether this process currently holds the provider leader lock.' }
        last_scan_unix: { type: integer, format: int64, description: 'Unix seconds of the last reconcile attempt (0 = never).' }
        last_success_unix: { type: integer, format: int64, description: 'Unix seconds of the last successful generation (sticky; 0 = never).' }
        last_error: { type: string, description: 'Bounded reason of the last rejection this scan.' }
        managed_monitors: { type: integer, description: 'Monitors currently managed by this provider.' }
        orphaned_monitors: { type: integer, description: 'Monitors orphaned (source removed, retained).' }
        bundle_errors: { type: integer, description: 'Bundles rejected in the last scan.' }
    CreateMonitor:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [http, tcp, icmp, dns, tls, grpc, composite, postgres, mysql, redis, promql, rabbitmq, websocket, ssh, synthetic, push] }
        target: { type: string }
        method: { type: string, enum: [GET, POST, HEAD, PUT, DELETE], description: 'HTTP request method; defaults to GET.' }
        interval_seconds: { type: integer, default: 60 }
        timeout_seconds: { type: integer, default: 10 }
        retries: { type: integer, default: 0 }
        failure_threshold: { type: integer, default: 1, description: 'Consecutive failed checks before "down".' }
        confirm_interval_seconds: { type: integer, default: 10, description: 'Faster probes while confirming a failure. 0 = off; clamped to [5, interval].' }
        depends_on:
          type: array
          items: { type: string, format: uuid }
          description: 'Parent monitors of the same project; cycles are rejected (400).'
        renotify_seconds: { type: integer, default: 0, description: 'Re-send the down alert every N seconds while down (0 = off).' }
        grace_seconds: { type: integer, default: 0, description: 'Push monitors: extra tolerance beyond the interval.' }
        conditions:
          type: array
          items: { type: string }
          example: ["[STATUS] == 200", "[RESPONSE_TIME] < 500"]
        tags: { type: array, items: { type: string }, description: 'Free-form labels (env:prod, team:x) for filtering.' }
        region: { type: string, description: 'Worker-pool region that probes this monitor; default core. Composite monitors must be core.' }
        config: { type: object, additionalProperties: { type: string }, description: 'Per-type config; for composite: {children:"id1,id2", mode:"all|any"}.' }
        enabled: { type: boolean, default: true }
        auto_incident: { type: boolean, default: true, description: 'Open an incident automatically when this monitor goes down.' }
        escalation_policy_id: { type: string, description: 'On-call escalation policy for down alerts (requires auto_incident). Empty = flat notification.' }
    UpdateMonitor:
      type: object
      description: Partial update; omitted fields are unchanged. Type is immutable.
      properties:
        name: { type: string }
        target: { type: string }
        method: { type: string, enum: [GET, POST, HEAD, PUT, DELETE] }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        retries: { type: integer }
        failure_threshold: { type: integer }
        confirm_interval_seconds: { type: integer }
        depends_on:
          type: array
          items: { type: string, format: uuid }
        renotify_seconds: { type: integer }
        grace_seconds: { type: integer }
        conditions: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: 'Free-form labels (env:prod, team:x) for filtering.' }
        region: { type: string, description: 'Worker-pool region that probes this monitor; default core. Composite monitors must be core.' }
        config: { type: object, additionalProperties: { type: string }, description: 'Per-type config; for composite: {children:"id1,id2", mode:"all|any"}.' }
        enabled: { type: boolean }
        auto_incident: { type: boolean }
        escalation_policy_id: { type: string }
    Heartbeat:
      type: object
      properties:
        monitor_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        up: { type: boolean }
        latency_ms: { type: integer, format: int64 }
        code: { type: integer }
        msg: { type: string }
    WindowSLA:
      type: object
      properties:
        window: { type: string, enum: ['24h', '7d', '30d', '90d'] }
        total: { type: integer, format: int64 }
        up: { type: integer, format: int64 }
        uptime_percent: { type: number, format: double }
        avg_latency_ms: { type: number, format: double }
        p95_latency_ms: { type: number, format: double }
        objective: { type: number, format: double, nullable: true }
        error_budget: { $ref: '#/components/schemas/ErrorBudget' }
        burn_alert: { type: boolean, description: 'Burn-rate alerting is enabled for this window.' }
        burn_firing: { type: boolean, description: 'At least one burn rule is currently firing.' }
        burn_rules:
          type: array
          items: { $ref: '#/components/schemas/BurnRule' }
    ErrorBudget:
      type: object
      properties:
        objective: { type: number, format: double }
        allowed_downtime_ratio: { type: number, format: double }
        actual_downtime_ratio: { type: number, format: double }
        remaining_ratio: { type: number, format: double }
        burned_percent: { type: number, format: double }
        met: { type: boolean }
    MonitorSLA:
      type: object
      properties:
        monitor_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, up, down] }
        windows: { type: array, items: { $ref: '#/components/schemas/WindowSLA' } }
    DailyAvailability:
      type: object
      properties:
        day: { type: string, format: date-time }
        up: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        uptime_percent: { type: number, format: double }
    ProjectSLA:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        windows: { type: array, items: { $ref: '#/components/schemas/WindowSLA' } }
        sla_report_weekly: { type: boolean, description: 'Weekly SLA report is enabled for this project.' }
    BurnRule:
      type: object
      description: >
        One multi-window burn-rate rule (Google SRE): fires when the error-budget
        burn rate is at/over threshold in BOTH windows. firing is server-owned.
      required: [long_window_seconds, short_window_seconds, threshold, severity]
      properties:
        long_window_seconds: { type: integer, description: 'Noise-filtering window, must exceed the short one (max 7d).' }
        short_window_seconds: { type: integer, minimum: 60, description: 'Confirmation window ("still burning right now").' }
        threshold: { type: number, format: double, description: 'Burn-rate multiple that trips the rule (e.g. 14.4).' }
        severity: { type: string, enum: [page, ticket] }
        firing: { type: boolean, readOnly: true, description: 'Edge latch; ignored on input.' }
    SLATarget:
      type: object
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        objective: { type: number, format: double }
        window: { type: string }
        burn_alert_enabled: { type: boolean }
        burn_rules:
          type: array
          items: { $ref: '#/components/schemas/BurnRule' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SetSLATarget:
      type: object
      required: [objective]
      properties:
        objective: { type: number, format: double, description: 'Target uptime percent, (0,100].' }
        window: { type: string, enum: ['24h', '7d', '30d', '90d'], default: '30d' }
        burn_alert: { type: boolean, description: 'Enable burn-rate alerting for this objective.' }
        burn_rules:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/BurnRule' }
          description: 'Replace the rule set. Omit to keep existing rules (enabling with none seeds the SRE default pair: page 14.4x over 1h∧5m, ticket 6x over 6h∧30m).'
    MaintenanceWindow:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    CreateMaintenance:
      type: object
      required: [starts_at, ends_at]
      properties:
        monitor_id: { type: string, format: uuid, description: 'Omit for a project-wide window.' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid, description: 'Set for auto-incidents opened from a monitor going down.' }
        external_key: { type: string, description: 'Correlation key for externally-sourced incidents (e.g. an Alertmanager fingerprint).' }
        title: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        source: { type: string, enum: [manual, api, auto] }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true, description: 'Set when acknowledged; stops on-call escalation.' }
        acknowledged_by: { type: string }
        acknowledged_by_name: { type: string, description: 'Resolved actor (detail endpoint only).' }
        escalation_step: { type: integer, description: 'How many escalation steps have fired (0 = none yet).' }
        last_escalated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EscalationTarget:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [channel, schedule] }
        id: { type: string, description: 'notification_channel id or oncall_schedule id' }
    EscalationStep:
      type: object
      required: [after_seconds, targets]
      properties:
        after_seconds: { type: integer, description: 'Offset from incident start at which this step fires (non-decreasing across steps).' }
        targets: { type: array, items: { $ref: '#/components/schemas/EscalationTarget' } }
    EscalationPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        repeat_last: { type: boolean, description: 'Repeat the last step on the monitor renotify cadence until acknowledged.' }
        steps: { type: array, items: { $ref: '#/components/schemas/EscalationStep' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateEscalationPolicy:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        repeat_last: { type: boolean }
        steps: { type: array, items: { $ref: '#/components/schemas/EscalationStep' } }
    OnCallSchedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        shift_seconds: { type: integer, description: 'Rotation period; e.g. 604800 for weekly.' }
        anchor_at: { type: string, format: date-time, description: 'Rotation epoch (slot 0 starts here).' }
        participants: { type: array, items: { type: string }, description: 'Ordered notification_channel ids in the rotation.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateOnCallSchedule:
      type: object
      required: [name, shift_seconds, anchor_at, participants]
      properties:
        name: { type: string }
        shift_seconds: { type: integer }
        anchor_at: { type: string, format: date-time }
        participants: { type: array, items: { type: string } }
    OnCallOverride:
      type: object
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreateOnCallOverride:
      type: object
      required: [channel_id, starts_at, ends_at]
      properties:
        channel_id: { type: string, description: 'notification_channel id that covers during the window' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        enabled: { type: boolean }
        text: { type: string }
        level: { type: string, enum: [info, warning, critical] }
    Branding:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        product_name: { type: string }
        accent_color: { type: string, description: '6-digit hex like #3b5bdb' }
        logo_url: { type: string }
        footer_text: { type: string }
        support_url: { type: string }
        announcement: { $ref: '#/components/schemas/Announcement' }
    PublicBranding:
      type: object
      properties:
        product_name: { type: string }
        accent_color: { type: string }
        logo_url: { type: string }
        footer_text: { type: string }
        support_url: { type: string }
        announcement: { $ref: '#/components/schemas/Announcement' }
    AuthPolicy:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        min_password_len: { type: integer }
        session_ttl_seconds: { type: integer }
        require_totp: { type: string, enum: [none, admins, all] }
        allowed_email_domains: { type: array, items: { type: string } }
    GlobalSilence:
      type: object
      properties:
        enabled: { type: boolean }
        until: { type: string, format: date-time, nullable: true }
    Alerting:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        global_silence: { $ref: '#/components/schemas/GlobalSilence' }
    MonitorDefaults:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        retries: { type: integer }
        failure_threshold: { type: integer }
        renotify_seconds: { type: integer }
        auto_incident: { type: boolean }
    MailSettingsView:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        enabled: { type: boolean }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password_set: { type: boolean }
        from: { type: string }
        public_base_url: { type: string }
        deliverable: { type: boolean, readOnly: true }
    SetMailSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password: { type: string, nullable: true, description: 'Omit or send empty to keep the stored password.' }
        from: { type: string }
        public_base_url: { type: string }
    OIDCSettingsView:
      type: object
      description: Redacted read model for the OIDC settings API. The client secret is never returned, only whether one is stored.
      properties:
        configured: { type: boolean, description: 'A DB override row exists (the config file is no longer in effect).' }
        active: { type: boolean, description: 'The provider is currently built and serving logins.' }
        enabled: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        client_secret_set: { type: boolean }
        redirect_url: { type: string }
        scopes: { type: array, items: { type: string } }
        post_logout_url: { type: string }
        button_label: { type: string }
        bootstrap_admins: { type: array, items: { type: string } }
        reload_error: { type: string, description: 'Set when a save could not build the provider (e.g. IdP unreachable).' }
    SetOIDCSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        issuer: { type: string, description: 'Required when enabled.' }
        client_id: { type: string, description: 'Required when enabled.' }
        client_secret: { type: string, nullable: true, description: 'Omit or send empty to keep the stored secret.' }
        redirect_url: { type: string, description: 'Required when enabled.' }
        scopes: { type: array, items: { type: string } }
        post_logout_url: { type: string }
        button_label: { type: string }
        bootstrap_admins: { type: array, items: { type: string } }
    AlertmanagerPayload:
      type: object
      description: Subset of the Prometheus Alertmanager webhook payload (schema v4) consumed by the receiver.
      properties:
        alerts:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [firing, resolved] }
              fingerprint: { type: string, description: 'Stable per-alert identity used to correlate firing/resolved.' }
              labels: { type: object, additionalProperties: { type: string } }
              annotations: { type: object, additionalProperties: { type: string } }
    IncidentStatus:
      type: string
      enum: [investigating, identified, monitoring, resolved]
    IncidentImpact:
      type: string
      enum: [none, minor, major, critical]
    CreateIncident:
      type: object
      required: [title]
      properties:
        title: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        body: { type: string, description: 'Opening timeline message (markdown).' }
        monitor_id: { type: string, format: uuid, description: 'Optional affected monitor; must belong to this project.' }
    IncidentUpdate:
      type: object
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
    AddIncidentUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/IncidentStatus', description: 'Omit to keep the current status (a plain comment).' }
        body: { type: string, description: 'Markdown.' }
    Postmortem:
      type: object
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IncidentDetail:
      description: A resolved incident with its timeline and (optional) postmortem, for the status page's past-incidents accordion.
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          properties:
            updates: { type: array, items: { $ref: '#/components/schemas/IncidentUpdate' } }
            postmortem: { $ref: '#/components/schemas/Postmortem' }
    Subscribe:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PutPostmortem:
      type: object
      required: [body]
      properties:
        body: { type: string, description: 'Markdown analysis.' }
    Visibility:
      type: string
      enum: [public, internal, unlisted]
    ComponentStatus:
      type: string
      enum: [operational, degraded, partial_outage, major_outage, maintenance]
    StatusPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        unlisted_token: { type: string, description: 'Present only for unlisted pages.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateStatusPage:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string }
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        project_id: { type: string, format: uuid, description: 'Omit for an org-level page.' }
    UpdateStatusPage:
      type: object
      description: 'Partial update; slug and org are immutable. Switching to unlisted mints a token, switching away clears it.'
      properties:
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        status_page_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        group: { type: string }
        position: { type: integer }
        monitor_id: { type: string, format: uuid, description: 'Set to derive status from a monitor.' }
        manual_status: { $ref: '#/components/schemas/ComponentStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateComponent:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        group: { type: string }
        position: { type: integer }
        monitor_id: { type: string, format: uuid }
        manual_status: { $ref: '#/components/schemas/ComponentStatus' }
    ComponentDay:
      type: object
      description: One day of a component's 90-day availability strip.
      properties:
        day: { type: string, description: 'YYYY-MM-DD (UTC)' }
        uptime_percent: { type: number, format: double }
        total: { type: integer, format: int64 }
    ComponentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        group: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        uptime_90d: { type: number, format: double, nullable: true }
        daily: { type: array, items: { $ref: '#/components/schemas/ComponentDay' }, description: 'Per-day availability; empty for manual components.' }
    StatusPageRender:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        summary: { $ref: '#/components/schemas/ComponentStatus' }
        components: { type: array, items: { $ref: '#/components/schemas/ComponentView' } }
        active_incidents: { type: array, items: { $ref: '#/components/schemas/IncidentDetail' } }
        recent_incidents: { type: array, items: { $ref: '#/components/schemas/IncidentDetail' }, description: 'Resolved in the last 90 days, newest first; each carries its timeline and postmortem (if published).' }
        maintenance: { type: array, items: { $ref: '#/components/schemas/MaintenanceWindow' }, description: 'Active or scheduled maintenance.' }
        updated_at: { type: string, format: date-time }
    AgentToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    ApiToken:
      type: object
      description: Service-account token metadata (never includes the secret).
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, description: 'Set for a project-scoped token.' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_by: { type: string }
        created_by_email: { type: string, description: 'Resolved issuer (list endpoint only).' }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreateApiToken:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        project_id: { type: string, format: uuid, description: 'Omit for an org-scoped token.' }
    CreatedApiToken:
      type: object
      description: Issue response — the plaintext secret is present only here.
      properties:
        token: { type: string, description: 'The bearer secret. Shown once; store it now.' }
        api_token: { $ref: '#/components/schemas/ApiToken' }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, description: 'Set for a project-scoped webhook.' }
        url: { type: string }
        secret: { type: string, description: 'Present only in the create response.' }
        enabled: { type: boolean }
        created_by: { type: string }
        created_by_email: { type: string, description: 'Resolved issuer (list endpoint only).' }
        created_at: { type: string, format: date-time }
    CreateWebhook:
      type: object
      required: [url]
      properties:
        url: { type: string, description: 'http(s) endpoint to POST events to.' }
        secret: { type: string, description: 'HMAC signing secret; generated if omitted.' }
        project_id: { type: string, format: uuid, description: 'Omit for an org-wide webhook.' }
        enabled: { type: boolean, default: true }
    NotificationChannel:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { type: string, enum: [webhook, slack, telegram, email] }
        name: { type: string }
        config: { type: object, additionalProperties: { type: string }, description: 'Type-specific: url, or bot_token + chat_id.' }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateNotificationChannel:
      type: object
      required: [type, name, config]
      properties:
        type: { type: string, enum: [webhook, slack, telegram, email] }
        name: { type: string }
        config: { type: object, additionalProperties: { type: string } }
        enabled: { type: boolean, default: true }
    OutboxEvent:
      type: object
      description: A durably-queued outbound event (dead-letter view).
      properties:
        id: { type: string, format: uuid }
        topic: { type: string, enum: [incident_event, monitor_transition] }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        last_error: { type: string }
        payload: { type: object, description: 'Raw event payload (topic-specific).' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SearchHit:
      type: object
      description: One search result, scoped to what the caller may see.
      properties:
        type: { type: string, enum: [monitor, project, incident] }
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        label: { type: string }
        sub: { type: string }
