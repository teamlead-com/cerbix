  /api/v1/public/push/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
      - in: query
        name: status
        required: false
        schema: { type: string, enum: [up, down], default: up }
      - in: query
        name: msg
        required: false
        schema: { type: string }
    post:
      tags: [monitors]
      security: []
      summary: >
        Push heartbeat for a dead-man's-switch monitor (unauthenticated). The
        watched service POSTs here every interval; silence past the interval marks
