        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/components/{componentID}/conversion/preview:
    parameters:
      - in: path
        name: componentID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [status-pages]
      summary: Preview a component source conversion (org admin)
      description: >-
        Renders the page twice — as it is and as it would be — and returns the two CAS tokens the
        confirmation must carry. Writes nothing, takes no locks, and expires nothing: an abandoned
        preview leaves no state behind.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionTarget' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/components/{componentID}/conversion:
    parameters:
      - in: path
        name: componentID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [status-pages]
      summary: Confirm a previewed conversion (org admin)
      description: >-
        Applies the conversion under BOTH CAS tokens. `page_generation` is bumped by ANY component
        mutation on the page, neighbours included, because the preview showed the page SUMMARY. A
        mismatch is 409 `page_configuration_stale` — first committer wins, re-preview and retry.
        Confirming without the tokens is a 400: the fence is not optional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionTarget' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/monitors/{monitorID}/successor:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    put:
      tags: [monitors]
      summary: Record or clear the service that supersedes this composite (project write)
      description: >-
        An ANNOTATION (FR-021 §15.5). The monitor keeps probing, keeps alerting, keeps its history
        and its status-page component; nothing a customer sees changes, and no execution state moves
        — not the config generation, not the freshness watermark, not the transition sequence. ONE
        stored fact, rendered from both ends, so there is no pair of links to fall out of sync. Send
        an empty `service_id` to clear it. COMPOSITE monitors only. A FILE-MANAGED composite MAY be
        annotated, unlike retire/reactivate below: `superseded_by_service_id` is not a declared
        field, so no reapply can restate it, and refusing would remove the only way to annotate a
        file-managed composite while protecting nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id: { type: string, format: uuid, description: 'Empty clears the annotation.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/retire:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    post:
      tags: [monitors]
      summary: Retire a monitor (project write)
      description: >-
        ONE transaction setting BOTH `retired_at` (the lifecycle statement) and `enabled = false`
        (the execution semantics), together with the config fence, the state-sequence advance that
        makes queued transition deliveries stale, and the evaluation-epoch fan-out for every
        service that names it. `retired_at` alone would leave a "retired" monitor probing and
        paging. NOTHING is deleted: heartbeats, incidents and past numbers stay. Refused for a
        file-managed monitor, whose lifecycle belongs to its provider.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/monitors/{monitorID}/reactivate:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    post:
      tags: [monitors]
      summary: Reactivate a retired monitor (project write)
      description: >-
        The explicit inverse, so a mistaken retire is recoverable. The monitor starts `pending`: an
        observation from before the retirement is not evidence about the target now, and
        fabricating a freshness watermark is what would produce a false dead-man DOWN.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/monitors/{monitorID}/convert-to-service:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    post:
      tags: [monitors]
      summary: Build a Service from a composite monitor (project write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sli]
              description: >-
                `sli` is the operator's EXPLICIT selection of which live children become the
                service's reliability inputs. §15.5 requires the confirmation and forbids a silent
                "all children"; omitting it is a 400 naming how many children are available. Every
                live child becomes the operational CONTEXT regardless, so keeping a diagnostic
                visible never changes the number.
              properties:
                sli:
                  type: array
                  items: { type: string, format: uuid }
      description: >-
        One serialized transaction: the composite is taken FOR UPDATE, then the service, its
        declaration and the link are written atomically, so two simultaneous confirms cannot create
        two services. The composite's children become BOTH the operational context and the SLI, and
        its aggregation mode becomes the service's policy — `quorum` translated as
        `degraded_min = n - M + 1` with `healthy_min` equal to it, the EXACT binary mapping, because
        a composite has two states and adding a degraded band would report more than it did on a
        customer-facing page. A quorum composite whose children span regions is REFUSED with 400,
        because a flat M-of-N is not expressible as per-region quorum plus a region rollup and
        approximating it would silently redefine availability. A composite whose declared children
        are not all live is refused too: converting on the survivors moves the aggregation's meaning
        without anybody stating it. These endpoints apply to COMPOSITE monitors only. A slug collision is a 409 naming the existing slug,
        never a suffixed twin. Re-confirming returns 200 with the existing service. The composite
        keeps running: retiring is a separate act.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompositeConversion' }
        '200':
          description: Already converted — the existing service, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompositeConversion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/public/status-pages/{slug}:
    parameters:
      - in: path
