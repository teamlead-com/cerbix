        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Email subscriptions are not enabled. }

  /api/v1/public/subscriptions/{token}/confirm:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    post:
      tags: [status-pages]
      security: []
      summary: Confirm an email subscription (double opt-in)
      responses:
        '200': { description: Confirmed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/subscriptions/{token}:
    parameters:
      - in: path
        name: token
