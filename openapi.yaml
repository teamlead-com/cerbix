openapi: 3.0.3
info:
  title: cerbix API
  version: 0.23.0
  description: >
    Internal uptime & SLA monitoring API. Authentication is via a server-side
    session cookie established by an OIDC provider (`/auth/login` → `/auth/callback`)
    or local login (`/auth/local/login`). All `/api/v1/*` endpoints require a
    valid session and enforce tenant isolation: callers only see and mutate the
    organizations/projects they are authorized for (non-members receive 404;
    insufficient in-org role receives 403).

servers:
  - url: /
    description: Same-origin (SPA is served by the API binary)

tags:
  - name: auth
  - name: me
  - name: organizations
  - name: projects
  - name: monitors
  - name: secrets
  - name: services
  - name: gate
  - name: changes
  - name: sla
  - name: incidents
  - name: status-pages
  - name: tokens
  - name: webhooks
  - name: notifications
  - name: search
  - name: admin

# Endpoints accept either an interactive session cookie or a service-account
# bearer token; authorization is role-driven regardless of which was presented.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/local/login:
    post:
      tags: [auth]
      summary: Local username/password login (issues a session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated; sets the session cookie.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/local/reset/request:
    post:
      tags: [auth]
      summary: Request a password-reset link (local accounts)
      security: []
      description: >
        Emails a one-time reset link if the address belongs to a local account.
        Always returns 200 with a generic body so it cannot enumerate accounts.
        Requires outbound email (mail) to be configured; see /auth/config
        password_reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted (whether or not the address exists).
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '429': { description: Too many requests. }

  /auth/local/reset/confirm:
    post:
      tags: [auth]
      summary: Complete a password reset with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, description: The token from the reset link. }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/config:
    get:
      tags: [auth]
      summary: Which sign-in methods this instance offers (for the login page)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  local: { type: boolean, description: Local username/password login is enabled. }
                  oidc: { type: boolean, description: OIDC login is enabled. }
                  oidc_button_label: { type: string, description: Text for the OIDC sign-in button. }
                  password_reset: { type: boolean, description: Self-service password reset is available (local login + mail configured). }

  /auth/login:
    get:
      tags: [auth]
      summary: Begin OIDC login (redirects to the configured identity provider)
      security: []
      parameters:
        - in: query
          name: redirect
          schema: { type: string }
          description: Local path to return to after login.
      responses:
        '302': { description: Redirect to the identity provider. }

  /auth/callback:
    get:
      tags: [auth]
      summary: OIDC redirect URI (exchanges code, sets the session cookie)
      security: []
      responses:
        '302': { description: Redirect to the post-login path. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session and clear the cookie
      responses:
        '302': { description: Redirect to the post-logout path. }

  /api/v1/me:
    get:
      tags: [me]
      summary: Current user and memberships
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/version:
    get:
      tags: [me]
      summary: Running build info (version, commit)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/password:
    post:
      tags: [me]
      summary: Change the current local user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/me/totp/enroll:
    post:
      tags: [me]
      summary: Begin two-factor (TOTP) enrollment
      description: >
        Generates a pending TOTP secret for the current local user (2FA not yet
        active) and returns it plus an otpauth:// URI for an authenticator app.
        Confirm with POST /api/v1/me/totp/enable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPEnrollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me/totp/enable:
    post:
      tags: [me]
      summary: Confirm and enable two-factor authentication
      description: >
        Verifies a code against the pending secret, enables 2FA, and returns
        single-use recovery codes (shown once).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPEnableRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPEnableResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/me/totp/disable:
    post:
      tags: [me]
      summary: Disable two-factor authentication
      description: Turns off 2FA after re-verifying the account password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPDisableRequest' }
      responses:
        '204': { description: Two-factor disabled. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/organizations:
    get:
      tags: [organizations]
      summary: List organizations visible to the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
    post:
      tags: [organizations]
      summary: Create an organization (global admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgID}:
    parameters: [ { $ref: '#/components/parameters/OrgID' } ]
    get:
      tags: [organizations]
      summary: Get an organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [organizations]
      summary: Delete an organization (global admin)
      description: >
        Permanently deletes the organization and everything it owns — all projects and
        their subtrees (monitors & history, incidents, SLA, escalation/on-call, channels),
        memberships, org-level status pages, and org-scoped tokens/webhooks. Irreversible.
        Global admin only; refused for organizations that own file-provider-managed projects.
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The organization owns file-provider-managed projects — remove their files instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/organizations/{orgID}/projects:
    parameters: [ { $ref: '#/components/parameters/OrgID' } ]
    get:
      tags: [projects]
      summary: List projects of an organization visible to the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [projects]
      summary: Create a project (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgID}/members:
    parameters: [ { $ref: '#/components/parameters/OrgID' } ]
    get:
      tags: [organizations]
      summary: List org members with identity (org admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [organizations]
      summary: Add a membership (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMember' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgID}/audit:
    parameters:
      - { $ref: '#/components/parameters/OrgID' }
      - in: query
        name: limit
        required: false
        schema: { type: integer, default: 100 }
    get:
      tags: [organizations]
      summary: Recent audit entries (org admin) — member and token changes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgID}/members/{membershipID}:
    parameters:
      - { $ref: '#/components/parameters/OrgID' }
      - { $ref: '#/components/parameters/MembershipID' }
    patch:
      tags: [organizations]
      summary: Change a member's role (org admin)
      description: The last org-level admin cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMember' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [organizations]
      summary: Remove a member (org admin)
      description: The last org-level admin cannot be removed.
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [projects]
      summary: Get a project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      summary: Delete a project (org admin)
      description: >
        Permanently deletes the project and everything it owns — monitors and their
        history, incidents, SLA, escalation/on-call, notification channels, and
        project-scoped tokens/webhooks/status pages. Irreversible. Requires org-manage on
        the owning organization; refused for projects owned by a file provider.
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The project is managed by a file provider — remove its files instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/regions:
    get:
      tags: [monitors]
      summary: List worker-pool regions for the monitor region picker
      description: >
        Worker-pool regions in use (assigned to monitors, always incl. core) unioned
        with regions that have a live worker (an active consumer on checks.jobs.*, via
        the RabbitMQ management API), each flagged with its live status. Any
        authenticated caller may read it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        live: { type: boolean, description: 'A worker for this region is currently connected.' }

  /api/v1/projects/{projectID}/monitors:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [monitors]
      summary: List a project's monitors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Monitor' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [monitors]
      summary: Create a monitor (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitor' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/monitors/test:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    post:
      tags: [monitors]
      summary: Test a monitor spec with a one-off probe before saving (editor+)
      description: >
        Runs a single probe against the given spec and returns the result. The probe
        is dispatched to a worker in the spec's `region`, so a geo target is tested
        from its own region rather than from core. Push and composite monitors are not
        testable (400). If no worker in the target region answers, returns 502 — the
        result is unknown (start a worker with `--region <name>`), not a target outage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  up: { type: boolean }
                  latency_ms: { type: integer, format: int64 }
                  code: { type: integer }
                  msg: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: No worker in the target region answered the test probe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/secrets:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [secrets]
      summary: List the project's secret inventory (names and metadata; never values)
      description: >
        Names, dates, and used-by reference counts only — secret values are
        write-only and never returned by any endpoint. Served with
        `Cache-Control: no-store`. Returns 404 `feature_disabled` when the
        instance-wide secret inventory feature is off (`secrets.enabled: false`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectSecret' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [secrets]
      summary: Create a project secret (editor+)
      description: >
        Adds a named secret to the project inventory. The value is encrypted at
        rest and never echoed back. Returns 404 `feature_disabled` when the
        feature is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSecretRequest' }
      responses:
        '201':
          description: Created (the value is not echoed).
          content:
            application/json:
              schema:
                type: object
                required: [id, name, created_at]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate name (`secret_exists`) or per-project quota exceeded (`secret_quota`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/SecretName' }
    patch:
      tags: [secrets]
      summary: Rename and/or rotate a project secret (editor+)
      description: >
        One PATCH = rename and/or rotate, in one transaction; at least one of
        `name`/`value` is required. A rename re-points UI-managed monitor
        references atomically; file-managed references block it
        (`409 secret_renamed_in_use` with the count — rename in the file source).
        Returns 404 `feature_disabled` when the feature is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSecretRequest' }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Rename blocked by file-managed references (`secret_renamed_in_use`,
            with `count`) or the new name is taken (`secret_exists`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  count: { type: integer, description: 'File-managed references blocking the rename (secret_renamed_in_use only).' }
    delete:
      tags: [secrets]
      summary: Delete a project secret (editor+)
      description: >
        Refused while monitor settings still reference the secret — there is no
        force-delete. Returns 404 `feature_disabled` when the feature is off.
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Still referenced by monitor settings (`secret_in_use`, with `count`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  count: { type: integer, description: References that still point at the secret. }

  /api/v1/projects/{projectID}/services:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [services]
      summary: List the project's services
      description: >
        A Service is where it is explicitly declared what reliability MEANS for one
        operational unit. Services sit BESIDE monitors, not above them: a monitor may
        contribute to several services or to none.


        Each row carries `sealed_through` and BOTH member counts. The list is where an
        operator picks which service to open, and one that omitted the watermark would let a
        service that stopped materializing an hour ago look exactly like a healthy one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ServiceSummary' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [services]
      summary: Create a service (editor+)
      description: >
        Creates the resource with NO declaration. That is a complete state, not a
        half-finished one: a service with no reliability inputs reports availability as
        unavailable rather than as 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The slug is already in use in this project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [services]
      summary: One service with its declaration, evaluation epoch and materialization state
      description: >
        Two axes, deliberately separate: `declaration` is what a human declared availability
        to MEAN, `epoch` is what the system was MEASURING. A fact references the epoch alone.


        `materialization.sealed_through` is defined by CONTIGUITY, so a gap holds it back
        rather than being jumped over — a lagging timestamp is the honest answer, and any
        range listed under `repairing` must be rendered as work in progress, never as data.


        `reliability` is always `null` HERE by design: the detail never embeds a number a
        UI could misread as fresh. SLO, error budget, burn rate, the live signal and the
        timeline live on their own endpoints —
        `…/services/{serviceID}/reliability`, `…/health` and `…/reliability/series` — each
        with the honesty statuses of spec 11.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [services]
      summary: Delete a service and everything derived from it (editor+)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The service is owned by a file provider (`managed_by_file`) — ownership persists
            while orphaned, so absence from a bundle is not a release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/declaration:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    put:
      tags: [services]
      summary: Declare what availability means for this service (editor+)
      description: >
        Writes a new definition revision AND the evaluation epoch that makes it evaluable, in
        one transaction — a revision with no epoch would be a reference no fact could point
        at. The write is prospective: `effective_at` is the next bucket boundary, so history
        already sealed under the previous revision is never restated.


        `expected_revision` is required (0 means "no declaration yet"). A mismatch is a 409,
        never a merge: two operators editing an SLI have made two different statements about
        what availability means.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutDeclarationRequest' }
      responses:
        '200':
          description: The new revision and its epoch.
          content:
            application/json:
              schema:
                type: object
                required: [declaration, epoch]
                additionalProperties: false
                properties:
                  declaration: { $ref: '#/components/schemas/ServiceDeclaration' }
                  epoch: { $ref: '#/components/schemas/EvaluationEpoch' }
        '400':
          description: >
            `sli_not_in_monitors` (an SLI member outside the evaluation context would be a
            number with no visible source), `retroactive_not_first_revision`, or a malformed
            body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `revision_conflict` (stale `expected_revision`) or `managed_by_file` (the file
            source, not the UI, is where this service's meaning is edited).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/dependencies:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [services]
      summary: The service's impact-graph edges (phase 3)
      description: >
        Both directions with the two-layer neighbour health (evaluated for the whole
        neighbour set in one snapshot) and `graph_generation` — the edge set's own
        concurrency token. Edges live OUTSIDE the declaration axes: reading or writing them
        never touches definition revisions, epochs or sealed facts (spec 14.1-14.2). The
        token and the sets come from one SQL snapshot, so the token always names the
        returned set.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceGraph' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services]
      summary: Replace the service's upstream dependencies (editor+)
      description: >
        A replace-set under the per-project graph lock. `graph_generation` is required and
        CAS-checked — a stale token is 409 `graph_generation_stale` and first-committer-wins.
        The graph stays a same-project DAG: a cycle, a foreign service, a chain beyond 10
        edges or more than 20 direct dependencies are 400s. Every non-no-op delta writes a
        typed-actor audit row in the same transaction; an identical set changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutServiceDependenciesRequest' }
      responses:
        '200':
          description: The new edge set under its new token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceGraph' }
        '400':
          description: >
            `dependency_cycle`, `dependency_not_in_project`, `dependency_depth` (chains are
            capped at 10 edges), `too_many_dependencies` (at most 20 direct), a missing
            `depends_on` (send `[]` to clear the set — omission is never a silent delete) or
            `graph_generation`, or a malformed UUID in the path or the array.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `graph_generation_stale` (the set changed concurrently — reload and retry) or
            `managed_by_file` (a file provider owns this service; its bundle, not the UI, is
            where its edges are declared).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/reliability:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [services]
      summary: The reliability report for one standard window (phase 2)
      description: >
        Computed from SEALED facts only, over `[sealed_through - window, sealed_through)` —
        the window never ends at now (spec 11.3), and the whole report is one database
        snapshot with the DB clock as `as_of`.


        Numbers that cannot be honestly stated are ABSENT with a status and a reason — never
        100% and never 0x: storage continuity and decidable coverage are judged independently
        and BOTH govern every quoted aggregate, budget and burn rate; a window spanning
        definition revisions returns segments with `aggregate_withheld` and no aggregate at
        all; the objective is a stated current-view parameter. Segments split the retroactive
        backfill part and label it `declared_reconstruction`; `repairing` intervals are work
        in progress, never data.
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [24h, 7d, 30d, 90d], default: 30d }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceWindowReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/services/{serviceID}/health:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [services]
      summary: The categorical live signal (explicitly unstable)
      description: >
        A DIFFERENT NAMED THING than the report (spec 11.3, D-0164): the declared SLI
        semantics evaluated at the DB `as_of` instant, right-continuous, through the same
        member/aggregation rules as the facts — never a percentage, never derived from stored
        facts, always `unstable: true`. The `diagnostics` layer answers for monitors[]; a
        failing diagnostic never touches the customer-facing `sli` layer.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceHealthNow' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/services/{serviceID}/reliability/series:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [services]
      summary: Hour/day rollups for the timeline (epoch-keyed, exact sums)
      description: >
        On-read rollups (spec 10.2/12.1): exact integer duration sums keyed by epoch, NEVER
        merged across an epoch boundary — one step spanning a boundary yields one point per
        epoch — and provisional time rolls up separately so the timeline can render it at
        reduced opacity without mixing it into a sealed number. The range is capped at the
        longest supported window (90d).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: true
          schema: { type: string, enum: [hour, day] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSeriesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/services/{serviceID}/sla-target:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    put:
      tags: [services]
      summary: Set the service-scoped objective for one standard window (editor+)
      description: >
        The body is `{window, objective}` and NOTHING else, and it stays that way now that
        phase 5 has landed. Service burn alerting IS expressible — on its own route,
        `…/sla-target/burn-alerting` — because the objective and the burn declaration are two
        store transactions with two audit actions and two families of lifecycle close;
        accepting both here would make one request no layer can commit atomically. A burn
        field in THIS body is still a 400, now meaning "wrong endpoint".


        Reporting always states which objective produced a budget, and a change is annotated
        via its timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetServiceSLATargetRequest' }
      responses:
        '200':
          description: The stored target.
          content:
            application/json:
              schema:
                type: object
                required: [window, objective]
                additionalProperties: false
                properties:
                  window: { type: string }
                  objective: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/services/{serviceID}/alerting:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [services]
      summary: The service's paging declaration
      description: >
        WHO gets paged for a live state, and nothing server-owned: no
        `alert_config_generation`, no latch, no lease, no episode. Ownership is DECLARED and
        defaults to off, so a service that has never been touched reads as
        `{owns_paging: false, page_on: [down], page_on_unknown: false, confirm_evaluations: 2}`
        — the quiet, non-surprising value in every field.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAlerting' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [services]
      summary: Change the service's paging declaration (editor+)
      description: >
        PATCH semantics, strictly: an OMITTED field is unchanged. Every field is therefore
        optional and `false` is a real edit — a body that never mentions `owns_paging` must
        not disown the service, which would close every announcement it has open on both
        signals with `ownership_disabled`.


        `page_on: []` is LEGAL and means "page for no state" (it dis-arms live coverage). It
        is not the same statement as omitting the field.


        Server-owned fields are REFUSED, not ignored: `alert_config_generation` and every
        latch, lease and episode column are absent from this schema and rejected by the
        decoder, so a bundle whose hash moved because an alert fired cannot exist.


        The response is the CANONICAL stored declaration — `page_on` sorted and deduplicated
        — not the request as sent. None of these fields bumps a definition revision or an
        evaluation epoch; all of them bump `alert_config_generation`, which dis-arms
        delegation until the new generation has been evaluated (the safe direction: dis-armed
        means members page for themselves).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchServiceAlertingRequest' }
      responses:
        '200':
          description: The canonical stored declaration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAlerting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The service is owned by a file provider (`managed_by_file`). These fields are part
            of the desired state, so the bundle owns them and the UI renders them read-only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/alerting/state:
    parameters:
      - { name: projectID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: serviceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [services]
      summary: What the paging declaration is producing right now, per signal
      description: >
        A route of its own, and small on purpose: a badge that renders arming must be able to
        re-ask cheaply and often. Rendering coverage once at page load and leaving it there is
        the failure FR-021 §16 spends a section on — a badge saying ARMED while delivery has
        already dis-armed, which an operator reads as "my monitors are covered" while every one
        of them is paging for itself.
      responses:
        '200':
          description: Both signals' coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAlertingState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/services/{serviceID}/escalation-policy:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    put:
      tags: [services]
      summary: Attach or clear the escalation policy a service escalates its own incident with (editor+)
      description: >
        FR-023. A service with a policy escalates its OWN auto-opened incident: the policy's steps
        fire from the incident's start, progress latches on the incident, and acknowledgement or
        resolution ends it.


        An EMPTY string clears the policy — the body states the whole value, which is why this is a
        PUT and why the field is a plain string rather than a pointer. Re-sending the value already
        stored is not a write: it produces a 200, no `updated_at` bump and NO audit line, because a
        trail that records a change nobody made is worse than one line short.


        Its own route rather than a field on the paging declaration, for the same reason
        `…/sla-target/burn-alerting` is separate: a distinct transaction with a distinct audit action
        (`service.escalation_policy`, naming before→after) and distinct consequences. A change here
        does NOT reset the progress of a ladder already in flight — the monitor path behaves the same
        way, and rewinding would page everyone again for an edit.


        A policy belonging to another project is a 400 `owner_not_in_project`: routing decides who is
        woken, so pointing it across a tenant boundary is the one mistake in this feature that wakes
        the wrong humans. The composite FK refuses it as well; this answer exists so the refusal is
        legible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escalation_policy_id]
              additionalProperties: false
              properties:
                escalation_policy_id:
                  type: string
                  description: 'The policy id, or an empty string to clear it.'
      responses:
        '200':
          description: The policy id now stored (empty when cleared) — what the DATABASE holds.
          content:
            application/json:
              schema:
                type: object
                required: [escalation_policy_id]
                additionalProperties: false
                properties:
                  escalation_policy_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The service is owned by a file provider (`managed_by_file`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/sla-target/burn-alerting:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    put:
      tags: [services]
      summary: Declare which error-budget burns page, for one window (editor+)
      description: >
        A full REPLACE of one SLA target's burn declaration, not a patch: rules that are no
        longer declared have their announcements closed (`rule_removed`) and their latch rows
        deleted, and a partial body could not say which those are. `burn_rules` is the
        complete set and omitting it declares none.


        `window` names the target and defaults to 30d. A window with no declared objective is
        a 404: enabling burn alerting on an objective nobody set would page against a number
        that does not exist, so `PUT …/sla-target` is the prerequisite.


        A rule's `firing` latch is SERVER-owned and rejected on the wire — never silently
        zeroed, because a request that says "this rule is firing" and receives a 200 has been
        told it was believed. Rules are stored and echoed in canonical key order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetServiceBurnAlertingRequest' }
      responses:
        '200':
          description: The stored burn declaration, in canonical key order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceBurnAlerting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such service in this project, or no objective declared for `window`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The service is owned by a file provider (`managed_by_file`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/gate:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    post:
      tags: [gate]
      summary: Ask the reliability gate for a decision (viewer+, `gate:evaluate`)
      description: >
        FR-024. ONE point-in-time advisory reading of the service's sealed reliability facts under
        its policy: `state` is what was OBSERVED (`ALLOW`, `WARN`, `BLOCK`, `UNKNOWN`, or
        `NOT_CONFIGURED` when the service has no policy) and `action` is what the pipeline should
        do (`ALLOW`, `WARN`, `BLOCK`) — absent for `NOT_CONFIGURED`, which is a 200 and never an
        error. Every field follows the D7 presence table: absent means "does not apply", and the
        one present-and-null field is `service_id` once the service has been deleted. An active
        override changes ONLY `action` (to `ALLOW`, with `unoverridden_action` carrying what it
        would have been); `state` and `reasons` are the facts and never move.


        The decision is written to the ledger in the same transaction and is readable by
        `decision_id` under `/gate/decisions/{decisionID}` after the service is renamed or deleted.
        Nothing is reserved: ask immediately before the protected step.


        The body is EMPTY or `{}`. Any field — `override`, `actor`, anything — is refused as an
        unknown field naming it (400); an override is created only through `…/gate/override`.


        Bounded per process (§5a): the in-flight permits are taken first (process, then principal)
        and a refusal there consumes no rate token; then the principal and process token buckets
        are checked and debited as a unit. A 429 runs no evaluation and writes no row; `Retry-After`
        is `ceil(seconds until the next token)` for a rate refusal and `1` for an in-flight
        refusal, never below 1. A pipeline must not retry into a 429.


        Errors: 400 (malformed `serviceID`, or a body with any field); 404 (unknown or foreign
        service — existence hidden); 429 `process_inflight` | `principal_inflight` |
        `principal_rate` | `process_rate`; 503 `snapshot_conflict` (the one-snapshot transaction
        lost twice to concurrent writes), `ledger_unwritable` (no ledger partition holds this
        instant), `timeout` (the begin-through-commit budget ran out).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Empty. Any field is refused as unknown.
      responses:
        '200':
          description: The decision, ledger-recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/GateTooManyRequests' }
        '503':
          description: >-
            The evaluation could not complete: `snapshot_conflict`, `ledger_unwritable` or
            `timeout`. No decision was made and nothing was recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/gate/policy:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [gate]
      summary: The service's live gate policy (viewer+, `gate:evaluate`)
      description: >
        FR-024 D13a. 404 `not_configured` when the service has no policy (never written, or
        deleted). `revision` is a DB-owned generation that is never reused — a delete bumps it, a
        re-create bumps it again — so a stale screen can never CAS over a policy it has not seen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatePolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown or foreign service (`not found`), or no policy configured (`not_configured`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [gate]
      summary: Create or replace the gate policy (editor+, `gate:policy:write`)
      description: >
        FR-024 D11, D13a, D14. The body is the WHOLE document — every clause of the schema
        version, the threshold, the seal-lag bound and `unknown_behavior` — decoded strictly: an
        unknown field, a missing field, a wrong type, a missing/unknown/duplicate clause, or a
        value outside its range is 400 naming the field (`field: rule`). The server fills nothing
        in. `expected_revision` is REQUIRED: `null` means "I believe nothing is configured" and
        matches only an absent or deleted policy; any mismatch is 409 `revision_conflict` and
        changes nothing — checked BEFORE the no-op comparison, so an identical body with a stale
        revision is still 409. An identical body with the current revision is a no-op: same
        revision back, no audit row, no override revocation. A real change bumps the revision and
        revokes the active override (`revoked_reason: policy_changed`). The window must be an SLA
        window the service has a target for. Writable for file-managed services too (D13).


        Errors: 400 validation naming the field; 404 unknown or foreign service; 409 `revision_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatePolicyWrite' }
      responses:
        '200':
          description: The policy's revision after the write (unchanged for a no-op).
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`revision_conflict` — `expected_revision` is not the live revision; nothing changed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [gate]
      summary: Delete the gate policy (editor+, `gate:policy:write`)
      description: >
        FR-024 D13a. Tombstones the policy and bumps its revision in one statement; later decisions
        are `NOT_CONFIGURED`; the active override is closed as `policy_deleted` and stays readable
        through the history routes as `inert`; the ledger is untouched. `expected_revision` is
        REQUIRED in the query.


        Errors: 400 `expected_revision_required` (absent) | `expected_revision_invalid`
        (non-integer or negative); 404 unknown or foreign service, or `not_configured`;
        409 `revision_conflict`.
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown or foreign service (`not found`), or no policy configured (`not_configured`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`revision_conflict`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/gate/override:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [gate]
      summary: The ACTIVE override only, not history (viewer+, `gate:evaluate`)
      description: >
        FR-024 D13a. `status` is computed at read time; only a row whose status is `active` is
        returned here. 404 `none_active` otherwise. History is under `…/gate/overrides`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateOverride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown or foreign service (`not found`), or no active override (`none_active`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [gate]
      summary: Create an override (project_admin+, `gate:override`)
      description: >
        FR-024 D9, D13a. The ONE way an override comes to exist. Its actor is the request's
        principal, server-derived and stored twice — the typed triple the audit log uses and an
        immutable `actor_label` (`token:<name>` for an API token) — so a client-supplied actor
        field is refused as unknown. There is NO `action` field: D9 fixes what an override does
        (a `BLOCK` decision's `action` becomes `ALLOW`; `WARN` and `ALLOW` are left alone;
        `state` and `reasons` never change). `reason` is 1..500 characters; `expires_at` must be
        after the database's `now()` and at most 7 days ahead — a hard maximum, no default. The
        override is bound to `policy_revision`, which must be the live revision; a policy edit or
        delete revokes it. At most ONE unrevoked override per service: an expired one releases
        its slot, a live one is 409 `override_active`.


        Errors: 400 validation naming the field (missing field, unknown field, unparseable
        `expires_at`, `reason` out of bounds, `expires_at` in the past or over 7 days); 404
        unknown or foreign service; 409 `override_active` | `revision_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateOverrideCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`override_active` (a live override holds the slot) or `revision_conflict` (`policy_revision` is not the live revision).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/services/{serviceID}/gate/overrides:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [gate]
      summary: Override history — the newest 50 (viewer+, `gate:evaluate`)
      description: >
        FR-024 D13a. The newest 50 records by `created_at DESC, id DESC`, whatever their status.
        Storage is unbounded and the product history is this window; the audit log is the record.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GateOverrideRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/services/{serviceID}/gate/overrides/{overrideID}:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
      - { $ref: '#/components/parameters/OverrideID' }
    get:
      tags: [gate]
      summary: One override record, whatever its status (viewer+, `gate:evaluate`)
      description: >
        FR-024 D13a. Every field is ALWAYS present, never absent: an active row carries the five
        closure fields as null; a system closure (`expired`, `policy_changed`, `policy_deleted`)
        carries `revoked_at` and `revoked_reason` with the three attribution fields null; a
        `manual` closure carries all five, with `revoked_by_user_id` null and `revoked_via_token`
        true when the revoker was an API token. `status` is a FUNCTION computed at read time:
        `revoked` (manual) > `inert` (policy changed/deleted, or bound to a revision that is not
        the live one) > `expired` > `active`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateOverrideRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [gate]
      summary: Revoke an override by its immutable id (project_admin+, `gate:override`)
      description: >
        FR-024 D13a. Revocation is by id, never "the current one": a stale screen revoking an
        override that has expired or been superseded gets 409 `override_not_active` and the
        current override is untouched. A revoke of an already-revoked or expired override is that
        same 409, never a silent 204. Audited with the revoker's complete triple.


        Errors: 400 malformed id; 404 unknown or foreign; 409 `override_not_active`.
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`override_not_active`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/gate/decisions:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [gate]
      summary: The project's decision ledger, newest first (viewer+, `gate:evaluate`)
      description: >
        FR-024 §5. PROJECT-scoped, never service-nested: the ledger outlives services, so a
        `service_id` foreign to the project yields an EMPTY page, not 404. The range is half-open
        `[from, to)`, both REQUIRED, `from < to`, at most 31 days. Order is `evaluated_at DESC,
        id DESC`; `cursor` is an opaque keyset of the LAST RETURNED item and the next page is
        bound strictly below it; `next_cursor` is null on the last page. The traversal is LIVE:
        a key returned once is never returned again, and rows committed or detached during the
        traversal may or may not appear. Each item's presence follows the by-id response.


        `state` narrows the page to a SET of states: repeatable (`?state=BLOCK&state=WARN`), the
        occurrences OR-ed, none at all = no filter. The filter is applied BEFORE the limit — a page
        of 50 is 50 MATCHING rows, not 50 rows with the others struck out — and it composes with
        `service_id`. The cursor semantics are unchanged: the keyset runs over the FILTERED set, so
        a `next_cursor` continues the same state set and the same service, no duplicates, no gaps.


        Ledger reads take the §5a in-flight permits (429 `process_inflight` / `principal_inflight`)
        but no rate token.


        Errors: 400 `range_required` | `range_invalid` | `range_too_wide` | `limit_invalid`
        (0, negative, non-integer or above 200) | `cursor_invalid` | `state_invalid` (any
        occurrence outside the five states, the offending value named) | a non-UUID `service_id`;
        404 project not visible; 429 in-flight permits exhausted.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: service_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: state
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [ALLOW, WARN, BLOCK, UNKNOWN, NOT_CONFIGURED] }
          description: >
            Repeatable; the set of states to keep (OR). Omitted = every state. Any other value is
            400 `state_invalid`.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque; the `next_cursor` of the previous page.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateDecisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/GateTooManyRequests' }

  /api/v1/projects/{projectID}/gate/decisions/{decisionID}:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/DecisionID' }
    get:
      tags: [gate]
      summary: One decision by id (viewer+, `gate:evaluate`)
      description: >
        FR-024 D10, §5. Authorized by the row's persisted `project_id`, with NO service-existence
        check on the path — the evidence is wanted exactly when the service is gone. The read
        derives the row's UTC day from the id's own millisecond and prunes to that one partition;
        a detached or never-created day and an unknown id both answer 404. Takes the §5a in-flight
        permits, no rate token.


        Errors: 400 malformed id; 404 unknown, foreign, or no longer retained; 429 permits exhausted.
      responses:
        '200':
          description: The decision as it was, evidence included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/GateTooManyRequests' }

  /api/v1/projects/{projectID}/services/{serviceID}/changes:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    post:
      tags: [changes]
      summary: Record a change phase (editor+, `change:record`)
      description: >
        FR-025 D2, D3, D5. A pipeline says what it changed: `kind` (`deploy` | `rollback` |
        `flag`), `phase` (`started` | `succeeded` | `failed` | `cancelled`), the external identity
        `(source, external_id)` under which the phases of one change are grouped, an optional bounded
        `ref` and `https://` `url`, the gate `decision_id` the release rested on, and `occurred_at`
        (defaults to the server clock; at most `change.max_past` behind and `change.max_future`
        ahead of it). The body is decoded STRICTLY — an unknown field (an `actor` included: the actor
        is the principal, D5), a missing required field or a wrong type is 400 naming it. Every text
        field is NORMALIZED (Unicode NFC, trimmed) before anything validates it, so a client may send
        what it was given; the canonical rules (no control or format characters, no line separators,
        lengths in code points) are then the domain's.


        Phases are append-only and idempotent under `(service, source, external_id, phase)`: a
        replay whose `kind`, `occurred_at`, `ref`, `url` and `decision_id` are equal after
        normalization is 200 with the ORIGINAL row (`replayed: true`, original actor and
        `recorded_at`) and writes nothing; a differing replay is 409 `phase_exists` naming the field.
        The order is the domain's: `started` then exactly one terminal; a terminal alone is accepted;
        a second terminal or a `started` after a terminal is 409 `phase_order`; a terminal that
        predates `started` is 400 `occurred_at_before_start`; a phase whose kind differs from the
        group's is 409 `kind_mismatch`. Writes for one identity are serialized. Recording is not
        audited — the row is the record.


        Bounded per process (§5a): the in-flight permits first (`change.record_inflight_process`),
        then the principal and process token buckets checked and debited as a unit. A 429 reaches no
        store; `Retry-After` is `ceil(seconds until the next token)`, `1` for an in-flight refusal,
        never below 1. A malformed body is refused BEFORE the bounds and costs no token.


        Errors: 400 — `<field>: unknown field` | `<field>: is required` | `<field>: must be …`
        (shape), `kind_invalid` | `phase_invalid` | `source_invalid` | `external_id_invalid` |
        `ref_invalid` | `url_invalid` | `decision_unknown` | `occurred_at_before_start` |
        `occurred_at_out_of_bounds` (the code first, then the field, then the rule); 403 the
        principal lacks `change:record`; 404 unknown or foreign service (existence hidden);
        409 `phase_order` | `phase_exists` | `kind_mismatch`; 429 `process_inflight` |
        `principal_inflight` | `principal_rate` | `process_rate`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRecord' }
      responses:
        '201':
          description: Recorded — a new phase row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRecordResult' }
        '200':
          description: An identical replay — the ORIGINAL row, nothing written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRecordResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`phase_order` (the order rule), `phase_exists` (a differing replay, the field named) or `kind_mismatch`; nothing changed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/ChangeTooManyRequests' }
    get:
      tags: [changes]
      summary: The service's change timeline over a bounded range (viewer+, `project:read`)
      description: >
        FR-025 D6. Change GROUPS — one per external identity — with their phases nested, over an
        explicit half-open `[from, to)` of at most 92 days, both REQUIRED. A group is selected by
        `latest_occurred_at` (the max over its phases) and nests ALL its phases, including a
        `started` before `from`. Order is `latest_occurred_at DESC, source, external_id`; `cursor` is
        an opaque keyset of the LAST RETURNED group and the next page is bound strictly below it;
        `next_cursor` is null on the last page; `limit` counts GROUPS. The traversal is LIVE: a group
        returned once is never returned again, and a phase recorded mid-traversal may move its group
        out of this traversal — a client that needs a fixed set re-reads the range.


        `kind` narrows to a SET of kinds (repeatable, OR, deduplicated); `source` to one slug. Both
        apply BEFORE the limit. Each group's `ref`/`url` are its latest phase's; `decision` is
        ABSENT when no phase carried a `decision_id`, the live ledger row's `{decision_id, state,
        action?, overridden}` while it exists, `{decision_id, aged_out: true}` once it is gone (D11);
        `incidents` is ALWAYS an array — the incidents this change PRECEDED (D7; never "caused").


        Reads take the read permits of §5a (`change.read_inflight_process`), no rate token.


        Errors: 400 `range_required` | `range_invalid` | `range_too_wide` | `limit_invalid` |
        `cursor_invalid` | `kind_invalid` | `source_invalid` | a non-UUID `serviceID`; 404 unknown or
        foreign service, or invisible project; 429 `process_inflight`.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: kind
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [deploy, rollback, flag] }
          description: Repeatable; the set of kinds to keep (OR). Omitted = every kind. Any other value is 400 `kind_invalid`.
        - name: source
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque; the `next_cursor` of the previous page.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeGroupList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ChangeTooManyRequests' }

  /api/v1/projects/{projectID}/services/{serviceID}/changes/compare:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      tags: [changes]
      summary: The SLI before and after one change, from sealed buckets only (viewer+, `project:read`)
      description: >
        FR-025 D8, D-0211. Addressed by `(source, external_id, horizon)` — there is no by-identity
        group route. For the group's TERMINAL phase at instant T (its `occurred_at` floored to the
        canonical bucket) and a horizon `h` in `{15m, 1h, 6h, 24h}` (default `1h`), the comparison
        sums the reliability page's OWN canonical buckets over `[T − h, T)` and `[T, T + h)` through
        the series owner — the same decidability, exclusion and provisional rules, the same
        `sealed_through` clamp — so its figures are the values the page would show for the same range
        and snapshot. Each side is EXACTLY ONE of: a FIGURE (`availability`, `good_seconds`,
        `bad_seconds`, `unknown_seconds`, `excluded_seconds`, `buckets`); WITHHELD (`withheld` one of
        `definition_changed` | `undecidable` | `no_facts`, `detail` carrying the page's own reason
        string for `undecidable`); or PENDING — a side whose end lies past `sealed_through` (`pending:
        true`, `sealed_through` stated, NO partial figure). `delta` (after − before, availability
        points) is present ONLY when both sides are figures. `sealed_through` at the top is null when
        the service has sealed nothing. `source` and `external_id` are normalized as a body field
        would be. Nothing is stored or cached; two reads in one snapshot are equal.


        Errors: 400 `source_invalid` | `external_id_invalid` | `horizon_invalid`; 404 unknown or
        foreign service, unknown identity (`not found`), or `no_terminal_phase` (only `started` is
        recorded); 429 `process_inflight`.
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        - name: external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: horizon
          in: query
          required: false
          schema: { type: string, enum: ['15m', '1h', '6h', '24h'], default: '1h' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeCompare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown or foreign service, unknown identity (`not found`), or the change has no terminal phase yet (`no_terminal_phase`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/ChangeTooManyRequests' }

  /api/v1/projects/{projectID}/incidents/{incidentID}/changes:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/IncidentID' }
    get:
      tags: [changes]
      summary: The changes that PRECEDED an incident (viewer+, `project:read`)
      description: >
        FR-025 D7. The `incident_changes` rows computed at the service auto-incident's `opened`
        delivery — the same rows each timeline group's `incidents[]` comes from, read from the
        incident side. Each item is the ANCHORED phase (the group's latest phase known at the open,
        with identity), its `role` (`own_service` | `upstream`, the latter a `probable_root` service
        of the incident), the copied `occurred_at` and `lag_seconds` (never updated), `computed_at`,
        and the group's CURRENT phases read live beside it. `items` is ALWAYS an array. The route
        says "preceded", never "caused". Scoped to the project at the link rows: an incident of
        another project is 404. Takes the read permits of §5a.


        Errors: 400 non-UUID `incidentID`; 404 unknown or foreign incident, or invisible project;
        429 `process_inflight`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentChanges' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ChangeTooManyRequests' }

  /api/v1/projects/{projectID}/sla:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [sla]
      summary: Project-level SLI over standard windows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSLA' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/sla-target:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - in: query
        name: window
        required: false
        schema: { type: string, default: "30d" }
    get:
      tags: [sla]
      summary: The project's SLO objective for a window (viewer+)
      description: >
        404 when the project has no objective for that window. Absent is the answer: a project without
        an objective has no error budget, and returning 99.9 would be a number nobody chose.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SLATarget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [sla]
      summary: Set the project's SLO objective for a window (editor+)
      description: >
        REPORTING ONLY. The body is `{window, objective}` and nothing else — `burn_alert` or
        `burn_rules` are a 400 rather than a silently dropped hope, and the schema refuses a paging
        project target as well (`sla_targets_project_no_burn_chk`), so the three layers agree. The
        objective goes through the one canonical rule shared by every scope: the open interval (0,100),
        rounded half-up at four decimals (D-0165).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                window: { type: string, default: "30d" }
                objective: { type: number, format: double, example: 99.9 }
              required: [objective]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SLATarget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sla]
      summary: Clear the project's SLO objective for a window (editor+)
      description: >
        404 when that window has no objective — Clear is a statement about a promise that exists, and a
        quiet success on a mis-typed window would read as "cleared". Clearing the objective clears the
        budget with it: the budget is derived, never stored, so the window returns to dashes rather than
        to 100%.
      responses:
        '204': { description: Cleared }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/sla-report:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    put:
      tags: [sla]
      summary: Toggle a project's weekly SLA report (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sla_report_weekly: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/maintenance:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [sla]
      summary: List maintenance windows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MaintenanceWindow' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [sla]
      summary: Schedule a maintenance window (editor+)
      description: >
        A window reaching back over SEALED reliability facts requires a preview token issued
        for exactly this mutation (409 `preview_required` without one). A prospective window
        changes no settled number and needs none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMaintenance' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/monitors/{monitorID}:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    get:
      tags: [monitors]
      summary: Get a monitor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [monitors]
      summary: Update a monitor's mutable fields (editor+). Type is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMonitor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [monitors]
      summary: Delete a monitor (editor+)
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/heartbeats:
    parameters:
      - { $ref: '#/components/parameters/MonitorID' }
      - in: query
        name: limit
        schema: { type: integer, default: 100, maximum: 1000 }
    get:
      tags: [monitors]
      summary: Recent heartbeats (newest first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Heartbeat' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/sla:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    get:
      tags: [sla]
