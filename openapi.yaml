openapi: 3.0.3
info:
  title: cerbix API
  version: 0.19.0
  description: >
    Internal uptime & SLA monitoring API. Authentication is via a server-side
    session cookie established by an OIDC provider (`/auth/login` → `/auth/callback`)
    or local login (`/auth/local/login`). All `/api/v1/*` endpoints require a
    valid session and enforce tenant isolation: callers only see and mutate the
    organizations/projects they are authorized for (non-members receive 404;
    insufficient in-org role receives 403).

servers:
  - url: /
    description: Same-origin (SPA is served by the API binary)

tags:
  - name: auth
  - name: me
  - name: organizations
  - name: projects
  - name: monitors
  - name: sla
  - name: incidents
  - name: status-pages
  - name: tokens
  - name: webhooks
  - name: notifications
  - name: search
  - name: admin

# Endpoints accept either an interactive session cookie or a service-account
# bearer token; authorization is role-driven regardless of which was presented.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/local/login:
    post:
      tags: [auth]
      summary: Local username/password login (issues a session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated; sets the session cookie.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/local/reset/request:
    post:
      tags: [auth]
      summary: Request a password-reset link (local accounts)
      security: []
      description: >
        Emails a one-time reset link if the address belongs to a local account.
        Always returns 200 with a generic body so it cannot enumerate accounts.
        Requires outbound email (mail) to be configured; see /auth/config
        password_reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted (whether or not the address exists).
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '429': { description: Too many requests. }

  /auth/local/reset/confirm:
    post:
      tags: [auth]
      summary: Complete a password reset with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, description: The token from the reset link. }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/config:
    get:
      tags: [auth]
      summary: Which sign-in methods this instance offers (for the login page)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  local: { type: boolean, description: Local username/password login is enabled. }
                  oidc: { type: boolean, description: OIDC login is enabled. }
                  oidc_button_label: { type: string, description: Text for the OIDC sign-in button. }
                  password_reset: { type: boolean, description: Self-service password reset is available (local login + mail configured). }

  /auth/login:
    get:
      tags: [auth]
      summary: Begin OIDC login (redirects to the configured identity provider)
      security: []
      parameters:
        - in: query
          name: redirect
          schema: { type: string }
          description: Local path to return to after login.
      responses:
        '302': { description: Redirect to the identity provider. }

  /auth/callback:
    get:
      tags: [auth]
      summary: OIDC redirect URI (exchanges code, sets the session cookie)
      security: []
      responses:
        '302': { description: Redirect to the post-login path. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session and clear the cookie
      responses:
        '302': { description: Redirect to the post-logout path. }

  /api/v1/me:
    get:
      tags: [me]
      summary: Current user and memberships
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/version:
    get:
      tags: [me]
      summary: Running build info (version, commit)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/password:
    post:
      tags: [me]
      summary: Change the current local user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/me/totp/enroll:
    post:
      tags: [me]
      summary: Begin two-factor (TOTP) enrollment
      description: >
        Generates a pending TOTP secret for the current local user (2FA not yet
        active) and returns it plus an otpauth:// URI for an authenticator app.
        Confirm with POST /api/v1/me/totp/enable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPEnrollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me/totp/enable:
    post:
      tags: [me]
      summary: Confirm and enable two-factor authentication
      description: >
        Verifies a code against the pending secret, enables 2FA, and returns
        single-use recovery codes (shown once).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPEnableRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPEnableResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/me/totp/disable:
    post:
      tags: [me]
      summary: Disable two-factor authentication
      description: Turns off 2FA after re-verifying the account password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPDisableRequest' }
      responses:
        '204': { description: Two-factor disabled. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/organizations:
    get:
      tags: [organizations]
      summary: List organizations visible to the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
    post:
      tags: [organizations]
      summary: Create an organization (global admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgID}:
    parameters: [ { $ref: '#/components/parameters/OrgID' } ]
    get:
      tags: [organizations]
      summary: Get an organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgID}/projects:
    parameters: [ { $ref: '#/components/parameters/OrgID' } ]
    get:
      tags: [projects]
      summary: List projects of an organization visible to the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [projects]
      summary: Create a project (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgID}/members:
    parameters: [ { $ref: '#/components/parameters/OrgID' } ]
    get:
      tags: [organizations]
      summary: List org members with identity (org admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [organizations]
      summary: Add a membership (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMember' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/organizations/{orgID}/audit:
    parameters:
      - { $ref: '#/components/parameters/OrgID' }
      - in: query
        name: limit
        required: false
        schema: { type: integer, default: 100 }
    get:
      tags: [organizations]
      summary: Recent audit entries (org admin) — member and token changes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/organizations/{orgID}/members/{membershipID}:
    parameters:
      - { $ref: '#/components/parameters/OrgID' }
      - { $ref: '#/components/parameters/MembershipID' }
    patch:
      tags: [organizations]
      summary: Change a member's role (org admin)
      description: The last org-level admin cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMember' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [organizations]
      summary: Remove a member (org admin)
      description: The last org-level admin cannot be removed.
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [projects]
      summary: Get a project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/regions:
    get:
      tags: [monitors]
      summary: List worker-pool regions for the monitor region picker
      description: >
        Worker-pool regions in use (assigned to monitors, always incl. core) unioned
        with regions that have a live worker (an active consumer on checks.jobs.*, via
        the RabbitMQ management API), each flagged with its live status. Any
        authenticated caller may read it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        live: { type: boolean, description: 'A worker for this region is currently connected.' }

  /api/v1/projects/{projectID}/monitors:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [monitors]
      summary: List a project's monitors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Monitor' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [monitors]
      summary: Create a monitor (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitor' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/monitors/test:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    post:
      tags: [monitors]
      summary: Test a monitor spec with a one-off probe before saving (editor+)
      description: >
        Runs a single probe against the given spec and returns the result. The probe
        is dispatched to a worker in the spec's `region`, so a geo target is tested
        from its own region rather than from core. Push and composite monitors are not
        testable (400). If no worker in the target region answers, returns 502 — the
        result is unknown (start a worker with `--region <name>`), not a target outage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  up: { type: boolean }
                  latency_ms: { type: integer, format: int64 }
                  code: { type: integer }
                  msg: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: No worker in the target region answered the test probe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{projectID}/sla:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [sla]
      summary: Project-level SLI over standard windows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSLA' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/sla-report:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    put:
      tags: [sla]
      summary: Toggle a project's weekly SLA report (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sla_report_weekly: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/maintenance:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [sla]
      summary: List maintenance windows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MaintenanceWindow' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [sla]
      summary: Schedule a maintenance window (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMaintenance' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/monitors/{monitorID}:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    get:
      tags: [monitors]
      summary: Get a monitor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [monitors]
      summary: Update a monitor's mutable fields (editor+). Type is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMonitor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [monitors]
      summary: Delete a monitor (editor+)
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/heartbeats:
    parameters:
      - { $ref: '#/components/parameters/MonitorID' }
      - in: query
        name: limit
        schema: { type: integer, default: 100, maximum: 1000 }
    get:
      tags: [monitors]
      summary: Recent heartbeats (newest first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Heartbeat' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/sla:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    get:
      tags: [sla]
      summary: Monitor SLI over standard windows, with error budget if a target is set
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorSLA' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/availability:
    parameters:
      - { $ref: '#/components/parameters/MonitorID' }
      - { $ref: '#/components/parameters/AvailabilityDays' }
    get:
      tags: [sla]
      summary: Per-day availability (rollup + today), oldest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DailyAvailability' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/availability:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/AvailabilityDays' }
    get:
      tags: [sla]
      summary: Per-day availability across a project's monitors, oldest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DailyAvailability' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/monitors/{monitorID}/sla-target:
    parameters: [ { $ref: '#/components/parameters/MonitorID' } ]
    put:
      tags: [sla]
      summary: Set a monitor's SLO objective for a window (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSLATarget' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SLATarget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/maintenance/{maintenanceID}:
    parameters:
      - in: path
        name: maintenanceID
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [sla]
      summary: Delete a maintenance window (editor+)
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/incidents:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    get:
      tags: [incidents]
      summary: List a project's incidents (newest first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [incidents]
      summary: Open an incident with an opening timeline update (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncident' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{projectID}/alerts/alertmanager:
    parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
    post:
      tags: [incidents]
      summary: Alertmanager webhook receiver — firing opens incidents, resolved closes them (editor+)
      description: >
        Point a Prometheus Alertmanager webhook_config here with a service-account
        bearer token in its http_config. Alerts are correlated by fingerprint: a
        firing alert opens an incident (idempotent per fingerprint), a resolved alert
        closes the incident it opened.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertmanagerPayload' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened: { type: integer }
                  resolved: { type: integer }
                  ignored: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/incidents/{incidentID}:
    parameters: [ { $ref: '#/components/parameters/IncidentID' } ]
    get:
      tags: [incidents]
      summary: Get an incident
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/incidents/{incidentID}/updates:
    parameters: [ { $ref: '#/components/parameters/IncidentID' } ]
    get:
      tags: [incidents]
      summary: List an incident's timeline (chronological)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IncidentUpdate' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [incidents]
      summary: Append a timeline update, advancing status (editor+). Rejected once resolved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddIncidentUpdate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentUpdate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/incidents/{incidentID}/postmortem:
