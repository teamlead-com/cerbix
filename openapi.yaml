  /api/v1/public/status-pages/{slug}/subscribers:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
      - in: query
        name: token
        required: false
        schema: { type: string }
        description: Unlisted-page access token, if the page is unlisted.
    post:
      tags: [status-pages]
      security: []
      summary: Subscribe an email to a status page (double opt-in; sends a confirmation email)
