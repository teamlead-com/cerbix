        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alerting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save alerting controls (global admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Alerting' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alerting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/monitor-defaults:
    get:
      tags: [monitors]
      summary: Effective instance monitor defaults (any authenticated user)
      description: >
        The resolved defaults (DB -> config seed -> built-ins) the monitor form
        prefills from; editing them stays on the admin-only settings endpoint.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/monitor-defaults:
    get:
      tags: [admin]
      summary: Read monitor defaults (global admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save monitor defaults (global admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorDefaults' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/settings/mail:
    get:
      tags: [admin]
      summary: Read mail/SMTP settings (global admin only, password redacted)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MailSettingsView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Save mail/SMTP settings and re-point the live mailer (global admin only)
      description: 'A blank/omitted smtp_password preserves the stored one. The mailer resolves this per send, so changes apply immediately.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetMailSettings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MailSettingsView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/public/branding:
    get:
      tags: [public]
      summary: Public branding (unauthenticated) for the login page and status pages
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicBranding' } } } }

  /api/v1/admin/audit:
    parameters:
      - in: query
        name: limit
        required: false
        schema: { type: integer, default: 100, maximum: 500 }
    get:
      tags: [admin]
      summary: Instance-level audit entries (global admin)
      description: >
        The entries a GLOBAL admin's own actions leave — `user.global_admin`, `user.delete`,
        file-provider and outbox operations. They carry no organization (`org_id` is empty),
        which is exactly what separates them from `/organizations/{orgID}/audit`: an org admin
        must never read the installation's history, so this is a distinct read rather than the
        org listing with a wider filter. `limit` is clamped server-side (default 100, max 500).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List every user of the instance (global admin only)
      description: >
        User-keyed rows with aggregated memberships across all organizations —
        including users outside any organization (empty memberships list), who
        are invisible in the org-scoped member lists.
      parameters:
        - in: query
          name: q
          required: false
          description: Case-insensitive substring filter on email or display name.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{userID}:
    patch:
      tags: [admin]
      summary: Grant or revoke the global-admin flag (global admin only)
      description: >
        Changing your own flag is rejected, and the last global admin cannot be
        demoted (400 in both cases).
      parameters:
        - { in: path, name: userID, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUser' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete a user (global admin only)
      description: >
        Memberships and sessions cascade in the database; audit entries keep a
        NULL actor. Self-deletion and deleting the last global admin are
        rejected (400).
      parameters:
        - { in: path, name: userID, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/file-providers:
    get:
      tags: [admin]
      summary: List all file-provider bundle diagnostics (global admin only)
      description: >
        Monitoring-as-Code (FR-017) provider bundle status across all tenants: relative
        source path, applied generation, status, and bounded errors (`bundles`), plus this
        process's live runtime view of every configured provider (`providers`): leadership,
        last scan/success, and counts — including configured-but-idle providers. Requires a
        global admin.
      parameters:
        - in: query
          name: provider
          required: false
          schema: { type: string }
          description: 'Optional: restrict both bundles and runtime status to one named provider (§15).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bundles, providers]
                properties:
                  bundles: { type: array, items: { $ref: '#/components/schemas/FileProviderDiagnostic' } }
                  providers: { type: array, items: { $ref: '#/components/schemas/FileProviderRuntimeStatus' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/organizations/{orgID}/file-providers:
    get:
      tags: [admin]
      summary: List an organization's file-provider bundle diagnostics (org admin)
      description: >
        Provider bundle status scoped to one organization (org admin). Filtered in the store,
        so no cross-tenant bundle/error/path is ever returned.
      parameters:
        - in: path
          name: orgID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bundles]
                properties:
                  bundles: { type: array, items: { $ref: '#/components/schemas/FileProviderDiagnostic' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/outbox/dead:
    get:
      tags: [admin]
      summary: List dead-lettered outbox events (global admin only)
      description: >
        Outbound events (incident webhooks, monitor-transition notifications) that
        exhausted their delivery retries. System-wide; requires a global admin.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OutboxEvent' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/outbox/dead/replay-all:
    post:
      tags: [admin]
      summary: Requeue every dead outbox event (global admin only)
      responses:
        '200':
          description: Number of events requeued.
          content:
            application/json:
              schema:
                type: object
                properties: { replayed: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/outbox/dead/{eventID}/replay:
    parameters:
      - in: path
        name: eventID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Requeue one dead outbox event for delivery (global admin only)
      responses:
        '204': { description: Requeued. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cerbix_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Machine auth via Authorization: Bearer. Either a cerbix service-account token (cbx_...) or an OIDC client-credentials access token (a realm-issued JWT, when OIDC is enabled); the JWT subject is JIT-provisioned and access is membership-gated."

  parameters:
    OrgID:
      in: path
      name: orgID
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      in: path
      name: projectID
      required: true
      schema: { type: string, format: uuid }
    MembershipID:
      in: path
      name: membershipID
      required: true
      schema: { type: string, format: uuid }
    MonitorID:
      in: path
      name: monitorID
      required: true
      schema: { type: string, format: uuid }
    IncidentID:
      in: path
      name: incidentID
      required: true
      schema: { type: string, format: uuid }
    PageID:
      in: path
      name: pageID
      required: true
      schema: { type: string, format: uuid }
    ServiceID:
      in: path
      name: serviceID
      required: true
      schema: { type: string, format: uuid }
    OverrideID:
      in: path
      name: overrideID
      required: true
      schema: { type: string, format: uuid }
      description: A gate override's immutable id (FR-024 D13a). Malformed is 400 before the store is asked.
    DecisionID:
      in: path
      name: decisionID
      required: true
      schema: { type: string, format: uuid }
      description: A gate decision's id — a UUIDv7 whose millisecond is its `evaluated_at` (FR-024 §5). Malformed is 400.
    SecretName:
      in: path
      name: name
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
      description: Secret name (slug) within the project inventory.
    FeedFormat:
      in: query
      name: format
      required: false
      schema: { type: string, enum: [rss, atom, json], default: rss }
      description: Feed serialization; defaults to RSS 2.0.
    AvailabilityDays:
      in: query
      name: days
      required: false
      schema: { type: integer, default: 90, maximum: 365 }
      description: Number of trailing days of availability to return.

  responses:
    Unauthorized:
      description: No or invalid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but insufficient role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found or not visible to the caller (existence hidden).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >-
        The request lost a race or contradicts current state: a stale CAS token, an already-applied
        lifecycle act, a name already taken. First committer wins; re-read and decide again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    GateTooManyRequests:
      description: >-
        Refused by a process-local bound of the reliability gate (FR-024 §5a) BEFORE any
        transaction: `error` is `process_inflight`, `principal_inflight`, `principal_rate` or
        `process_rate`. Nothing was evaluated and nothing was recorded. Do not retry into it.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: >-
            Whole seconds: `ceil(seconds until the next token)` for a rate refusal, `1` for an
            in-flight refusal, never below 1.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    ChangeTooManyRequests:
      description: >-
        Refused by a process-local bound of change intelligence (FR-025 §5a) BEFORE any store call:
        `error` is `process_inflight`, `principal_inflight`, `principal_rate` or `process_rate`
        (the read routes take permits only, so only `process_inflight` occurs there). Nothing was
        recorded. Do not retry into it.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: >-
            Whole seconds: `ceil(seconds until the next token)` for a rate refusal, `1` for an
            in-flight refusal, never below 1.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Service:
      type: object
      required: [id, slug, name, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: Project-unique and IMMUTABLE — it is what a bundle and a dashboard both reference.
        name: { type: string }
        description: { type: string }
        escalation_policy_id: { type: string, format: uuid }
        oncall_schedule_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        managed_by:
          type: string
          description: >
            The file provider that owns this service; empty when it is UI-owned. Present so
            the UI can disable the controls rather than discover the 409.

    ReliabilitySplit:
      type: object
      description: >
        One side of a projection: duration in MICROSECONDS across BOTH conserved axes.
        Availability (good/bad/unknown/excluded) and health
        (healthy/degraded/down/health_unknown + shared excluded) each sum to the range's
        length exactly. Health is carried because a mutation can move it without touching
        availability — an exclusion entirely inside already-degraded time — and a payload
        with only the first would show "no change" for a change.
      required: [good_us, bad_us, unknown_us, excluded_us, healthy_us, degraded_us, down_us, health_unknown_us]
      additionalProperties: false
      properties:
        good_us: { type: integer, format: int64 }
        bad_us: { type: integer, format: int64 }
        unknown_us: { type: integer, format: int64 }
        excluded_us: { type: integer, format: int64 }
        healthy_us: { type: integer, format: int64 }
        degraded_us: { type: integer, format: int64 }
        down_us: { type: integer, format: int64 }
        health_unknown_us: { type: integer, format: int64 }

    ServiceSummary:
      type: object
      required: [service, revision, context_members, sli_members, epoch_seq, repairing_count]
      additionalProperties: false
      properties:
        service: { $ref: '#/components/schemas/Service' }
        revision:
          type: integer
          format: int64
          description: 0 when nothing has been declared — a valid state, not a missing row.
        effective_at: { type: string, format: date-time }
        context_members:
          type: integer
          description: Monitors in the operational context.
        sli_members:
          type: integer
          description: >
            Of those, how many were explicitly declared as reliability inputs. The two counts
            are separate because the two lists are separately declared; equal counts are
            legitimate.
        epoch_seq: { type: integer, format: int64 }
        sealed_through:
          type: string
          format: date-time
          description: Contiguity-defined watermark; absent when nothing has been sealed.
        repairing_count:
          type: integer
          description: Ranges whose numbers are not currently trustworthy.

    CreateServiceRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        name: { type: string, description: Defaults to the slug when omitted. }
        description: { type: string }
        escalation_policy_id: { type: string, format: uuid }
        oncall_schedule_id: { type: string, format: uuid }
        depends_on:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: >
            Create-with-edges (phase 3): the service and its upstream edges commit
            atomically under the same validator and lock as the dependencies PUT.

    ServiceGraphEdge:
      type: object
      required: [id, slug, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        managed_by:
          type: string
          description: >
            The file provider owning this NEIGHBOUR, absent when the UI owns it. Bounded
            provenance (the provider id only): a file-owned downstream dependent PINS this
            service, so deleting it is a 409 — a reader who cannot tell the two apart cannot
            predict that.
        health:
          allOf: [ { $ref: '#/components/schemas/ServiceHealthNow' } ]
          nullable: true
          description: >
            The phase-2 two-layer signal, evaluated for the WHOLE neighbour set in one
            snapshot. Absent when the health read degraded — never a guessed pill.

    ServiceGraph:
      type: object
      required: [graph_generation, depends_on, depended_on_by]
      additionalProperties: false
      properties:
        graph_generation:
          type: integer
          format: int64
          description: The edge set's concurrency token; echo it back on PUT.
        depends_on:
          type: array
          items: { $ref: '#/components/schemas/ServiceGraphEdge' }
          nullable: true
        depended_on_by:
          type: array
          items: { $ref: '#/components/schemas/ServiceGraphEdge' }
          nullable: true

    PutServiceDependenciesRequest:
      type: object
      required: [depends_on, graph_generation]
      additionalProperties: false
      properties:
        depends_on:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        graph_generation: { type: integer, format: int64 }

    ServiceImpactLink:
      type: object
      required: [service_id, slug, name, role, path, computed_at]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [probable_root, affected]
          description: >
            probable_root marks EVERY upstream service on a path with an open incident —
            the relation records candidates, it never elects a single culprit; ranking (by
            path depth) is presentation.
        path:
          type: array
          minItems: 2
          maxItems: 11
          items: { type: string }
          description: >
            The canonical ROOT-FIRST, endpoint-inclusive slug path (shortest, then
            lexicographic tie-break). The same array appears on a probable_root row and its
            affected counterpart; the role says which endpoint is the row's own service.
        computed_at: { type: string, format: date-time }

    AuthedIncident:
      allOf:
        - { $ref: '#/components/schemas/Incident' }
        - type: object
          required: [impacts]
          properties:
            impacts:
              type: array
              nullable: true
              items: { $ref: '#/components/schemas/ServiceImpactLink' }
              description: >
                The incident's impact links. An EMPTY array means "no links"; `null` with
                `impacts_unavailable: true` means the links could not be read — a failed
                read never borrows the honest empty answer.
            impacts_unavailable:
              type: boolean
              description: Present and true when the impact read degraded.
            members:
              type: array
              items: { $ref: '#/components/schemas/IncidentMember' }
              description: >
                The member set the incident's SERVICE had AT OPEN TIME (FR-022). Three answers
                stay distinguishable: the key is ABSENT when there is no snapshot at all (a
                monitor or project-level incident), an EMPTY array when the service genuinely
                had no members, and absent with `members_unavailable: true` when the read
                degraded. A snapshot, not a live join — it keeps naming a member deleted since.
            members_unavailable:
              type: boolean
              description: Present and true when the member-snapshot read degraded.

    IncidentMember:
      type: object
      required: [monitor_id, name, roles]
      properties:
        monitor_id: { type: string, format: uuid, description: 'The member as of the open instant; the monitor may no longer exist.' }
        name: { type: string, description: 'The member name AS OF the effective declaration — not re-read from the monitor, which may be renamed or gone.' }
        roles:
          type: array
          items: { type: string, enum: [context, sli] }
          description: 'Every role this member held, aggregated — the declaration stores a row per (monitor, role) and a postmortem must show the member once.'

    AggregationPolicy:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [all, any, quorum] }
        degraded_min:
          type: integer
          description: >
            The AVAILABILITY threshold: at least this many good members means the service was
            serving. Declared against the declared member cardinality and clamped to the
            eligible one at evaluation time.
        healthy_min:
          type: integer
          description: >
            Splits GOOD into healthy and degraded only. degraded_min <= healthy_min, so
            availability has exactly one good branch.

    RegionAggregationPolicy:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [per_region, any_region, all_regions]
          description: '`any_region` and `all_regions` are sugar; both normalize to per_region thresholds.'
        degraded_min_regions: { type: integer }
        healthy_min_regions: { type: integer }

    FreshnessPolicy:
      type: object
      additionalProperties: false
      description: >
        How long a member's last observation stays effective. Resolved ONCE, when the epoch
        snapshots the member, so recomputing an old range uses the deadline in force then.
        Push monitors instead mirror the product's own dead-man cutoff (interval + grace).
      properties:
        active_multiplier: { type: integer }
        active_floor:
          type: string
          pattern: '^[0-9]+(ns|us|ms|s|m|h)([0-9]+(ns|us|ms|s|m|h))*$'
          example: 1m30s
          description: Go duration string — the same spelling the file bundle uses.

    ServicePolicies:
      type: object
      additionalProperties: false
      description: >
        The part of a definition revision the evaluator reads. Validated by ONE validator,
        shared with the file provider — a second validator would be a second answer.
      properties:
        aggregation: { $ref: '#/components/schemas/AggregationPolicy' }
        region: { $ref: '#/components/schemas/RegionAggregationPolicy' }
        missing_data:
          type: string
          enum: [unknown, bad, ignore]
          description: >
            What an UNKNOWN member contributes. `ignore` drops it only while other KNOWN
            members keep the interval decidable — otherwise it is a one-line change that buys
            100% coverage on a service which measured nothing.
        maintenance:
          type: string
          enum: [exclude]
          description: A member inside a window leaves both numerator and denominator.
        freshness: { $ref: '#/components/schemas/FreshnessPolicy' }

    ReliabilityDurations:
      type: object
      description: Exact integer-microsecond sums of BOTH duration axes (spec 9.1).
      required: [GoodUs, BadUs, UnknownUs, ExcludedUs, HealthyUs, DegradedUs, DownUs, HealthUnknownUs]
      additionalProperties: false
      properties:
        GoodUs: { type: integer, format: int64 }
        BadUs: { type: integer, format: int64 }
        UnknownUs: { type: integer, format: int64 }
        ExcludedUs: { type: integer, format: int64 }
        HealthyUs: { type: integer, format: int64 }
        DegradedUs: { type: integer, format: int64 }
        DownUs: { type: integer, format: int64 }
        HealthUnknownUs: { type: integer, format: int64 }

    ServiceReportStatus:
      type: string
      enum: [ok, partial, unavailable, insufficient_history, insufficient_sealed_coverage]

    ReliabilitySegment:
      type: object
      description: >
        One (epoch x reconstruction-part) slice. A window spanning definition revisions is
        ONLY segments; each carries its own availability and coverage. Only the retroactive
        backfill part carries `declared_reconstruction`.
      required: [revision_id, revision, epoch_id, epoch_seq, from, to, buckets, durations, coverage, declared_reconstruction]
      properties:
        revision_id: { type: string }
        revision: { type: integer, format: int64 }
        epoch_id: { type: string }
        epoch_seq: { type: integer, format: int64 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        buckets: { type: integer, format: int64 }
        durations: { $ref: '#/components/schemas/ReliabilityDurations' }
        availability: { type: number, description: Percent (0..100); absent when nothing measured. }
        coverage: { type: number }
        declared_reconstruction: { type: boolean }

    RepairingInterval:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    ServiceBudget:
      type: object
      description: The error budget over MEASURED time, always stating its objective.
      required: [objective, objective_updated_at, allowed_downtime_ratio, actual_downtime_ratio, remaining_ratio, burned_percent, met]
      additionalProperties: false
      properties:
        objective: { type: number }
        objective_updated_at: { type: string, format: date-time }
        allowed_downtime_ratio: { type: number }
        actual_downtime_ratio: { type: number }
        remaining_ratio: { type: number }
        burned_percent: { type: number }
        met: { type: boolean }

    ServiceBurnWindow:
      type: object
      description: >
        One reporting burn window over `[sealed_through - w, sealed_through)`, carrying its
        OWN storage-continuity and coverage verdicts; a rate is quoted only when they allow
        it — never 0x from an empty or holed window, never across a definition boundary,
        never from a watermark with no real-time sealed overlap.
      required: [window, status, expected_buckets, sealed_buckets, storage_continuity, coverage]
      properties:
        window: { type: string }
        status: { $ref: '#/components/schemas/ServiceReportStatus' }
        reason: { type: string }
        expected_buckets: { type: integer, format: int64 }
        sealed_buckets: { type: integer, format: int64 }
        storage_continuity: { type: boolean }
        coverage: { type: number }
        rate: { type: number }

    ServiceWindowReport:
      type: object
      description: The spec-11 reliability answer for one service and one standard window.
      required: [service_id, window, as_of, sealed_through, from, to, status, storage_continuity, expected_buckets, sealed_buckets, coverage, durations, segments]
      properties:
        service_id: { type: string }
        window: { type: string }
        as_of: { type: string, format: date-time }
        sealed_through: { type: string, format: date-time, nullable: true }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServiceReportStatus' }
        reason: { type: string }
        storage_continuity: { type: boolean }
        expected_buckets: { type: integer, format: int64 }
        sealed_buckets: { type: integer, format: int64 }
        coverage: { type: number }
        durations: { $ref: '#/components/schemas/ReliabilityDurations' }
        availability: { type: number, description: Percent (0..100); absent across revisions, over gaps, or with nothing measured. }
        aggregate_withheld: { type: string, description: Set to `spans_definition_revisions` only when stored facts actually show more than one revision. }
        objective: { type: number }
        objective_updated_at: { type: string, format: date-time }
        budget: { $ref: '#/components/schemas/ServiceBudget' }
        burn:
          type: array
          items: { $ref: '#/components/schemas/ServiceBurnWindow' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/ReliabilitySegment' }
        repairing:
          type: array
          items: { $ref: '#/components/schemas/RepairingInterval' }
        retracted_at: { type: string, format: date-time }
        retracted_to: { type: string, format: date-time }

    ServiceHealthNow:
      type: object
      description: >
        The categorical live signal (spec 11.3, D-0164) — explicitly unstable, never a
        percentage, computed at the DB as_of instant, never from stored facts.
      required: [unstable, as_of, sli, diagnostics]
      properties:
        unstable: { type: boolean }
        as_of: { type: string, format: date-time }
        sli: { type: string, enum: [healthy, degraded, down, unknown] }
        diagnostics: { type: string, enum: [ok, failing, unknown] }
        failing_monitors:
          type: array
          items: { type: string }

    ReliabilitySeriesPoint:
      type: object
      required: [start, epoch_id, revision_id, provisional, buckets, durations]
      additionalProperties: false
      properties:
        start: { type: string, format: date-time }
        epoch_id: { type: string }
        revision_id: { type: string }
        provisional: { type: boolean }
        buckets: { type: integer, format: int64 }
        durations: { $ref: '#/components/schemas/ReliabilityDurations' }

    ServiceSeriesResponse:
      type: object
      required: [from, to, step, points]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string, enum: [hour, day] }
        points:
          type: array
          items: { $ref: '#/components/schemas/ReliabilitySeriesPoint' }

    SetServiceSLATargetRequest:
      type: object
      description: >
        Window and objective ONLY — burn fields are rejected (phase 5 owns alerting).
        Objectives live in the OPEN interval (0,100), canonical at four decimals
        (maximum 99.9999): a zero error budget is not a supported configuration (D-0165).
      required: [objective]
      additionalProperties: false
      properties:
        window: { type: string, enum: [24h, 7d, 30d, 90d], default: 30d }
        objective: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 100 }

    MonitorDelegation:
      type: object
      description: >
        FR-021 §16.1 from the MONITOR's side: which of its own alerts a service is delivering
        instead, and who. The two signals are kept apart because they are delegated apart — a
        service can be replacing DOWN transitions while its budget signal is held, and a monitor
        page that said "delegated" without saying WHICH would be worse than saying nothing.
      required: [live, burn]
      additionalProperties: false
      properties:
        live: { $ref: '#/components/schemas/MonitorSignalDelegation' }
        burn: { $ref: '#/components/schemas/MonitorSignalDelegation' }
    MonitorSignalDelegation:
      type: object
      required: [delegated]
      additionalProperties: false
      properties:
        delegated:
          type: boolean
          description: True only while this monitor's alerts for that signal are actually withheld.
        owners:
          type: array
          description: The services covering it — the chip's text.
          items:
            type: object
            required: [id, slug, name]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              name: { type: string }
        reason:
          type: string
          description: >
            Why NOT, never empty when `delegated` is false: "why is this monitor still paging" is
            the question this block exists to answer.
    ServiceSignalState:
      type: object
      description: >
        One signal's COVERAGE right now (FR-021 §16.1). A different question from the
        declaration: `owns_paging` says what an operator asked for, this says whether it is
        actually replacing anything. Read from the delivery gate's own predicates, so a badge
        rendered from it cannot disagree with what suppression decides.
      required: [armed]
      additionalProperties: false
      properties:
        armed:
          type: boolean
          description: >
            True only while a replacement for THIS signal is demonstrably able to fire and reach
            somebody. Everything ambiguous is false, because the member monitor keeps paging.
        reason:
          type: string
          description: >
            The FIRST unsatisfied clause, absent when armed. Fixed vocabulary — these are
            rendered and they name what to do about it.
          enum: [not_owned, policy_pages_nothing, state_not_pageable, never_evaluated,
                 generation_changed, revision_changed, evaluation_error, stale_lease,
                 no_enabled_target, held, rule_unevaluated, unroutable, onset_pending,
                 onset_undelivered, latch_inconsistent]
        evaluated_at:
          type: string
          format: date-time
          description: The last SUCCESSFUL evaluation; absent when there has never been one.
        lease_until:
          type: string
          format: date-time
          description: >
            The DB-clock instant that verdict stops speaking for now. Freshness is the server's
            answer and is never re-derived by a client.
        last_error:
          type: string
          description: The evaluator's own message, surfaced rather than summarized.
    ServiceAlertingState:
      type: object
      description: >
        Both signals' coverage. They are reported separately because they are ARMED separately —
        a service can be replacing DOWN pages while its budget signal is held.
      required: [live, burn]
      additionalProperties: false
      properties:
        live: { $ref: '#/components/schemas/ServiceSignalState' }
        burn: { $ref: '#/components/schemas/ServiceSignalState' }
    ServiceAlerting:
      type: object
      description: >
        The paging DECLARATION of FR-021 §16.6a, and only the declaration. Latch, lease,
        generation and episode state have no field here by construction, so no future edit can
        leak one by forgetting to redact it.
      required: [owns_paging, page_on, page_on_unknown, confirm_evaluations, renotify_seconds]
      additionalProperties: false
      properties:
        owns_paging:
          type: boolean
          default: false
          description: >
            While true, the service's SLI members stop DELIVERING their own alerts — they keep
            probing, flipping, recording and opening incidents. Suppression additionally
            requires ARMED coverage, so this switch alone silences nothing.
        page_on:
          type: array
          description: >
            The subset of {down, degraded} that notifies. Never null: `[]` is a legal
            declaration meaning "page for no state", which dis-arms live coverage.
          items: { type: string, enum: [down, degraded] }
        page_on_unknown:
          type: boolean
          default: false
          description: >
            "Tell me when you cannot SEE this service" — a different statement from "it is
            down", which is why unknown has its own switch and cannot appear in `page_on`.
        confirm_evaluations:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Consecutive evaluations a new state needs before it notifies.
        renotify_seconds:
          type: integer
          default: 0
          description: >
            Repeat the LAST escalation step every N seconds while the service's incident is
            unresolved, for a policy whose `repeat_last` is on. 0 is off and is the default, so
            adding this control changed no existing service. Otherwise 60..86400: a shorter
            cadence is a way to page somebody every few seconds by typing one number.

    PatchServiceAlertingRequest:
      type: object
      description: >
        Every field is OPTIONAL and an omitted one is UNCHANGED. `false` is a real edit, not
        absence. Server-owned fields — `alert_config_generation` and every latch, lease and
        episode column — are absent here and rejected by the decoder.
      additionalProperties: false
      properties:
        owns_paging: { type: boolean }
        page_on:
          type: array
          description: '`[]` explicitly pages for no state; omitting the field leaves it unchanged.'
          items: { type: string, enum: [down, degraded] }
        page_on_unknown: { type: boolean }
        confirm_evaluations: { type: integer, minimum: 1, maximum: 10 }
        renotify_seconds:
          type: integer
          description: '0 disables the repeat; otherwise 60..86400 seconds.'

    BurnRuleDeclaration:
      type: object
      description: >
        A burn rule as a CLIENT may state it: the four declared fields and nothing else. The
        `firing` latch of `BurnRule` is deliberately missing — it is server-owned (§16.4b) and
        a body carrying it is a 400. Two rules with the same canonical key (severity, both
        windows, threshold) are also a 400: one latch cannot answer for two rules.
      required: [long_window_seconds, short_window_seconds, threshold, severity]
      additionalProperties: false
      properties:
        long_window_seconds: { type: integer, description: 'Noise-filtering window, must exceed the short one (max 7d).' }
        short_window_seconds: { type: integer, minimum: 60, description: 'Confirmation window ("still burning right now").' }
        threshold: { type: number, format: double, exclusiveMinimum: 0, description: 'Burn-rate multiple that trips the rule (e.g. 14.4).' }
        severity: { type: string, enum: [page, ticket] }

    SetServiceBurnAlertingRequest:
      type: object
      description: >
        A full replace of one service SLA target's burn declaration. `burn_rules` is the
        complete set; omitting it declares none.
      required: [burn_alert_enabled]
      additionalProperties: false
      properties:
        window: { type: string, enum: [24h, 7d, 30d, 90d], default: 30d }
        burn_alert_enabled: { type: boolean }
        burn_rules:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/BurnRuleDeclaration' }

    ServiceBurnAlerting:
      type: object
      required: [window, burn_alert_enabled, burn_rules]
      additionalProperties: false
      properties:
        window: { type: string }
        burn_alert_enabled: { type: boolean }
        burn_rules:
          type: array
          description: >
            The stored rule set, in canonical key order, as DECLARATIONS. Not `BurnRule`: that
            schema carries `firing`, which for a service target is not even in this JSON — the
            latch is the normalized per-rule row — so echoing it would be a statement about
            state this endpoint never read.
          items: { $ref: '#/components/schemas/BurnRuleDeclaration' }

    ServiceDeclaration:
      type: object
      description: What a human declared availability to MEAN, as of `effective_at`.
      required: [revision, effective_at, created_at, monitors, sli, policies]
      additionalProperties: false
      properties:
        revision: { type: integer, format: int64 }
        effective_at:
          type: string
          format: date-time
          description: >
            The bucket boundary from which this revision applies. Always in the future at
            write time (first-adoption backfill excepted), so sealed history is never
            restated under a definition it was not measured with.
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        monitors:
          type: array
          items: { type: string, format: uuid }
          description: >
            The evaluation CONTEXT — what this service is made of. Separate from `sli` on
            purpose: collapsing them would invite a client to keep two lists in sync.
        sli:
          type: array
          items: { type: string, format: uuid }
          description: The reliability inputs. A strict subset of `monitors`.
        policies: { $ref: '#/components/schemas/ServicePolicies' }

    EvaluationEpoch:
      type: object
      description: >
        What the system was MEASURING. A fact references the epoch only, and an epoch
        resolves to exactly one definition revision.
      required: [id, seq, effective_at, snapshot_hash, members]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        effective_at: { type: string, format: date-time }
        snapshot_hash:
          type: string
          description: >
            Canonical hash of the members' evaluation semantics. An edit that cannot change
            how a member is evaluated leaves it unchanged, so renaming a monitor does not
            open an epoch.
        members: { type: integer, description: Snapshotted member count. }

    RepairRange:
      type: object
      required: [from, to, reason, state, attempts]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        reason: { type: string }
        state: { type: string }
        cursor: { type: string, format: date-time, description: How far the repair has progressed. }
        attempts: { type: integer }
        last_error: { type: string }

    ServiceMaterialization:
      type: object
      required: [repairing]
      additionalProperties: false
      properties:
        materialization_start: { type: string, format: date-time }
        sealed_through:
          type: string
          format: date-time
          description: >
            Defined by CONTIGUITY: a hole holds it back rather than being jumped over. Null
            means nothing has been sealed yet. Facts after this point are not final.
        retracted_at: { type: string, format: date-time }
        retracted_to: { type: string, format: date-time }
        repairing:
          type: array
          items: { $ref: '#/components/schemas/RepairRange' }
          description: >
            Ranges whose numbers are not currently trustworthy. Always present (empty, never
            null) so a client need not branch. Render as repairing, never as data.

    ServiceDetail:
      type: object
      required: [service, declaration, epoch, materialization, reliability, supersedes, sla_targets]
      additionalProperties: false
      properties:
        service: { $ref: '#/components/schemas/Service' }
        declaration:
          allOf: [ { $ref: '#/components/schemas/ServiceDeclaration' } ]
          nullable: true
          description: Null when nothing has been declared — the service then reports no availability, not 100%.
        epoch:
          allOf: [ { $ref: '#/components/schemas/EvaluationEpoch' } ]
          nullable: true
        materialization: { $ref: '#/components/schemas/ServiceMaterialization' }
        reliability:
          nullable: true
          description: >
            ALWAYS NULL, and it stays that way by design — not because the numbers are
            missing. SLO, error budget and burn rate live on
            `GET …/services/{serviceID}/reliability`, which carries them together with the
            honesty they require: the window's status and reason, storage continuity,
            decidable coverage, per-revision segments and the seal watermark they were
            computed from. A bare number on THIS object would have none of that context, and
            a zero a client could render as a number is exactly the confident falsehood this
            feature exists to prevent. (Phase 2 shipped in iter-0144; this field predates it
            and is kept so the shape of the detail response does not change.)
        alerting_state:
          allOf: [ { $ref: '#/components/schemas/ServiceAlertingState' } ]
          description: >
            What the declaration is currently producing. Absent when the read could not be
            served — a coverage nobody measured is not reported as absent coverage.
        alerting:
          allOf: [ { $ref: '#/components/schemas/ServiceAlerting' } ]
          description: >
            The §16.6a paging declaration. ABSENT (rather than defaulted) when the alerting
            read degraded: a declaration a UI renders as "pages for down" because a read
            failed is worse than no block at all. Write it at
            `PATCH …/services/{serviceID}/alerting`.
        dependencies:
          allOf: [ { $ref: '#/components/schemas/ServiceGraph' } ]
          nullable: true
          description: >
            The phase-3 impact-graph block: both directions with batched neighbour health.
            Absent when the graph read degraded.
        supersedes:
          type: array
          description: >
            The composites this service now expresses (FR-021 §15.5), read from the SAME single
            column the monitor side reads — there is no second fact to keep in step. A converted
            composite appears at full strength: still probing, still alerting, and carrying its own
            retired_at, so the UI never infers a lifecycle from `enabled`, which an afternoon's
            disable also clears. A read failure leaves the list empty rather than failing the detail.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              type: { type: string }
              enabled: { type: boolean }
              retired_at: { type: string, format: date-time, nullable: true }
        sla_targets:
          type: array
          description: >
            The service's SLO target inventory (FR-024 AC-0163-8): the reliability-gate policy
            editor offers ONLY these windows. Canonical window order (24h, 7d, 30d, 90d); an
            empty array when none is declared — never null, never omitted. Written one window
            at a time at `PUT …/services/{serviceID}/sla-target`.
          items: { $ref: '#/components/schemas/ServiceSLATarget' }

    ServiceSLATarget:
      type: object
      description: One declared service-scoped objective — the window it applies to and when it was last set.
      required: [window, objective, updated_at]
      additionalProperties: false
      properties:
        window: { type: string, enum: [24h, 7d, 30d, 90d] }
        objective: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 100 }
        updated_at: { type: string, format: date-time }

    PutDeclarationRequest:
      type: object
      required: [expected_revision, monitors, sli]
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          description: The revision the caller observed; 0 means "no declaration yet". A mismatch is 409.
        monitors:
          type: array
          items: { type: string, format: uuid }
        sli:
          type: array
          items: { type: string, format: uuid }
        policies: { $ref: '#/components/schemas/ServicePolicies' }
        backfill_from:
          type: string
          format: date-time
          description: >
            Makes the FIRST declaration retroactive, adopting existing history. What it
            produces is a DECLARED RECONSTRUCTION evaluated with today's members — not
            evidence about how they were configured then — and the UI must label it as such.
            Allowed on the first revision only.

    ProjectSecret:
      type: object
      description: >
        One project-inventory secret: names and metadata only. Values are
        write-only and never appear in any API response.
      required: [id, name, created_at, rotated_at, used_by]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', maxLength: 63, description: Slug, unique within the project. }
        created_at: { type: string, format: date-time }
        rotated_at: { type: string, format: date-time, nullable: true, description: Last time the value was rotated; null if never. }
        used_by:
          type: object
          description: Monitor-setting references pointing at this secret.
          required: [total, file_managed]
          additionalProperties: false
          properties:
            total: { type: integer }
            file_managed: { type: integer, description: References owned by a Monitoring-as-Code file provider. }
    CreateSecretRequest:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', maxLength: 63, description: Slug, unique within the project. }
        value: { type: string, format: password, writeOnly: true, minLength: 1, description: 'Secret value, ≤ 4096 UTF-8 bytes; never returned.' }
    UpdateSecretRequest:
      type: object
      description: At least one of `name` (rename) or `value` (rotate) is required.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', maxLength: 63, description: New slug (rename). }
        value: { type: string, format: password, writeOnly: true, minLength: 1, description: 'New value (rotate), ≤ 4096 UTF-8 bytes; never returned.' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: Email of the local account. }
        password: { type: string, format: password }
        totp: { type: string, description: 'TOTP code or a recovery code, required when 2FA is enabled.' }
    TOTPEnrollResponse:
      type: object
      properties:
        secret: { type: string, description: Base32 TOTP secret to enter manually. }
        uri: { type: string, description: 'otpauth:// URI for authenticator apps (QR).' }
    TOTPEnableRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Current 6-digit code from the authenticator. }
    TOTPEnableResponse:
      type: object
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: Single-use recovery codes, shown only once.
    TOTPDisableRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, description: Account password, re-verified before disabling 2FA. }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        oidc_sub: { type: string }
        email: { type: string }
        display_name: { type: string }
        is_global_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserMembership:
      type: object
      properties:
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            auth_type:
              type: string
              enum: [local, oidc, both, none]
              description: How the account can sign in (password, OIDC, or both).
            last_active_at: { type: string, format: date-time, nullable: true }
            memberships:
              type: array
              description: Empty for users outside any organization.
              items: { $ref: '#/components/schemas/AdminUserMembership' }
    Subscriber:
      type: object
      properties:
        id: { type: string, format: uuid }
        status_page_id: { type: string, format: uuid }
        email: { type: string }
        confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ToggleEnabled:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    UpdateAdminUser:
      type: object
      required: [is_global_admin]
      properties:
        is_global_admin: { type: boolean }
    BuildInfo:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        go_version: { type: string }
    Me:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        totp_enabled: { type: boolean, description: Whether two-factor authentication is active for this account. }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateOrganization:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProject:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_email: { type: string }
        actor_name: { type: string }
        via_token: { type: boolean }
        action: { type: string, description: 'e.g. member.add, member.role_change, member.remove, token.create, token.delete' }
        target: { type: string }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      description: A membership enriched with the user's identity for the members UI.
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
        email: { type: string }
        display_name: { type: string }
        last_active_at: { type: string, format: date-time, nullable: true, description: 'Most recent session; absent if never signed in.' }
    AddMember:
      type: object
      required: [role]
      description: Identify the member by user_id or email (the user must have signed in at least once).
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, description: 'Alternative to user_id; resolved to an existing user.' }
        project_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
    UpdateMember:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [org_admin, project_admin, editor, viewer]
    Monitor:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: >
            Project-unique and immutable. This is the name a bundle and a service declaration
            reference, so it stays stable while `name` is free to change.
        type: { type: string, enum: [http, tcp, icmp, dns, tls, grpc, composite, postgres, mysql, redis, promql, rabbitmq, websocket, ssh, synthetic, push] }
        target: { type: string }
        method: { type: string, enum: [GET, POST, HEAD, PUT, DELETE], description: 'HTTP request method (http monitors).' }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        retries: { type: integer }
        failure_threshold: { type: integer, description: 'Consecutive failed checks before "down" (confirmations); default 1.' }
        confirm_interval_seconds: { type: integer, description: 'Accelerated probe interval while confirming a failure (first fail → verdict). 0 = off; clamped to [5, interval]; effective with failure_threshold > 1.' }
        depends_on:
          type: array
          items: { type: string, format: uuid }
          description: 'Parent monitors (same project). While any transitive parent is down, alerts for this monitor are suppressed; data keeps recording. Must stay acyclic.'
        consecutive_failures: { type: integer, readOnly: true, description: 'Live confirmation counter ("confirming N/M" when > 0 and status is up).' }
        renotify_seconds: { type: integer, description: 'Re-send the down alert every N seconds while down (0 = off).' }
        grace_seconds: { type: integer, description: 'Push monitors: extra tolerance beyond the interval before "down".' }
        conditions: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: 'Free-form labels (env:prod, team:x) for filtering.' }
        region: { type: string, description: 'Worker-pool region that probes this monitor; default core. Composite monitors must be core.' }
        config: { type: object, additionalProperties: { type: string }, description: 'Per-type config; for composite: {children:"id1,id2", mode:"all|any"}.' }
        enabled: { type: boolean }
        auto_incident: { type: boolean, description: 'When true, an incident opens automatically when this monitor goes down.' }
        escalation_policy_id: { type: string, description: 'On-call escalation policy for down alerts. Empty = flat notification to all linked channels.' }
        status: { type: string, enum: [pending, up, down] }
        push_token: { type: string, description: 'Set for push monitors; the secret in their heartbeat URL.' }
        last_probe_error_reason:
          type: string
          readOnly: true
          enum: [no_dispatch_key, unknown_key_id, decrypt_auth_failed, unsupported_version]
          description: 'Latest executor credential-envelope failure. Diagnostic only; never changes target liveness.'
        last_probe_error_at:
          type: string
          format: date-time
          readOnly: true
          description: 'Server time of the latest credential-envelope diagnostic.'
        management:
          $ref: '#/components/schemas/MonitorManagement'
        delegation:
          allOf: [ { $ref: '#/components/schemas/MonitorDelegation' } ]
          description: >
            Detail only, and best-effort: a lookup that cannot conclude leaves this ABSENT rather
            than reporting "not delegated", which would be a claim rather than an absence.
        superseded_by_service_id: { type: string, format: uuid, description: 'The service that now expresses what this monitor expresses (FR-021 §15.5). An ANNOTATION — the monitor keeps probing, alerting and holding its own history.' }
        retired_at: { type: string, format: date-time, nullable: true, description: 'Set when an operator ended this monitor''s working life. ALWAYS accompanied by enabled=false, because retired_at alone stops nothing: the scheduler, dead-man, ingest and SLO paths key on enabled.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MonitorManagement:
      type: object
      description: 'Read-only source provenance (FR-017). A file-managed monitor is read-only through normal CRUD (409 managed_by_file); an ordinary monitor reports source=ui.'
      properties:
        source: { type: string, enum: [ui, file] }
        provider: { type: string, description: 'File provider name (source=file).' }
        uid: { type: string, description: 'Source UID within the bundle (source=file).' }
        path: { type: string, description: 'Tenant-safe RELATIVE bundle path (never an absolute filesystem path).' }
        read_only: { type: boolean, description: 'True when declarative fields cannot be edited via CRUD.' }
    FileProviderDiagnostic:
      type: object
      description: 'One file-provider bundle status (tenant-safe; relative path only).'
      properties:
        provider: { type: string }
        organization: { type: string, description: 'Organization slug.' }
        project: { type: string, description: 'Project slug.' }
        path: { type: string, description: 'Relative source path.' }
        generation: { type: integer, format: int64 }
        status: { type: string, enum: [pending, applied, rejected, error, degraded] }
        last_error: { type: string }
        applied_at: { type: string, format: date-time }
    FileProviderRuntimeStatus:
      type: object
      description: >
        One configured file provider as seen live by THIS api process (§15). Process-local:
        leadership and scan times reflect this replica only (a follower reports leader=false).
        Configured-but-idle providers appear too (registered before their first reconcile).
      properties:
        provider: { type: string, description: 'Provider name from config.' }
        scope_type: { type: string, enum: [instance, organization, project] }
        scope_org: { type: string, description: 'Organization slug for organization/project-scoped providers.' }
        scope_project: { type: string, description: 'Project slug for project-scoped providers.' }
        leader: { type: boolean, description: 'Whether this process currently holds the provider leader lock.' }
        last_scan_unix: { type: integer, format: int64, description: 'Unix seconds of the last reconcile attempt (0 = never).' }
        last_success_unix: { type: integer, format: int64, description: 'Unix seconds of the last successful generation (sticky; 0 = never).' }
        last_error: { type: string, description: 'Bounded reason of the last rejection this scan.' }
        managed_monitors: { type: integer, description: 'Monitors currently managed by this provider.' }
        orphaned_monitors: { type: integer, description: 'Monitors orphaned (source removed, retained).' }
        bundle_errors: { type: integer, description: 'Bundles rejected in the last scan.' }
    CreateMonitor:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [http, tcp, icmp, dns, tls, grpc, composite, postgres, mysql, redis, promql, rabbitmq, websocket, ssh, synthetic, push] }
        target: { type: string }
        method: { type: string, enum: [GET, POST, HEAD, PUT, DELETE], description: 'HTTP request method; defaults to GET.' }
        interval_seconds: { type: integer, default: 60 }
        timeout_seconds: { type: integer, default: 10 }
        retries: { type: integer, default: 0 }
        failure_threshold: { type: integer, default: 1, description: 'Consecutive failed checks before "down".' }
        confirm_interval_seconds: { type: integer, default: 10, description: 'Faster probes while confirming a failure. 0 = off; clamped to [5, interval].' }
        depends_on:
          type: array
          items: { type: string, format: uuid }
          description: 'Parent monitors of the same project; cycles are rejected (400).'
        renotify_seconds: { type: integer, default: 0, description: 'Re-send the down alert every N seconds while down (0 = off).' }
        grace_seconds: { type: integer, default: 0, description: 'Push monitors: extra tolerance beyond the interval.' }
        conditions:
          type: array
          items: { type: string }
          example: ["[STATUS] == 200", "[RESPONSE_TIME] < 500"]
        tags: { type: array, items: { type: string }, description: 'Free-form labels (env:prod, team:x) for filtering.' }
        region: { type: string, description: 'Worker-pool region that probes this monitor; default core. Composite monitors must be core.' }
        config: { type: object, additionalProperties: { type: string }, description: 'Per-type config; for composite: {children:"id1,id2", mode:"all|any"}.' }
        enabled: { type: boolean, default: true }
        auto_incident: { type: boolean, default: true, description: 'Open an incident automatically when this monitor goes down.' }
        escalation_policy_id: { type: string, description: 'On-call escalation policy for down alerts (requires auto_incident). Empty = flat notification.' }
    UpdateMonitor:
      type: object
      description: Partial update; omitted fields are unchanged. Type is immutable.
      properties:
        name: { type: string }
        target: { type: string }
        method: { type: string, enum: [GET, POST, HEAD, PUT, DELETE] }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        retries: { type: integer }
        failure_threshold: { type: integer }
        confirm_interval_seconds: { type: integer }
        depends_on:
          type: array
          items: { type: string, format: uuid }
        renotify_seconds: { type: integer }
        grace_seconds: { type: integer }
        conditions: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: 'Free-form labels (env:prod, team:x) for filtering.' }
        region: { type: string, description: 'Worker-pool region that probes this monitor; default core. Composite monitors must be core.' }
        config: { type: object, additionalProperties: { type: string }, description: 'Per-type config; for composite: {children:"id1,id2", mode:"all|any"}.' }
        enabled: { type: boolean }
        auto_incident: { type: boolean }
        escalation_policy_id: { type: string }
    Heartbeat:
      type: object
      properties:
        monitor_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        up: { type: boolean }
        latency_ms: { type: integer, format: int64 }
        code: { type: integer }
        msg: { type: string }
    WindowSLA:
      type: object
      properties:
        window: { type: string, enum: ['24h', '7d', '30d', '90d'] }
        total: { type: integer, format: int64 }
        up: { type: integer, format: int64 }
        uptime_percent: { type: number, format: double }
        avg_latency_ms: { type: number, format: double }
        p95_latency_ms: { type: number, format: double }
        objective: { type: number, format: double, nullable: true }
        error_budget: { $ref: '#/components/schemas/ErrorBudget' }
        burn_alert: { type: boolean, description: 'Burn-rate alerting is enabled for this window.' }
        burn_firing: { type: boolean, description: 'At least one burn rule is currently firing.' }
        burn_rules:
          type: array
          items: { $ref: '#/components/schemas/BurnRule' }
    ErrorBudget:
      type: object
      properties:
        objective: { type: number, format: double }
        allowed_downtime_ratio: { type: number, format: double }
        actual_downtime_ratio: { type: number, format: double }
        remaining_ratio: { type: number, format: double }
        burned_percent: { type: number, format: double }
        met: { type: boolean }
    MonitorSLA:
      type: object
      properties:
        monitor_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, up, down] }
        windows: { type: array, items: { $ref: '#/components/schemas/WindowSLA' } }
    DailyAvailability:
      type: object
      properties:
        day: { type: string, format: date-time }
        up: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        uptime_percent: { type: number, format: double }
    GateClauseAssignment:
      type: string
      enum: [block, warn, ignore]
      description: What a policy declares about one clause (FR-024 D11). An ignored clause is evaluated for evidence and decides nothing.
    GateClauses:
      type: object
      description: >
        Every clause of the schema version, each exactly once (FR-024 D11, D14). Version 1's set is
        the five below; a write missing one, naming an unknown one, or naming one twice is refused
        by name.
      required: [budget_exhausted, budget_consumed, page_burn_firing, ticket_burn_firing, service_incident_open]
      additionalProperties: false
      properties:
        budget_exhausted: { $ref: '#/components/schemas/GateClauseAssignment' }
        budget_consumed: { $ref: '#/components/schemas/GateClauseAssignment' }
        page_burn_firing: { $ref: '#/components/schemas/GateClauseAssignment' }
        ticket_burn_firing: { $ref: '#/components/schemas/GateClauseAssignment' }
        service_incident_open: { $ref: '#/components/schemas/GateClauseAssignment' }
    GatePolicy:
      type: object
      description: A service's live gate policy as stored (FR-024 D13a).
      required: [schema_version, window, clauses, budget_consumed_percent, max_seal_lag_seconds, unknown_behavior, revision, updated_at, updated_by]
      additionalProperties: false
      properties:
        schema_version: { type: integer, description: The clause vocabulary version; 1 is the only known one. }
        window: { type: string, enum: [24h, 7d, 30d, 90d], description: The SLO window every budget and burn clause is evaluated against (D2). }
        clauses: { $ref: '#/components/schemas/GateClauses' }
        budget_consumed_percent: { type: integer, minimum: 1, maximum: 100, description: The `budget_consumed` clause's threshold over `burned_percent` (D3). }
        max_seal_lag_seconds: { type: integer, minimum: 300, maximum: 86400, description: Whole minutes; beyond it every budget clause is UNAVAILABLE with `seal_stale` (D8a). }
        unknown_behavior: { type: string, enum: [warn, block], description: The action an UNKNOWN state resolves to (D5). Mandatory, no default. }
        revision: { type: integer, format: int64, description: DB-owned generation, never reused. }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, description: The writer's immutable audit label. }
    GatePolicyWrite:
      type: object
      description: >
        The PUT body — the whole document, nothing filled in server-side (FR-024 D11, D13a, D14).
        `expected_revision` is required: `null` claims nothing is configured.
      required: [expected_revision, schema_version, window, clauses, budget_consumed_percent, max_seal_lag_seconds, unknown_behavior]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, format: int64, minimum: 0, nullable: true }
        schema_version: { type: integer }
        window: { type: string, enum: [24h, 7d, 30d, 90d] }
        clauses: { $ref: '#/components/schemas/GateClauses' }
        budget_consumed_percent: { type: integer, minimum: 1, maximum: 100 }
        max_seal_lag_seconds: { type: integer, minimum: 300, maximum: 86400 }
        unknown_behavior: { type: string, enum: [warn, block] }
    GateOverride:
      type: object
      description: The ACTIVE override (FR-024 D13a `GET …/gate/override`).
      required: [id, reason, expires_at, created_at, actor_label, policy_revision]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        actor_label: { type: string, description: The creator's immutable label — `token:<name>` for an API token. }
        policy_revision: { type: integer, format: int64, description: The policy revision the override is bound to. }
    GateOverrideRecord:
      type: object
      description: >
        One override with its read-time status and both attribution triples (FR-024 D13a). EVERY
        field is always present; the closure fields are null while active, the three revoker
        attribution fields are null for a system closure.
      required: [id, reason, expires_at, created_at, policy_revision, actor_label, actor_user_id, via_token, status, revoked_at, revoked_reason, revoked_by_label, revoked_by_user_id, revoked_via_token]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        policy_revision: { type: integer, format: int64 }
        actor_label: { type: string }
        actor_user_id: { type: string, format: uuid, nullable: true, description: Null for an API-token actor (`via_token` true). }
        via_token: { type: boolean }
        status: { type: string, enum: [active, expired, revoked, inert] }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_reason: { type: string, enum: [manual, expired, policy_changed, policy_deleted], nullable: true }
        revoked_by_label: { type: string, nullable: true, description: Present only for a `manual` closure. }
        revoked_by_user_id: { type: string, format: uuid, nullable: true, description: Null for a token revoker even when `revoked_by_label` is set. }
        revoked_via_token: { type: boolean, nullable: true }
    GateOverrideCreate:
      type: object
      description: The POST body (FR-024 D9). No `action`, no actor — both are refused as unknown fields.
      required: [policy_revision, reason, expires_at]
      additionalProperties: false
      properties:
        policy_revision: { type: integer, format: int64, description: Must be the live policy revision, else 409 `revision_conflict`. }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expires_at: { type: string, format: date-time, description: After the database's now() and at most 7 days ahead. }
    GateReason:
      type: object
      description: >
        One `reasons[]` entry (FR-024 D4, D7): a clause that matched (`code` names the match,
        `value` what it saw) or that was UNAVAILABLE (`code` is the unavailability —
        `budget_withheld`, `seal_stale`, `facts_stale`, `no_objective`, `window_target_missing`,
        `never_sealed`, `never_evaluated`, `no_governing_revision`), or the whole-decision
        `not_configured` with a `docs` link. Only `code` is always present.
      required: [code]
      properties:
        code: { type: string }
        clause: { type: string, enum: [budget_exhausted, budget_consumed, page_burn_firing, ticket_burn_firing, service_incident_open] }
        assignment: { $ref: '#/components/schemas/GateClauseAssignment' }
        value: { description: What the clause saw — a number, a rule key, an incident id. }
        source: { type: string, description: The owner the fact came from. }
        docs: { type: string, format: uri }
    GateDecision:
      type: object
      description: >
        The D7 response and, column for column, one ledger row (FR-024 D7, D10). The presence
        contract: the five required fields always; `action` and `unoverridden_action` for every
        state but `NOT_CONFIGURED`; `policy_revision`, `window`, `unknown_behavior`,
        `max_seal_lag_seconds` when a policy exists; `target_id`, `objective`,
        `objective_updated_at` when the window's target exists; `sealed_through`, `seal_lag`,
        `fact_revisions` when any fact has been sealed; `governing_revision` when a declaration
        governs; `burn_leases` one per rule of the target; `coverage_lease_until`,
        `coverage_state` when the service has been evaluated; `override` and `override_id` when
        one was applied; `facts_fresh_until` when a decision-constraining horizon exists. Absent
        means "does not apply"; `service_id` is present and null once the service is deleted.
        There is no `valid_until`.
      required: [schema_version, decision_id, evaluated_at, service_id, service_slug, service_name, state, reasons]
      properties:
        schema_version: { type: integer }
        decision_id: { type: string, format: uuid }
        evaluated_at: { type: string, format: date-time, description: The one snapshot instant (D6a). }
        service_id: { type: string, format: uuid, nullable: true }
        service_slug: { type: string }
        service_name: { type: string }
        state: { type: string, enum: [ALLOW, WARN, BLOCK, UNKNOWN, NOT_CONFIGURED], description: What was OBSERVED. }
        action: { type: string, enum: [ALLOW, WARN, BLOCK], description: What the pipeline should do. Absent for NOT_CONFIGURED. }
        unoverridden_action: { type: string, enum: [ALLOW, WARN, BLOCK], description: The action without the override, when one was applied. }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/GateReason' }
        policy_revision: { type: integer, format: int64 }
        window: { type: string }
        unknown_behavior: { type: string, enum: [warn, block] }
        max_seal_lag_seconds: { type: integer }
        override_id: { type: string, format: uuid }
        override:
          type: object
          required: [id, actor_label, reason, expires_at]
          properties:
            id: { type: string, format: uuid }
            actor_label: { type: string }
            reason: { type: string }
            expires_at: { type: string, format: date-time }
        target_id: { type: string, format: uuid }
        objective: { type: number, format: double }
        objective_updated_at: { type: string, format: date-time }
        sealed_through: { type: string, format: date-time, description: The end of the sealed data the budget rests on (D8). }
        seal_lag: { type: number, format: double, description: Seconds from `sealed_through` to `evaluated_at` (D8a). }
        fact_revisions:
          type: object
          description: The complete surviving evidence about the definition revisions the sealed facts were computed under (§5a).
          required: [count, first_id, last_id, digest]
          properties:
            count: { type: integer }
            first_id: { type: string, nullable: true }
            last_id: { type: string, nullable: true }
            digest: { type: string, description: SHA-256 over the sorted ids. }
        governing_revision:
          type: object
          required: [id, revision]
          properties:
            id: { type: string, format: uuid }
            revision: { type: integer, format: int64 }
        burn_leases:
          type: array
          items:
            type: object
            required: [rule_key, severity, firing, last_verdict, evaluated_at, lease_until, fresh]
            properties:
              rule_key: { type: string }
              severity: { type: string, enum: [page, ticket] }
              firing: { type: boolean, nullable: true }
              last_verdict: { type: string, nullable: true }
              evaluated_at: { type: string, format: date-time, nullable: true }
              lease_until: { type: string, format: date-time, nullable: true }
              fresh: { type: boolean }
        coverage_lease_until: { type: string, format: date-time }
        coverage_state:
          type: object
          description: Both signals' coverage as EVIDENCE — never a clause (D11).
          required: [live, burn]
          properties:
            live: { $ref: '#/components/schemas/GateCoverageSignal' }
            burn: { $ref: '#/components/schemas/GateCoverageSignal' }
        facts_fresh_until: { type: string, format: date-time, description: When the facts this decision RESTS ON go stale — not a lifetime of the decision (D7). }
    GateCoverageSignal:
      type: object
      required: [armed]
      properties:
        armed: { type: boolean }
        reason: { type: string }
    GateDecisionSummary:
      type: object
      description: >
        One ledger listing item (FR-024 §5): a strict projection of GateDecision with the same
        presence rules — `action` and `policy_revision` exactly when `state ≠ NOT_CONFIGURED`,
        `override_id` exactly when an override was applied, `service_id` present and null once the
        service is deleted.
      required: [schema_version, decision_id, evaluated_at, service_id, service_slug, service_name, state, reasons]
      additionalProperties: false
      properties:
        schema_version: { type: integer }
        decision_id: { type: string, format: uuid }
        evaluated_at: { type: string, format: date-time }
        service_id: { type: string, format: uuid, nullable: true }
        service_slug: { type: string }
        service_name: { type: string }
        state: { type: string, enum: [ALLOW, WARN, BLOCK, UNKNOWN, NOT_CONFIGURED] }
        action: { type: string, enum: [ALLOW, WARN, BLOCK] }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/GateReason' }
        policy_revision: { type: integer, format: int64 }
        override_id: { type: string, format: uuid }
    GateDecisionList:
      type: object
      description: One page of the ledger (FR-024 §5); `next_cursor` is null on the last page.
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GateDecisionSummary' }
        next_cursor: { type: string, nullable: true }
    ChangeKind:
      type: string
      enum: [deploy, rollback, flag]
      description: Closed (FR-025 D2). A configuration change is a `deploy` with a `ref` (D-0209).
    ChangePhaseName:
      type: string
      enum: [started, succeeded, failed, cancelled]
      description: Closed (FR-025 D2, D3) — `started` then exactly one of the three terminals.
    ChangeRecord:
      type: object
      description: >
        The POST …/changes body (FR-025 D2). Strict: no actor field, nothing beyond these. Text
        fields are normalized (NFC, trimmed) by the server before validation.
      required: [kind, phase, source, external_id]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/ChangeKind' }
        phase: { $ref: '#/components/schemas/ChangePhaseName' }
        source: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: The reporting system, a slug. }
        external_id: { type: string, minLength: 1, maxLength: 128, description: The run or flip id under which phases group; case-sensitive after NFC. }
        ref: { type: string, maxLength: 128, description: An opaque version or commit label; never interpreted. }
        url: { type: string, maxLength: 512, description: '`https://` with a host only; `http://` is refused (`url_invalid`).' }
        occurred_at: { type: string, format: date-time, description: Defaults to the server clock; bounded by `change.max_past` / `change.max_future` against the database clock. }
        decision_id: { type: string, format: uuid, description: A gate decision of THIS service in THIS project, else 400 `decision_unknown`. }
    ChangePhase:
      type: object
      description: >
        One phase row of a change as every change response nests it (FR-025 §5, D5): the row id,
        the phase, its instant, `ref`/`url`, the decision link when one was given, and the actor
        triple — `actor_user_id` is ALWAYS present and null for an API token (`via_token` true).
      required: [id, phase, occurred_at, ref, url, actor_label, actor_user_id, via_token, recorded_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/ChangePhaseName' }
        occurred_at: { type: string, format: date-time }
        ref: { type: string }
        url: { type: string }
        decision_id: { type: string, format: uuid, description: Present only when the phase carried one. }
        actor_label: { type: string, description: The immutable label — `token:<name>` for an API token. }
        actor_user_id: { type: string, format: uuid, nullable: true }
        via_token: { type: boolean }
        recorded_at: { type: string, format: date-time }
    ChangeRow:
      description: A phase row WITH its identity — where the row stands alone (the record response, the incident route's anchored change).
      allOf:
        - $ref: '#/components/schemas/ChangePhase'
        - type: object
          required: [service_id, source, external_id, kind]
          properties:
            service_id: { type: string, format: uuid }
            source: { type: string }
            external_id: { type: string }
            kind: { $ref: '#/components/schemas/ChangeKind' }
    ChangeRecordResult:
      type: object
      description: POST …/changes' answer, the same shape for 201 and 200 (FR-025 D3).
      required: [replayed, change]
      additionalProperties: false
      properties:
        replayed: { type: boolean, description: True for an identical replay — `change` is then the ORIGINAL row. }
        change: { $ref: '#/components/schemas/ChangeRow' }
    ChangeDecisionLink:
      type: object
      description: >
        A group's gate decision read back by id (FR-025 D11). A LIVE ledger row is `{decision_id,
        state, action?, overridden}` — `action` absent for a NOT_CONFIGURED decision, as the gate's
        own response; an aged-out row is `{decision_id, aged_out: true}`.
      required: [decision_id]
      additionalProperties: false
      properties:
        decision_id: { type: string, format: uuid }
        state: { type: string, enum: [ALLOW, WARN, BLOCK, UNKNOWN, NOT_CONFIGURED] }
        action: { type: string, enum: [ALLOW, WARN, BLOCK] }
        overridden: { type: boolean }
        aged_out: { type: boolean, description: Present (true) only when the ledger row is gone. }
    ChangeIncidentLink:
      type: object
      description: One incident this change PRECEDED (FR-025 D7) — the change side of `incident_changes`. Never "caused".
      required: [incident_id, opened_at, role, lag_seconds, change_id]
      additionalProperties: false
      properties:
        incident_id: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
        role: { type: string, enum: [own_service, upstream] }
        lag_seconds: { type: integer, format: int64, description: '`opened_at − occurred_at` of the anchored phase, copied at the open, never updated.' }
        change_id: { type: string, format: uuid, description: The anchored phase row. }
    ChangeGroup:
      type: object
      description: >
        One timeline item (FR-025 D6): the identity, the kind, `ref`/`url` of the LATEST phase,
        `latest_occurred_at` (the group key's instant), every phase nested in the domain's order,
        `decision` ABSENT when none was given, `incidents` ALWAYS an array.
      required: [source, external_id, kind, ref, url, latest_occurred_at, phases, incidents]
      additionalProperties: false
      properties:
        source: { type: string }
        external_id: { type: string }
        kind: { $ref: '#/components/schemas/ChangeKind' }
        ref: { type: string }
        url: { type: string }
        latest_occurred_at: { type: string, format: date-time }
        phases:
          type: array
          items: { $ref: '#/components/schemas/ChangePhase' }
        decision: { $ref: '#/components/schemas/ChangeDecisionLink' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/ChangeIncidentLink' }
    ChangeGroupList:
      type: object
      description: One page of the timeline (FR-025 D6); `next_cursor` is null on the last page.
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChangeGroup' }
        next_cursor: { type: string, nullable: true }
    ChangeCompareSide:
      type: object
      description: >
        One side of the comparison over `[from, to)` (FR-025 D8, D-0211), EXACTLY ONE of three
        shapes: a FIGURE (the six numbers), WITHHELD (`withheld` + `detail` when the reason is
        `undecidable`), or PENDING (`pending: true` + `sealed_through`) — either side may be pending.
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        availability: { type: number, format: double, description: Percent, the page's own arithmetic. }
        good_seconds: { type: number, format: double }
        bad_seconds: { type: number, format: double }
        unknown_seconds: { type: number, format: double }
        excluded_seconds: { type: number, format: double }
        buckets: { type: integer, format: int64, description: Sealed canonical buckets summed. }
        withheld: { type: string, enum: [definition_changed, undecidable, no_facts] }
        detail: { type: string, description: The reliability page's own reason string, for `undecidable`. }
        pending: { type: boolean, description: The side's end lies past `sealed_through`; no partial figure. }
        sealed_through: { type: string, format: date-time, description: Stated with `pending`. }
    ChangeCompare:
      type: object
      description: >
        GET …/changes/compare (FR-025 D8): the identity, the terminal phase the comparison rests on,
        T (floored to the canonical bucket), the horizon in the request's spelling, `sealed_through`
        (null when nothing is sealed), the snapshot instant, both sides, and `delta` (after − before,
        availability points) ONLY when both sides are figures. Nothing is stored or cached.
      required: [source, external_id, kind, ref, change_id, terminal_phase, t, horizon, sealed_through, as_of, before, after]
      additionalProperties: false
      properties:
        source: { type: string }
        external_id: { type: string }
        kind: { $ref: '#/components/schemas/ChangeKind' }
        ref: { type: string }
        change_id: { type: string, format: uuid, description: The terminal phase row. }
        terminal_phase: { type: string, enum: [succeeded, failed, cancelled] }
        t: { type: string, format: date-time }
        horizon: { type: string, enum: ['15m', '1h', '6h', '24h'] }
        sealed_through: { type: string, format: date-time, nullable: true }
        as_of: { type: string, format: date-time, description: The one snapshot instant both sides were read at. }
        before: { $ref: '#/components/schemas/ChangeCompareSide' }
        after: { $ref: '#/components/schemas/ChangeCompareSide' }
        delta: { type: number, format: double }
    IncidentChange:
      type: object
      description: >
        One change that PRECEDED an incident, from the incident side (FR-025 D7): the anchored phase
        with identity, the role, the copied instant and lag, when the link was computed, and the
        group's CURRENT phases read live.
      required: [change, role, occurred_at, lag_seconds, computed_at, phases]
      additionalProperties: false
      properties:
        change: { $ref: '#/components/schemas/ChangeRow' }
        role: { type: string, enum: [own_service, upstream] }
        occurred_at: { type: string, format: date-time }
        lag_seconds: { type: integer, format: int64 }
        computed_at: { type: string, format: date-time }
        phases:
          type: array
          items: { $ref: '#/components/schemas/ChangePhase' }
    IncidentChanges:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IncidentChange' }
    ProjectSLA:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        windows: { type: array, items: { $ref: '#/components/schemas/WindowSLA' } }
        sla_report_weekly: { type: boolean, description: 'Weekly SLA report is enabled for this project.' }
    BurnRule:
      type: object
      description: >
        One multi-window burn-rate rule (Google SRE): fires when the error-budget
        burn rate is at/over threshold in BOTH windows. firing is server-owned.
      required: [long_window_seconds, short_window_seconds, threshold, severity]
      properties:
        long_window_seconds: { type: integer, description: 'Noise-filtering window, must exceed the short one (max 7d).' }
        short_window_seconds: { type: integer, minimum: 60, description: 'Confirmation window ("still burning right now").' }
        threshold: { type: number, format: double, description: 'Burn-rate multiple that trips the rule (e.g. 14.4).' }
        severity: { type: string, enum: [page, ticket] }
        firing: { type: boolean, readOnly: true, description: 'Edge latch; ignored on input.' }
    SLATarget:
      type: object
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        objective: { type: number, format: double }
        window: { type: string }
        burn_alert_enabled: { type: boolean }
        burn_rules:
          type: array
          items: { $ref: '#/components/schemas/BurnRule' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SetSLATarget:
      type: object
      required: [objective]
      properties:
        objective: { type: number, format: double, exclusiveMinimum: 0, exclusiveMaximum: 100, description: 'Target uptime percent in the OPEN (0,100), canonical at four decimals — maximum 99.9999 (D-0165).' }
        window: { type: string, enum: ['24h', '7d', '30d', '90d'], default: '30d' }
        burn_alert: { type: boolean, description: 'Enable burn-rate alerting for this objective.' }
        burn_rules:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/BurnRule' }
          description: 'Replace the rule set. Omit to keep existing rules (enabling with none seeds the SRE default pair: page 14.4x over 1h∧5m, ticket 6x over 6h∧30m).'
    MaintenanceWindow:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: 'Set when the window was archived or annulled: it left active inventory.'
        cancel_effective_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Where the window's EFFECT stops. For a window archived while active: the archive
            instant. For a window archived before it began: its own start — it never takes
            effect. Consumers must reduce LEAST(ends_at, cancel_effective_at).
    CreateMaintenance:
      type: object
      required: [starts_at, ends_at]
      properties:
        monitor_id: { type: string, format: uuid, description: 'Omit for a project-wide window.' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
        preview_id:
          type: string
          format: uuid
          description: >
            Required only when the window reaches back over sealed reliability facts; the
            token must have been issued for exactly this monitor, range and kind of change.
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid, description: 'Set for auto-incidents opened from a monitor going down.' }
        service_id: { type: string, format: uuid, description: 'The OTHER anchor (FR-022): set when the incident''s subject is a SERVICE. At most one anchor is set, enforced by a CHECK; a manual project-level incident carries neither. Absent from public status-page renders, like every internal id. Cleared — and the incident kept — when the service is deleted.' }
        external_key: { type: string, description: 'Correlation key for externally-sourced incidents (e.g. an Alertmanager fingerprint).' }
        title: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        source: { type: string, enum: [manual, api, auto] }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true, description: 'Set when acknowledged; stops on-call escalation.' }
        acknowledged_by: { type: string }
        acknowledged_by_name: { type: string, description: 'Resolved actor (detail endpoint only).' }
        escalation_step: { type: integer, description: 'How many escalation steps have fired (0 = none yet).' }
        last_escalated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EscalationTarget:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [channel, schedule] }
        id: { type: string, description: 'notification_channel id or oncall_schedule id' }
    EscalationStep:
      type: object
      required: [after_seconds, targets]
      properties:
        after_seconds: { type: integer, description: 'Offset from incident start at which this step fires (non-decreasing across steps).' }
        targets: { type: array, items: { $ref: '#/components/schemas/EscalationTarget' } }
    EscalationPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        repeat_last: { type: boolean, description: 'Repeat the last step on the monitor renotify cadence until acknowledged.' }
        steps: { type: array, items: { $ref: '#/components/schemas/EscalationStep' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateEscalationPolicy:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        repeat_last: { type: boolean }
        steps: { type: array, items: { $ref: '#/components/schemas/EscalationStep' } }
    OnCallSchedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        shift_seconds: { type: integer, description: 'Rotation period; e.g. 604800 for weekly.' }
        anchor_at: { type: string, format: date-time, description: 'Rotation epoch (slot 0 starts here).' }
        participants: { type: array, items: { type: string }, description: 'Ordered notification_channel ids in the rotation.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateOnCallSchedule:
      type: object
      required: [name, shift_seconds, anchor_at, participants]
      properties:
        name: { type: string }
        shift_seconds: { type: integer }
        anchor_at: { type: string, format: date-time }
        participants: { type: array, items: { type: string } }
    OnCallOverride:
      type: object
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreateOnCallOverride:
      type: object
      required: [channel_id, starts_at, ends_at]
      properties:
        channel_id: { type: string, description: 'notification_channel id that covers during the window' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        enabled: { type: boolean }
        text: { type: string }
        level: { type: string, enum: [info, warning, critical] }
    Branding:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        product_name: { type: string }
        accent_color: { type: string, description: '6-digit hex like #3b5bdb' }
        logo_url: { type: string }
        footer_text: { type: string }
        support_url: { type: string }
        announcement: { $ref: '#/components/schemas/Announcement' }
    PublicBranding:
      type: object
      properties:
        product_name: { type: string }
        accent_color: { type: string }
        logo_url: { type: string }
        footer_text: { type: string }
        support_url: { type: string }
        announcement: { $ref: '#/components/schemas/Announcement' }
    AuthPolicy:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        min_password_len: { type: integer }
        session_ttl_seconds: { type: integer }
        require_totp: { type: string, enum: [none, admins, all] }
        allowed_email_domains: { type: array, items: { type: string } }
    GlobalSilence:
      type: object
      properties:
        enabled: { type: boolean }
        until: { type: string, format: date-time, nullable: true }
    Alerting:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        global_silence: { $ref: '#/components/schemas/GlobalSilence' }
    MonitorDefaults:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        retries: { type: integer }
        failure_threshold: { type: integer }
        renotify_seconds: { type: integer }
        auto_incident: { type: boolean }
    MailSettingsView:
      type: object
      properties:
        configured: { type: boolean, readOnly: true }
        enabled: { type: boolean }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password_set: { type: boolean }
        from: { type: string }
        public_base_url: { type: string }
        deliverable: { type: boolean, readOnly: true }
    SetMailSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password: { type: string, nullable: true, description: 'Omit or send empty to keep the stored password.' }
        from: { type: string }
        public_base_url: { type: string }
    OIDCSettingsView:
      type: object
      description: Redacted read model for the OIDC settings API. The client secret is never returned, only whether one is stored.
      properties:
        configured: { type: boolean, description: 'A DB override row exists (the config file is no longer in effect).' }
        active: { type: boolean, description: 'The provider is currently built and serving logins.' }
        enabled: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        client_secret_set: { type: boolean }
        redirect_url: { type: string }
        scopes: { type: array, items: { type: string } }
        post_logout_url: { type: string }
        button_label: { type: string }
        bootstrap_admins: { type: array, items: { type: string } }
        reload_error: { type: string, description: 'Set when a save could not build the provider (e.g. IdP unreachable).' }
    SetOIDCSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        issuer: { type: string, description: 'Required when enabled.' }
        client_id: { type: string, description: 'Required when enabled.' }
        client_secret: { type: string, nullable: true, description: 'Omit or send empty to keep the stored secret.' }
        redirect_url: { type: string, description: 'Required when enabled.' }
        scopes: { type: array, items: { type: string } }
        post_logout_url: { type: string }
        button_label: { type: string }
        bootstrap_admins: { type: array, items: { type: string } }
    AlertmanagerPayload:
      type: object
      description: Subset of the Prometheus Alertmanager webhook payload (schema v4) consumed by the receiver.
      properties:
        alerts:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [firing, resolved] }
              fingerprint: { type: string, description: 'Stable per-alert identity used to correlate firing/resolved.' }
              labels: { type: object, additionalProperties: { type: string } }
              annotations: { type: object, additionalProperties: { type: string } }
    IncidentStatus:
      type: string
      enum: [investigating, identified, monitoring, resolved]
    IncidentImpact:
      type: string
      enum: [none, minor, major, critical]
    CreateIncident:
      type: object
      required: [title]
      properties:
        title: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        body: { type: string, description: 'Opening timeline message (markdown).' }
        monitor_id: { type: string, format: uuid, description: 'Optional affected monitor; must belong to this project.' }
    IncidentUpdate:
      type: object
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
    AddIncidentUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/IncidentStatus', description: 'Omit to keep the current status (a plain comment).' }
        body: { type: string, description: 'Markdown.' }
    Postmortem:
      type: object
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IncidentDetail:
      description: A resolved incident with its timeline and (optional) postmortem, for the status page's past-incidents accordion.
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          properties:
            updates: { type: array, items: { $ref: '#/components/schemas/IncidentUpdate' } }
            postmortem: { $ref: '#/components/schemas/Postmortem' }
    Subscribe:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PutPostmortem:
      type: object
      required: [body]
      properties:
        body: { type: string, description: 'Markdown analysis.' }
    Visibility:
      type: string
      enum: [public, internal, unlisted]
    ComponentStatus:
      type: string
      description: >-
        A component's displayed state. `no_data` (FR-021 §15.0) means measurement is ABSENT —
        nothing sealed, no SLI declared, a monitor never confirmed either way, or a manual
        component whose operator has said nothing. It is deliberately OUTSIDE the severity ladder:
        asking whether "we do not know" is better or worse than declared maintenance is a false
        comparison, so the page summary keeps measured and unmeasured apart instead of ordering
        them. An operator can never SET it — see ComponentSource and manual_status.
      enum: [operational, degraded, partial_outage, major_outage, maintenance, no_data]
    ComponentSource:
      type: string
      description: >-
        Which binding a component actually renders from (FR-021 §15.0). The source is a
        DISCRIMINATOR, not the presence of a column: the inactive binding stays DORMANT so a
        conversion can be reverted without re-choosing what it replaced.
      enum: [monitor, service, manual]
    PageSummaryState:
      type: string
      description: >-
        The page headline. It exists because one ComponentStatus cannot express "operational, but
        part of this page was not measured". `empty` is a page with no components — which before
        FR-021 phase 4 reported `operational`, i.e. all-clear with nothing configured.
      enum: [operational, impaired, no_data, empty]
    StatusPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        unlisted_token: { type: string, description: 'Present only for unlisted pages.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateStatusPage:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string }
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        project_id: { type: string, format: uuid, description: 'Omit for an org-level page.' }
    UpdateStatusPage:
      type: object
      description: 'Partial update; slug and org are immutable. Switching to unlisted mints a token, switching away clears it.'
      properties:
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        status_page_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        group: { type: string }
        position: { type: integer }
        org_id: { type: string, format: uuid, description: 'The component''s own tenant identity.' }
        source: { $ref: '#/components/schemas/ComponentSource' }
        source_project: { type: string, format: uuid, description: 'Project of the BINDINGS — not the page''s scope, since an org-level page may hold several projects.' }
        monitor_id: { type: string, format: uuid, description: 'The monitor binding. Present but DORMANT when source is not `monitor`.' }
        service_id: { type: string, format: uuid, description: 'The service binding. Present but DORMANT when source is not `service`.' }
        manual_status: { $ref: '#/components/schemas/ComponentStatus' }
        revision: { type: integer, format: int64, description: 'Structural CAS token for the conversion contract.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateComponent:
      type: object
      required: [name]
      description: >-
        The source is DERIVED from the bindings server-side, never taken from the caller; a
        service binding wins over a leftover monitor one. `manual_status` may not be `no_data`.
      properties:
        name: { type: string }
        description: { type: string }
        group: { type: string }
        position: { type: integer }
        monitor_id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        manual_status: { $ref: '#/components/schemas/ComponentStatus' }
    UpdateComponent:
      type: object
      required: [name]
      description: >-
        Presentation only. A component's SOURCE changes exclusively through the previewed,
        CAS-fenced conversion, and `manual_status` is ignored unless the source is `manual` — so an
        edit form that does not show a dormant status cannot destroy it.
      properties:
        name: { type: string }
        description: { type: string }
        group: { type: string }
        position: { type: integer }
        manual_status: { $ref: '#/components/schemas/ComponentStatus' }
    ConversionTarget:
      type: object
      required: [source]
      description: >-
        What the component should render from. On a REVERT the id may be omitted: the dormant
        binding is the target. `revision` and `page_generation` are required on confirm ONLY, and
        must be the pair a preview returned.
      properties:
        source: { $ref: '#/components/schemas/ComponentSource' }
        service_id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        manual_status: { $ref: '#/components/schemas/ComponentStatus' }
        revision: { type: integer, format: int64 }
        page_generation: { type: integer, format: int64 }
    ConversionPreview:
      type: object
      description: >-
        The component line and the page summary, BEFORE and AFTER, rendered with the SAME resolver
        the public page uses — a preview that predicted something else would defeat its purpose.
      properties:
        component: { $ref: '#/components/schemas/ComponentView' }
        proposed: { $ref: '#/components/schemas/ComponentView' }
        summary: { $ref: '#/components/schemas/PageSummary' }
        proposed_summary: { $ref: '#/components/schemas/PageSummary' }
        revision: { type: integer, format: int64 }
        page_generation: { type: integer, format: int64 }
        no_op: { type: boolean, description: 'The component already renders from that source; confirming changes nothing.' }
        reverts_to: { $ref: '#/components/schemas/ComponentSource' }
        notes: { type: array, items: { type: string }, description: 'Consequences the two summaries do not show.' }
    PageSummary:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/ComponentStatus' }
        summary_state: { $ref: '#/components/schemas/PageSummaryState' }
        unmeasured_count: { type: integer }
    CompositeConversion:
      type: object
      properties:
        service: { $ref: '#/components/schemas/Service' }
        monitor: { $ref: '#/components/schemas/Monitor' }
        already_converted: { type: boolean, description: 'The composite was already linked; the existing service is returned unchanged.' }
    ComponentDay:
      type: object
      description: One day of a component's 90-day availability strip.
      properties:
        day: { type: string, description: 'YYYY-MM-DD (UTC)' }
        uptime_percent: { type: number, format: double }
        total: { type: integer, format: int64 }
    ComponentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        group: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        uptime_90d: { type: number, format: double, nullable: true }
        daily: { type: array, items: { $ref: '#/components/schemas/ComponentDay' }, description: 'Per-day availability; empty for manual components. For a service source these are SEALED buckets only and the window ends at the service''s sealed watermark, so days without data are ABSENT rather than zero.' }
        source: { $ref: '#/components/schemas/ComponentSource' }
        reason: { type: string, description: 'AUTHENTICATED ONLY: why a status is not a measurement (`no_manual_status`, `monitor_never_confirmed`, `monitor_deleted`, `no_sli_declared`, `no_decidable_observation`, `excluded_by_maintenance`, `service_unreadable`).' }
        unavailable:
          type: boolean
          description: >-
            PUBLIC. The component's state could not be READ, as opposed to measurement being
            absent. It says something about cerbix, not about the customer's topology, and without
            it a failed read would be byte-identical to a calm `no_data` (§15.0, invariant 71a).
        withheld_reason:
          type: string
          description: >-
            PUBLIC. Why `uptime_90d` is absent, per §11.2/§11.3: `no_sli`, `nothing_sealed`,
            `window_precedes_materialization_era`, `storage_gap`, `zero_decidable_time`,
            `decidable_coverage_below_min`, `spans_definition_revisions`, `nothing_measured`. A
            missing number without its reason is indistinguishable from one nobody computed.
    StatusPageRender:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        summary: { $ref: '#/components/schemas/ComponentStatus', description: 'The worst MEASURED status. Unchanged in name and type; `no_data` when nothing was measured.' }
        summary_state: { $ref: '#/components/schemas/PageSummaryState' }
        unmeasured_count: { type: integer, description: 'How many components reported no measurement.' }
        components: { type: array, items: { $ref: '#/components/schemas/ComponentView' } }
        active_incidents: { type: array, items: { $ref: '#/components/schemas/IncidentDetail' } }
        recent_incidents: { type: array, items: { $ref: '#/components/schemas/IncidentDetail' }, description: 'Resolved in the last 90 days, newest first; each carries its timeline and postmortem (if published).' }
        maintenance: { type: array, items: { $ref: '#/components/schemas/MaintenanceWindow' }, description: 'Active or scheduled maintenance.' }
        updated_at: { type: string, format: date-time }
    AgentToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    ApiToken:
      type: object
      description: Service-account token metadata (never includes the secret).
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, description: 'Set for a project-scoped token.' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        actions:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            The token's ALLOW-LIST (FR-025 D12), always present: null means the role decides — every
            token that predates the list; a list (even empty) is intersected with the role inside the
            one central predicate. Immutable after create.
        created_by: { type: string }
        created_by_email: { type: string, description: 'Resolved issuer (list endpoint only).' }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreateApiToken:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        project_id: { type: string, format: uuid, description: 'Omit for an org-scoped token.' }
        actions:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            Optional allow-list (FR-025 D12). Omit or null: the role decides. Each entry must name an
            action of the central catalogue (else 400 `action_unknown`) that the token's role grants
            (else 400 `action_not_granted`) — the list only narrows. A CI token is `role: editor,
            actions: [gate:evaluate, change:record]`: it asks the gate and records changes and can do
            nothing else, not even read the service page. Written into the `token.create` audit row.
            Immutable: a different list is a new token.
    CreatedApiToken:
      type: object
      description: Issue response — the plaintext secret is present only here.
      properties:
        token: { type: string, description: 'The bearer secret. Shown once; store it now.' }
        api_token: { $ref: '#/components/schemas/ApiToken' }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, description: 'Set for a project-scoped webhook.' }
        url: { type: string }
        secret: { type: string, description: 'Present only in the create response.' }
        enabled: { type: boolean }
        created_by: { type: string }
        created_by_email: { type: string, description: 'Resolved issuer (list endpoint only).' }
        created_at: { type: string, format: date-time }
    CreateWebhook:
      type: object
      required: [url]
      properties:
        url: { type: string, description: 'http(s) endpoint to POST events to.' }
        secret: { type: string, description: 'HMAC signing secret; generated if omitted.' }
        project_id: { type: string, format: uuid, description: 'Omit for an org-wide webhook.' }
        enabled: { type: boolean, default: true }
    NotificationChannel:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { type: string, enum: [webhook, slack, telegram, email] }
        name: { type: string }
        config: { type: object, additionalProperties: { type: string }, description: 'Type-specific: url, or bot_token + chat_id.' }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateNotificationChannel:
      type: object
      required: [type, name, config]
      properties:
        type: { type: string, enum: [webhook, slack, telegram, email] }
        name: { type: string }
        config: { type: object, additionalProperties: { type: string } }
        enabled: { type: boolean, default: true }
    OutboxEvent:
      type: object
      description: A durably-queued outbound event (dead-letter view).
      properties:
        id: { type: string, format: uuid }
        topic: { type: string, enum: [incident_event, monitor_transition] }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        last_error: { type: string }
        payload: { type: object, description: 'Raw event payload (topic-specific).' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SearchHit:
      type: object
      description: One search result, scoped to what the caller may see.
      properties:
        type: { type: string, enum: [monitor, project, incident] }
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        label: { type: string }
        sub: { type: string }
